## Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
## Configuration cache is deliberately off for Phase 0. Enabling it is tracked as a follow-up so
## that the protobuf/KSP/AGP plugin combination can be validated first (see docs/architecture/build.md).
org.gradle.configuration-cache=false

## PRODUCT_SPEC 16.1: dependency verification. **On.**
##
## gradle/verification-metadata.xml carries 852 components and 1,540 SHA-256 checksums, generated by
## scripts/bootstrap-dependency-verification.sh against the resolved version set. `strict` means a
## checksum that does not match fails the build rather than being reported and ignored.
##
## `lenient` was tried and rejected while the components block was empty: it printed every resolved
## artifact as an unverified-artifact report on every build, burying the errors a developer actually
## needs to see. A gate that produces thousands of lines of noise is not a gate. That reasoning no
## longer applies now the checksums exist, and `strict` is what ADR-0006 asked for.
##
## Adding or upgrading a dependency now requires re-running the bootstrap script and committing the
## regenerated file alongside the version-catalog change. That is the cost of the guarantee.
org.gradle.dependency.verification=strict

## Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

## Android
android.useAndroidX=true
android.nonTransitiveRClass=true

## ShelfPlayer build flags
## PRODUCT_SPEC 16.3: Kotlin compiler warnings are errors in CI. Local builds stay warning-tolerant
## so a work-in-progress slice is still runnable; CI passes -Pshelfplayer.warningsAsErrors=true.
shelfplayer.warningsAsErrors=false
