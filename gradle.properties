## Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
## Configuration cache is deliberately off for Phase 0. Enabling it is tracked as a follow-up so
## that the protobuf/KSP/AGP plugin combination can be validated first (see docs/architecture/build.md).
org.gradle.configuration-cache=false

## PRODUCT_SPEC 16.1: dependency verification.
## Checksums in gradle/verification-metadata.xml are produced by
## scripts/bootstrap-dependency-verification.sh. Until that bootstrap has run against the pinned
## dependency set, verification stays in `lenient` mode: missing/incorrect checksums are reported
## but do not break the build. Flip to `strict` once the metadata is complete (ADR-0006).
org.gradle.dependency.verification=lenient

## Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

## Android
android.useAndroidX=true
android.nonTransitiveRClass=true

## ShelfPlayer build flags
## PRODUCT_SPEC 16.3: Kotlin compiler warnings are errors in CI. Local builds stay warning-tolerant
## so a work-in-progress slice is still runnable; CI passes -Pshelfplayer.warningsAsErrors=true.
shelfplayer.warningsAsErrors=false
