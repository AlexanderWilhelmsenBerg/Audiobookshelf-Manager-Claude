## Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
## Configuration cache is deliberately off for Phase 0. Enabling it is tracked as a follow-up so
## that the protobuf/KSP/AGP plugin combination can be validated first (see docs/architecture/build.md).
org.gradle.configuration-cache=false

## PRODUCT_SPEC 16.1: dependency verification.
##
## gradle/verification-metadata.xml carries the policy; the per-artifact checksums are produced by
## scripts/bootstrap-dependency-verification.sh, which needs a build that can reach every configured
## repository. Until that has run there is nothing to verify against, so the mode is `off`.
##
## `lenient` was tried and rejected: with an empty <components> it prints every resolved artifact as
## an unverified-artifact report on every build, which buries the errors a developer actually needs
## to see. A gate that produces thousands of lines of noise is not a gate.
##
## Flip to `strict` in the same commit that adds the generated checksums (ADR-0006).
org.gradle.dependency.verification=off

## Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

## Android
android.useAndroidX=true
android.nonTransitiveRClass=true

## ShelfPlayer build flags
## PRODUCT_SPEC 16.3: Kotlin compiler warnings are errors in CI. Local builds stay warning-tolerant
## so a work-in-progress slice is still runnable; CI passes -Pshelfplayer.warningsAsErrors=true.
shelfplayer.warningsAsErrors=false
