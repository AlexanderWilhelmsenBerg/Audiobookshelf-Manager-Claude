## Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
## Configuration cache is deliberately off for Phase 0. Enabling it is tracked as a follow-up so
## that the protobuf/KSP/AGP plugin combination can be validated first (see docs/architecture/build.md).
org.gradle.configuration-cache=false

## PRODUCT_SPEC 16.1: dependency verification. **On.**
##
## gradle/verification-metadata.xml carries 890 components and 1,618 SHA-256 checksums. `strict`
## means a checksum that does not match fails the build rather than being reported and ignored.
##
## Those two figures are a snapshot and go stale whenever a dependency moves; `./gradlew :app:sbom`
## prints the current component count, which is the number to trust over any prose.
##
## `lenient` was tried and rejected while the components block was empty: it printed every resolved
## artifact as an unverified-artifact report on every build, burying the errors a developer actually
## needs to see. A gate that produces thousands of lines of noise is not a gate. That reasoning no
## longer applies now the checksums exist, and `strict` is what ADR-0006 asked for.
##
## Adding or upgrading a dependency now requires recording its checksums and committing the regenerated
## file alongside the version-catalog change. That is the cost of the guarantee. For a *small* addition
## do not run the bootstrap script, which rewrites everything: run
## `./gradlew --write-verification-metadata sha256 <the task that failed>`, which merges only the missing
## entries — adding the instrumented tier appended exactly three components and touched nothing else.
org.gradle.dependency.verification=strict

## Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

## Android
android.useAndroidX=true
android.nonTransitiveRClass=true

## ShelfPlayer build flags
## PRODUCT_SPEC 16.3: Kotlin compiler warnings are errors in CI. Local builds stay warning-tolerant
## so a work-in-progress slice is still runnable; CI passes -Pshelfplayer.warningsAsErrors=true.
shelfplayer.warningsAsErrors=false
