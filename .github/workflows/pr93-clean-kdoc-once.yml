name: PR93 clean skip docs once

on:
  push:
    branches:
      - refactor/unified-resume-freshness
    paths:
      - .github/workflows/pr93-clean-kdoc-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
      - name: Move skip KDoc to the real skip function
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt"); t=p.read_text(); doc="    /**\n     * PRODUCT_SPEC PLAY-007 — the notification'"'"'s skip, which is the app'"'"'s skip.\n     *\n     * Expressed as a seek rather than as `Player.seekForward` for the same reason `PlaybackController` does:\n     * Media3'"'"'s own skip uses the increment fixed when the player was built, and PLAY-007'"'"'s is configurable\n     * per direction while the player is running.\n     *\n     * Media3 clamps the top end at the window'"'"'s duration; the bottom is clamped here, because a negative\n     * seek would be silently accepted as zero by some controllers and rejected by others.\n     */\n"; sig="    private fun skipBy(delta: Duration) {\n"; assert t.count(doc)==1, t.count(doc); assert t.count(sig)==1, t.count(sig); t=t.replace(doc,"",1); p.write_text(t.replace(sig,doc+sig,1))'
          git rm .github/workflows/pr93-clean-kdoc-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playback
          git commit -m 'Attach notification skip documentation to implementation'
          git push origin HEAD:refactor/unified-resume-freshness
