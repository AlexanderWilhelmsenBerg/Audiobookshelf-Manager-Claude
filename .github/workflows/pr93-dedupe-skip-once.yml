name: PR93 dedupe skip once

on:
  push:
    branches:
      - refactor/unified-resume-freshness
    paths:
      - .github/workflows/pr93-dedupe-skip-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
      - name: Keep one skip implementation with freshness invalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt"); t=p.read_text(); dup="    private fun skipBy(delta: Duration) {\n        val current = player ?: return\n        if (current.mediaItemCount == 0) return\n        // Issue #91 — notification skip reaches the raw player through a custom session command.\n        // Invalidate before moving so an older freshness answer cannot overwrite this explicit skip.\n        resumeFreshness.invalidate(ResumeInvalidation.Seek)\n        current.seekTo((current.bookPosition() + delta).inWholeMilliseconds.coerceAtLeast(0))\n    }\n\n"; old="    private fun skipBy(delta: Duration) {\n        val current = player ?: return\n        if (current.mediaItemCount == 0) return\n        current.seekTo((current.bookPosition() + delta).inWholeMilliseconds.coerceAtLeast(0))\n    }\n"; new="    private fun skipBy(delta: Duration) {\n        val current = player ?: return\n        if (current.mediaItemCount == 0) return\n        // Issue #91 — this custom notification command bypasses ResumeFreshnessPlayer.handleSeek.\n        resumeFreshness.invalidate(ResumeInvalidation.Seek)\n        current.seekTo((current.bookPosition() + delta).inWholeMilliseconds.coerceAtLeast(0))\n    }\n"; assert t.count(dup)==1, t.count(dup); t=t.replace(dup,"",1); assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))'
          ./gradlew ktlintFormat
          git rm .github/workflows/pr93-dedupe-skip-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playback
          git commit -m 'Deduplicate notification skip freshness wiring'
          git push origin HEAD:refactor/unified-resume-freshness
