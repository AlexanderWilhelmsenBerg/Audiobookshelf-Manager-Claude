name: PR 98 lint fix preview

on:
  push:
    branches:
      - diagnostic/pr98-lintfix-preview

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Apply lint safe fixes
        shell: bash
        run: |
          ./gradlew :app:lintFix || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test || true
          git commit -m "Preview Android lint safe fixes" || true
          git push
