name: PR 98 detekt diagnostic

on:
  push:
    branches:
      - diagnostic/pr98-detekt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diagnostic/pr98-detekt
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Capture detekt
        shell: bash
        run: |
          set +e
          ./gradlew :app:detektDebug :app:detektDebugUnitTest -Pshelfplayer.warningsAsErrors=true --stacktrace --console=plain > /tmp/pr98-detekt.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- last 500 lines ---"
            tail -n 500 /tmp/pr98-detekt.log
          } > .github/pr98-detekt-diagnostic.txt
          rm .github/workflows/pr98-detekt-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr98-detekt-diagnostic.txt .github/workflows/pr98-detekt-diagnostic.yml
          git commit -m 'Capture PR98 detekt diagnostic'
          git push origin HEAD:diagnostic/pr98-detekt
