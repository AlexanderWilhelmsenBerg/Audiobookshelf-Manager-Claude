name: Apply Phase 5 reconciliation patch

on:
  push:
    branches:
      - docs/bw-dep-01-phase5-reconciliation

permissions:
  contents: write

jobs:
  apply-reconciliation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply documentation reconciliation
        shell: bash
        run: |
          cat > /tmp/phase5-reconcile.patch <<'PATCH'
