name: Record Room 2.8.5 migration history

on:
  push:
    branches:
      - chore/bw-dep-01-room-2-8-5

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-room-2-8-5

      - name: Add PR 163 to the living ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("version-control.md")
          text = path.read_text()
          anchor = '| 2026-09-15 | #162 | Gradle wrapper | 8.14.3 | 8.14.5 | 🎯 Latest stable release in the accepted 8.14 maintenance line; Gradle 9 remains gated |'
          row = '| 2026-09-15 | #163 | AndroidX Room | 2.7.2 | 2.8.5 | 🎯 Latest stable target; schema/version unchanged |'
          if text.count(anchor) != 1:
              raise SystemExit("Expected exactly one #162 migration-history anchor")
          if row in text:
              raise SystemExit("#163 history row already present")
          path.write_text(text.replace(anchor, anchor + "\n" + row, 1))
          PY
          git diff --check -- version-control.md

      - name: Commit history row and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/record-room-2-8-5-history.yml
          git add version-control.md .github/workflows/record-room-2-8-5-history.yml
          git diff --cached --check
          git commit -m "docs: record Room 2.8.5 migration slice"
          git push
