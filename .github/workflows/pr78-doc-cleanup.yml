name: PR 78 documentation cleanup

on:
  push:
    branches:
      - claude/shelfplayer-android-auth-lk77fv

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Trigger exact PR 78 documentation cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/shelfplayer-android-auth-lk77fv
          fetch-depth: 0

      - name: Apply asserted documentation-only replacements
        shell: python
        run: |
          from pathlib import Path

          risks = Path('docs/risks.md')
          text = risks.read_text(encoding='utf-8')

          old_r78 = '**What remains true and is now R-81**: the button cannot open a *list*, so it steps, and the full list stays a browse tab.'
          new_r78 = 'That design was later superseded by ADR-0029 / PR #78: R-81 records the retirement of whole-list cycling.'
          if text.count(old_r78) != 1:
              raise SystemExit(f'Expected exactly one R-78 historical sentence, found {text.count(old_r78)}')
          text = text.replace(old_r78, new_r78)

          old_r81 = '| R-81 | **The car\'s button steps rather than choosing, and a driver cannot see what the next press will select.** No API opens a browse node from a custom action and the Android Auto player template has no submenu, so a button can only send a command. The order is `[Automatic] + connected outputs`. | A driver wanting a specific output may press past it, and each press moves the audio on the way. With the two or three outputs a car actually has this is quick and reversible; with more it is a poor way to reach the last one. The button carries its current destination in its name and icon, which is what makes the stepping legible rather than blind. | The **browse tab** is the mitigation and is not redundant with the button: it shows every destination at once, marks the route and the choice separately, and is one swipe from the player. Retiring this needs Android Auto to gain either a submenu on the player or a navigate-to-node command; neither exists. Accepted deliberately over the alternative the register used to prescribe, which was no button at all (R-78). |'
          new_r81 = '| R-81 | **Closed 2026-09-07 — ADR-0029 / PR #78 replaced whole-list output cycling with explicit Car and Headset actions.** The old risk described one button stepping through `[Automatic] + connected outputs`; that mechanism (`AudioOutputCycle`) no longer exists. Car now selects Automatic/platform routing, Headset steps only eligible headset candidates, and speaker/unknown may leave both output glyphs unlit rather than being mislabeled as Car. | The specific “press past the output you wanted” failure from whole-list cycling is gone. Residual routing uncertainty is different and already recorded separately: classic A2DP identity can be ambiguous; R-107 covers head-unit rendering of active/inactive glyphs; R-108 / #100 covers stale headset ownership after explicit phone-speaker selection. | Done by ADR-0029 / #78. Keep this row closed as history; do not reopen it to describe the new routing model. |'
          if text.count(old_r81) != 1:
              raise SystemExit(f'Expected exactly one stale R-81 row, found {text.count(old_r81)}')
          risks.write_text(text.replace(old_r81, new_r81), encoding='utf-8')

          service = Path('playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt')
          text = service.read_text(encoding='utf-8')
          old_kdoc = ' * implementation rejects. Wave 5 answers it: [AutoLibrary] builds three tabs — Continue, Chapters,\n * History — and [LibraryCallback] serves them.'
          new_kdoc = ' * implementation rejects. Wave 5 answers it: [AutoLibrary] builds four stable root destinations —\n * Continue, Chapters, History, Library — and [LibraryCallback] serves them.'
          if text.count(old_kdoc) != 1:
              raise SystemExit(f'Expected exactly one stale PlaybackService browse KDoc, found {text.count(old_kdoc)}')
          service.write_text(text.replace(old_kdoc, new_kdoc), encoding='utf-8')

      - name: Remove one-shot workflow and verify diff
        run: |
          rm .github/workflows/pr78-doc-cleanup.yml
          git diff --check
          git diff -- docs/risks.md playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/risks.md playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt .github/workflows/pr78-doc-cleanup.yml
          git commit -m 'Reconcile PR 78 routing documentation'
          git push origin HEAD:claude/shelfplayer-android-auth-lk77fv
