name: Sync APK PR picker

# `workflow_dispatch.choice` options are static YAML. Keep that static list aligned with the repository's
# open same-repository pull requests, so Build APK can offer a real dropdown without a person editing it.
#
# Security: `pull_request_target` deliberately runs the trusted workflow from `main`; no PR branch is ever
# checked out or executed here. Fork PRs are filtered out before they become choices. Updating a file under
# `.github/workflows` requires a token with Workflows write permission, which the built-in GITHUB_TOKEN
# cannot receive. `BOOKWAVE_WORKFLOW_SYNC_TOKEN` is therefore used only for the final push; PR discovery
# still uses the short-lived read-only GITHUB_TOKEN.
on:
  # Bootstrap immediately when this synchronizer first lands, or when its generator changes later.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apk.yml'
      - '.github/workflows/sync-apk-pr-options.yml'
      - '.github/scripts/sync_apk_pr_options.py'

  pull_request_target:
    types:
      - opened
      - closed
      - reopened

  # Escape hatch if the picker ever needs to be regenerated by hand.
  workflow_dispatch:

concurrency:
  group: sync-apk-pr-picker
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    name: Refresh open PR choices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Do not persist GITHUB_TOKEN credentials: the final workflow-file push must use the dedicated
          # token below, otherwise Git rejects the update for lacking Workflows write permission.
          persist-credentials: false

      - name: Read current open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--paginate` returns one JSON array per page; slurp/add turns that into the single array the
          # generator consumes. The generator applies the same-repository filter before emitting choices.
          gh api --paginate --method GET \
            "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/open-prs.json"

      - name: Regenerate the Build APK picker
        run: python3 .github/scripts/sync_apk_pr_options.py "$RUNNER_TEMP/open-prs.json"

      - name: Validate the generated workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/apk.yml').read_text(encoding='utf-8')
          expression_open = '$' + '{{'
          required = (
              'run-name: "' + expression_open + ' inputs.pull_request',
              'type: choice',
              '# BEGIN GENERATED OPEN PR OPTIONS',
              '# END GENERATED OPEN PR OPTIONS',
              'REQUESTED_PR: ' + expression_open + ' inputs.pull_request }}',
          )
          missing = [part for part in required if part not in text]
          if missing:
              raise SystemExit(f'generated apk.yml is missing: {missing}')
          PY

      - name: Commit the refreshed picker
        env:
          GH_TOKEN: ${{ secrets.BOOKWAVE_WORKFLOW_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/apk.yml; then
            echo "APK PR picker is already current."
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::BOOKWAVE_WORKFLOW_SYNC_TOKEN is not configured; the APK PR dropdown was not refreshed."
            {
              echo "### APK PR picker not refreshed"
              echo
              echo "The generated choices changed, but \`BOOKWAVE_WORKFLOW_SYNC_TOKEN\` is not configured."
              echo "Add a fine-grained token with **Contents: read/write** and **Workflows: read/write**,"
              echo "then rerun **Sync APK PR picker**. See \`docs/release.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apk.yml
          git commit -m 'Refresh APK pull request choices'

          # `actions/checkout` did not persist GITHUB_TOKEN credentials, so gh installs the dedicated
          # fine-grained token as Git's credential helper for this push. A PAT-authenticated workflow-file
          # update can trigger this sync workflow once more; that second run sees no diff and exits.
          gh auth setup-git
          git push origin HEAD:main
