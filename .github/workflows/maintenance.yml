name: Maintenance

run-name: "Maintenance · ${{ inputs.task }}"

# Rare/manual repository maintenance lives here so the Actions sidebar stays focused on
# the four operational workflows: PR CI, Main, Build APK and Build BookWave CI image.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        type: choice
        required: true
        default: contract-capture
        options:
          - contract-capture
          - codex-compatibility
          - cleanup-retired-workflows
      server_image:
        description: Audiobookshelf image for contract capture
        required: false
        default: ghcr.io/advplyr/audiobookshelf:2.36.0
      cleanup_dry_run:
        description: List retired workflows without disabling them
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  capture:
    if: ${{ inputs.task == 'contract-capture' }}
    name: Capture Audiobookshelf contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Not a `services:` block: the server needs its config and metadata directories to exist before
      # it starts, and a plain `docker run` keeps the setup visible in the log rather than hidden in
      # runner configuration.
      - name: Start Audiobookshelf
        env:
          SERVER_IMAGE: ${{ inputs.server_image || 'ghcr.io/advplyr/audiobookshelf:2.36.0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/abs/config" "$RUNNER_TEMP/abs/metadata" "$RUNNER_TEMP/abs/audiobooks"
          docker run -d --name audiobookshelf \
            -p 13378:80 \
            -v "$RUNNER_TEMP/abs/config:/config" \
            -v "$RUNNER_TEMP/abs/metadata:/metadata" \
            -v "$RUNNER_TEMP/abs/audiobooks:/audiobooks" \
            "$SERVER_IMAGE"
          echo "SERVER_IMAGE=$SERVER_IMAGE" >> "$GITHUB_ENV"

      - name: Record the server version under test
        run: |
          for _ in $(seq 1 60); do
            if curl -sSf --max-time 3 http://localhost:13378/healthcheck >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sS http://localhost:13378/status | tee /tmp/status.json
          echo
          docker image inspect "$SERVER_IMAGE" --format 'digest={{index .RepoDigests 0}}' || true

      # Without media the scanner produces no library item, and the shapes LIB-001 maps — the item, its
      # audio files, its chapters — cannot be captured at all. The file is generated by the server
      # image's own ffmpeg, so this step adds no dependency the job did not already have.
      - name: Seed the media the scan needs
        run: |
          chmod +x scripts/seed-contract-media.sh
          ./scripts/seed-contract-media.sh "$RUNNER_TEMP/abs/audiobooks" "$SERVER_IMAGE"

      - name: Capture contracts
        env:
          # The path as the *server* sees it, which is the container mount, not the runner path.
          CONTRACT_MEDIA_PATH: /audiobooks
        run: |
          chmod +x scripts/capture-contracts.sh
          ./scripts/capture-contracts.sh http://localhost:13378 "$RUNNER_TEMP/captured"

      # The captured fixtures must contain no credential. This is a hard gate rather than a review
      # note, because the files are committed and a leaked token in git history is not retractable.
      - name: Fixtures carry no credentials
        run: |
          python3 - "$RUNNER_TEMP/captured" <<'PY'
          import json, pathlib, re, sys

          SECRET_KEYS = {"token", "accessToken", "refreshToken", "refresh_token",
                         "access_token", "password", "pash", "authToken", "apiKey"}
          JWT = re.compile(r"eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.")
          problems = []

          def walk(node, key, where):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, k, where)
              elif isinstance(node, list):
                  for v in node:
                      walk(v, key, where)
              elif isinstance(node, str):
                  if key in SECRET_KEYS and not node.startswith("<redacted"):
                      problems.append(f"{where}: {key!r} still holds a value")
                  if JWT.search(node):
                      problems.append(f"{where}: {key!r} looks like a JWT")

          files = sorted(pathlib.Path(sys.argv[1]).rglob("*.json"))
          if not files:
              sys.exit("::error::No fixtures were captured.")
          for path in files:
              walk(json.loads(path.read_text()), None, path.name)

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"No credential-shaped values in {len(files)} captured fixtures.")
          PY

      - name: Compare against the committed fixtures
        id: compare
        run: |
          committed=core/network/src/test/resources/contracts
          if [ ! -d "$committed" ]; then
            echo "::notice::No committed contracts yet — download the artifact and commit it."
            exit 0
          fi
          # Three findings share one directory comparison, and they need three different reactions.
          # Comparing file by file is what keeps them apart.
          #
          # **Drift** — a fixture in both, with different contents — is the failure this job exists to
          # catch: the server now answers something other than what the adapter was written against.
          #
          # **A new capture target** exists only in the capture, because somebody added an endpoint to the
          # script and its fixture has never been committed. That is the expected state of the pull
          # request that adds it, not a failure.
          #
          # **A skipped target** exists only in the committed set, because this run could not capture it.
          # One capture leaves the server — the candidate search makes the configured metadata provider
          # answer — and Google Books answers `429` to GitHub Actions' address ranges on every run. The
          # capture script writes nothing when the provider returns nothing, so the committed evidence
          # from a real deployment survives instead of being overwritten with an empty list.
          #
          # That last case is why this is not one `diff -ru`. It was, and the job was red on every run
          # from a disagreement nobody could fix — which is worse than a job that does not run, because a
          # permanently failing check teaches people to ignore a failing check. See docs/risks.md R-15.
          drifted=""
          for file in $(cd "$RUNNER_TEMP/captured" && find . -name '*.json' | sort); do
            if [ -f "$committed/$file" ]; then
              diff -u "$committed/$file" "$RUNNER_TEMP/captured/$file" || drifted="$drifted $file"
            fi
          done

          skipped="$(comm -23 \
            <(cd "$committed" && find . -name '*.json' | sort) \
            <(cd "$RUNNER_TEMP/captured" && find . -name '*.json' | sort))"
          if [ -n "$skipped" ]; then
            echo "::notice::Not captured this run, so not compared:"
            echo "$skipped"
          fi

          added="$(comm -13 \
            <(cd "$committed" && find . -name '*.json' | sort) \
            <(cd "$RUNNER_TEMP/captured" && find . -name '*.json' | sort))"
          if [ -n "$added" ]; then
            echo "::notice::New capture targets, never committed before:"
            echo "$added"
            # Printed in full, not just named. A new fixture is the answer to a question somebody asked
            # by adding it to the capture script — "what does this endpoint actually return?" — and the
            # answer belongs where the question is being reviewed rather than inside a zip.
            #
            # Safe because of the ordering: the credential gate above has already run over these files
            # and failed the job if any value survived redaction. Nothing reaches this line unscrubbed.
            for file in $added; do
              echo "::group::$file"
              head -c 20000 "$RUNNER_TEMP/captured/$file"
              echo
              echo "::endgroup::"
            done
          fi
          if [ -z "$drifted" ]; then
            echo "Every fixture this run captured matches what is committed."
            exit 0
          fi
          echo "::error::These captured contracts differ from the committed ones:$drifted"
          echo "Download the captured-contracts artifact, review the diff, and commit the update."
          exit 1

      - name: Upload captured contracts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captured-contracts
          path: ${{ runner.temp }}/captured/**
          if-no-files-found: warn
          retention-days: 14

      - name: Server log on failure
        if: failure()
        run: docker logs audiobookshelf 2>&1 | tail -100
  codex-bootstrap:
    if: ${{ inputs.task == 'codex-compatibility' }}
    name: JDK 21 Codex bootstrap + verifyDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up verified Codex JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # The workflow asks the bootstrap for its cheap maintenance path, then runs the real gate itself.
      # This distinguishes "environment could not be prepared" from "BookWave failed verification" and
      # avoids running verifyDebug twice.
      - name: Prepare Codex environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
        run: bash scripts/codex/setup.sh

      - name: Show prepared tool versions
        run: |
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$HOME/.local/bin/gitleaks" version
          ./gradlew --version

      - name: Verify BookWave on JDK 21
        run: ./gradlew verifyDebug --continue -Pshelfplayer.warningsAsErrors=true

      - name: Room schema is committed and current
        if: always()
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Codex verification changed committed Room schemas."
            echo "$changes"
            exit 1
          fi


  cleanup-retired-workflows:
    if: ${{ inputs.task == 'cleanup-retired-workflows' }}
    name: Disable retired workflow identities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Disable workflow identities whose files no longer exist
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.cleanup_dry_run }}
        run: |
          set -euo pipefail

          disabled=0
          candidates=0

          while IFS=$'\t' read -r id path name state; do
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                ;;
              *)
                # Keep GitHub-managed workflows such as Dependabot's dependency graph.
                continue
                ;;
            esac

            if [ -f "$path" ] || [ "$state" != "active" ]; then
              continue
            fi

            candidates=$((candidates + 1))
            echo "retired: $name ($id) -> $path"

            if [ "$DRY_RUN" != "true" ]; then
              gh api --method PUT \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
              disabled=$((disabled + 1))
            fi
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
              --jq '.workflows[] | [.id, .path, .name, .state] | @tsv'
          )

          {
            echo "### Retired workflow cleanup"
            echo
            echo "- Candidates: $candidates"
            echo "- Disabled: $disabled"
            echo "- Dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

