name: One-time playback session opener wiring

on:
  push:
    branches:
      - fix/playback-session-renewal
    paths:
      - .github/workflows/one-time-wire-playback-session-opener.yml

permissions:
  contents: write

jobs:
  wire-playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/playback-session-renewal

      - name: Wire session opener into phone and media service
        run: python .github/scripts/one_time_wire_playback_session_opener.py

      - name: Commit wiring
        run: |
          git config user.name "bookwave-auth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackController.kt \
                  playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt
          git commit -m "Use renewed playback sessions across media entry points"
          git push origin HEAD:fix/playback-session-renewal
