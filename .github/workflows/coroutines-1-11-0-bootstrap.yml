name: Coroutines 1.11.0 compatibility bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-coroutines-1-11-0

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-coroutines-1-11-0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply coroutines compatibility slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('gradle/libs.versions.toml')
          text = catalog.read_text()
          old = 'kotlinxCoroutines = "1.10.2"'
          new = 'kotlinxCoroutines = "1.11.0"'
          if old not in text:
              raise SystemExit(f'expected catalog pin not found: {old}')
          catalog.write_text(text.replace(old, new, 1))

          ledger = Path('version-control.md')
          text = ledger.read_text()
          old_base = '**Repository baseline checked:** `main` at `72cabb1e36d8597eaf6f303e159f0c88615f395c`'
          new_base = '**Repository baseline checked:** `main` at `05d87933d313209c34e5ebafd684edf36be92f57`'
          if old_base not in text:
              raise SystemExit('expected ledger baseline not found')
          text = text.replace(old_base, new_base, 1)
          old_row = '| `kotlinxCoroutines` | 1.10.2 | 1.11.0 | ⬆️ Phase 5 runtime update with cancellation/concurrency regression coverage. | 5 | 2026-09-15 | [kotlinx.coroutines releases](https://github.com/Kotlin/kotlinx.coroutines/releases) |'
          new_row = '| `kotlinxCoroutines` | 1.11.0 | 1.11.0 | ✅ Latest stable reached in the active Phase 5 slice after cancellation/concurrency regression coverage. Upstream 1.11.0 is built with Kotlin 2.2.20; BookWave remains on Kotlin 2.2.0 pending the gated compiler migration, so the full BookWave gate is required evidence for this compatibility slice. | 5 | 2026-09-15 | [kotlinx.coroutines releases](https://github.com/Kotlin/kotlinx.coroutines/releases) |'
          if old_row not in text:
              raise SystemExit('expected coroutines ledger row not found')
          text = text.replace(old_row, new_row, 1)
          room_history = '| 2026-09-15 | #163 | AndroidX Room | 2.7.2 | 2.8.5 | 🎯 Latest stable target; schema/version unchanged |'
          serialization_history = '| 2026-09-15 | #164 | kotlinx.serialization | 1.8.1 | 1.9.0 | 🎯 Latest stable compatible with the current Kotlin 2.2.0 compiler line |'
          if serialization_history not in text:
              if room_history not in text:
                  raise SystemExit('expected history insertion point not found')
              text = text.replace(room_history, room_history + '\n' + serialization_history, 1)
          ledger.write_text(text)

          plan = Path('docs/latest-stable-upgrade-plan.md')
          text = plan.read_text()
          room_completed = '| #163 | AndroidX Room | 2.7.2 | 2.8.5 | 2026-09-15 |'
          serialization_completed = '| #164 | kotlinx.serialization | 1.8.1 | 1.9.0 | 2026-09-15 |'
          if serialization_completed not in text:
              if room_completed not in text:
                  raise SystemExit('expected completed-slice insertion point not found')
              text = text.replace(room_completed, room_completed + '\n' + serialization_completed, 1)
          old_phase = ('**Status: active in compatibility-sized slices.** The current Kotlin 2.2.0 foundation can take\n'
                       'kotlinx.serialization 1.9.0 independently because that stable release is based on Kotlin 2.2.0. Stable\n'
                       'kotlinx.serialization 1.10.0 moved to Kotlin 2.3.0 and 1.11.0 is based on Kotlin 2.3.20, so those later\n'
                       'releases remain behind the compiler/build-foundation re-resolution rather than being forced into this slice.\n')
          new_phase = ('**Status: active in compatibility-sized slices.** kotlinx.serialization 1.9.0 landed in PR #164 as the newest\n'
                       'stable release aligned with BookWave’s current Kotlin 2.2.0 compiler line. The next independent runtime probe is\n'
                       'kotlinx.coroutines 1.11.0: upstream builds it with Kotlin 2.2.20, so BookWave must prove compatibility on Kotlin\n'
                       '2.2.0 through the full rerun gate rather than assuming patch-level compiler compatibility. Stable\n'
                       'kotlinx.serialization 1.10.0+ remains behind the compiler/build-foundation re-resolution.\n')
          if old_phase not in text:
              raise SystemExit('expected Phase 5 status text not found')
          plan.write_text(text.replace(old_phase, new_phase, 1))
          PY

      - name: Generate verification metadata and run required gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintCheck --rerun-tasks --write-verification-metadata sha256
          ./gradlew verifyDebug --continue --rerun-tasks -Pshelfplayer.warningsAsErrors=true --write-verification-metadata sha256

          schema_changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$schema_changes" ]; then
            echo "::error::Coroutines dependency upgrade changed committed Room schemas."
            echo "$schema_changes"
            exit 1
          fi

      - name: Commit permanent compatibility slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml gradle/verification-metadata.xml version-control.md docs/latest-stable-upgrade-plan.md
          git diff --cached --check
          git commit -m "chore(deps): upgrade kotlinx.coroutines to 1.11.0"
          git push
