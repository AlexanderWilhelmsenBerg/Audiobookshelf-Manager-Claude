name: Generate Retrofit 3 verification metadata

on:
  push:
    branches:
      - chore/bw-dep-01-retrofit-3-0-0

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-retrofit-3-0-0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Generate and commit verification metadata
        run: |
          ./gradlew :core:network:dependencies --configuration debugRuntimeClasspath --write-verification-metadata sha256
          git diff --quiet -- gradle/verification-metadata.xml && {
            echo "Expected Retrofit 3 verification metadata changes were not produced."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "chore(deps): verify Retrofit 3 artifacts"
          git push origin HEAD:chore/bw-dep-01-retrofit-3-0-0
