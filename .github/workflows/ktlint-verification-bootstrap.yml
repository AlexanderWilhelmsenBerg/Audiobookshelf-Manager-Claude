name: Ktlint verification bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ktlint-verification-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate ktlint plugin verification metadata
    if: github.head_ref == 'chore/bw-dep-01-ktlint-plugin-14-2-0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Resolve ktlint configuration and write verification metadata
        run: ./gradlew :app:dependencies --configuration ktlint --write-verification-metadata sha256

      - name: Commit generated verification metadata
        shell: bash
        run: |
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo 'No verification metadata changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): trust ktlint Gradle plugin 14.2.0 artifacts'
          git push origin HEAD:${{ github.head_ref }}
