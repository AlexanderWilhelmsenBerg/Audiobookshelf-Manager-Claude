name: Gradle 8.14.5 maintenance bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-gradle-8-14-5

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply Gradle maintenance and documentation reconciliation
        shell: python
        run: |
          from pathlib import Path
          import re

          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          text = wrapper.read_text().replace("gradle-8.14.3-bin.zip", "gradle-8.14.5-bin.zip")
          checksum = "distributionSha256Sum=6f74b601422d6d6fc4e1f9a1ab6522f642c2fdcbc15ae33ebd30ba3d7198e854\n"
          if "distributionSha256Sum=" not in text:
              text = text.replace("distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.5-bin.zip\n", "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.5-bin.zip\n" + checksum)
          wrapper.write_text(text)

          ledger = Path("version-control.md")
          lines = ledger.read_text().splitlines()
          replacements = {
              "**Repository baseline checked:**": "**Repository baseline checked:** `main` at `b4b7a38c82c26ede61322aac7ff2d1beb4c36a41`",
              "| Gradle wrapper |": "| Gradle wrapper | 8.14.5 | 9.7.1 | 🎯 Current on the latest Gradle 8.14 maintenance release while ADR-0011 gates the Gradle 9 / AGP 9 foundation. The 8.14.5 binary distribution is SHA-256 pinned in the wrapper properties. | 1 | 2026-09-15 | [Gradle 8.14.5 release notes](https://docs.gradle.org/8.14.5/release-notes.html) |",
              "| GitHub CI JDK |": "| GitHub CI JDK | Temurin 17 major line | Temurin 26.0.2.1 | 🎯 Intentional minimum-runtime lane. Current 17.x security patch is 17.0.20.1; keep this lane while Java 17 remains the repository bytecode/minimum Gradle runtime baseline. | 8 | 2026-09-15 | [Adoptium CSPU](https://adoptium.net/news/2026/09/eclipse-temurin-8u504-110321-170201-210121-25041-26021-available) |",
              "| Codex JDK |": "| Codex JDK | Temurin 21 major line | Temurin 26.0.2.1 | 🎯 JDK 21 is the newest fully verified BookWave baseline. Gradle 8.14.5 officially runs through Java 24; Java 25 requires Gradle 9.1+ and Java 26 requires Gradle 9.4+, so re-probe modern JDKs only after the gated build-foundation migration. | 8 | 2026-09-15 | [Gradle Java compatibility](https://docs.gradle.org/current/userguide/compatibility.html) |",
              "| `androidxActivity` |": "| `androidxActivity` | 1.13.0 | 1.13.0 | ✅ Current; merged in PR #161 after full CI and focused device smoke passed. It resolves Core/Core-KTX 1.18.0 transitively on the current API-36 foundation. | 3 | 2026-09-15 | [Activity releases](https://developer.android.com/jetpack/androidx/releases/activity) |",
              "| `androidxCore` |": "| `androidxCore` | 1.17.0 direct pin; 1.18.0 resolved via Activity 1.13.0 | 1.19.0 | ⬆️ PR #161 proved the resolved Core 1.18.0 graph on BookWave's compileSdk 36. Keep the explicit direct-pin move to stable 1.19.0 as the next separate Phase 3 AndroidX slice. | 3 | 2026-09-15 | [Core releases](https://developer.android.com/jetpack/androidx/releases/core) |",
              "| `androidxLifecycle` |": "| `androidxLifecycle` | 2.10.0 | 2.11.0 | ⛔ Lifecycle 2.11 Compose artifacts compile against API 37 and require AGP 9.2+, so this follows the ADR-0011 platform/build-foundation gate. | 3 | 2026-09-15 | [Lifecycle releases](https://developer.android.com/jetpack/androidx/releases/lifecycle) |",
              "| 2026-09-15 | #161 | AndroidX Activity |": "| 2026-09-15 | #161 | AndroidX Activity | 1.12.4 | 1.13.0 | ✅ Latest stable reached |",
          }
          for i, line in enumerate(lines):
              for prefix, new_line in replacements.items():
                  if line.startswith(prefix):
                      lines[i] = new_line
                      break
          ledger.write_text("\n".join(lines) + "\n")

          plan = Path("docs/latest-stable-upgrade-plan.md")
          text = plan.read_text()
          if "| #161 | AndroidX Activity |" not in text:
              text = text.replace("| #158 | Protobuf Gradle plugin | 0.9.5 | 0.10.0 | 2026-09-15 |\n", "| #158 | Protobuf Gradle plugin | 0.9.5 | 0.10.0 | 2026-09-15 |\n| #161 | AndroidX Activity | 1.12.4 | 1.13.0 | 2026-09-15 |\n")
          text = text.replace(
              "## Phase 1 — Gradle and Android build foundation\n\nUpgrade the build foundation before libraries.",
              "## Phase 1 — Gradle and Android build foundation\n\n**Status: major foundation gated; Gradle 8 maintenance remains executable.** ADR-0011 still blocks the Gradle 9 / AGP 9\nfoundation, but it does not justify leaving the accepted Gradle 8.14 line on an obsolete patch. BookWave therefore\ntracks the latest stable 8.14.x maintenance release independently while the major foundation gate remains in force.\n\nUpgrade the build foundation before libraries.",
          )
          text = text.replace(
              "1. Upgrade the Gradle wrapper to the latest stable version recorded in `/version-control.md`.\n2. Run wrapper validation and inspect the Gradle 9 upgrade warnings.",
              "1. Keep the current accepted Gradle major/minor line on its latest stable maintenance release while ADR-0011 blocks the major foundation; when the gate clears, re-resolve the latest mutually compatible Gradle/AGP tuple from `/version-control.md`.\n2. Run wrapper validation and inspect Gradle upgrade warnings.",
          )
          text = re.sub(
              r"Then run the Codex JDK probe again\..*?not the highest one that can launch Gradle\.",
              "Then run the Codex JDK probe again. Test every currently relevant stable/LTS JDK from 21 through the newest JDK\nsupported by the upgraded Gradle/AGP combination. Select the **highest JDK that passes the whole BookWave\ngate**, not the highest one that can launch Gradle. As of 2026-09-15, Gradle 8.14.x officially runs through Java 24;\nJava 25 requires Gradle 9.1+ and Java 26 requires Gradle 9.4+, so the current JDK 21 Codex baseline should not be\npromoted merely because a newer JDK exists.",
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"(## Phase 3 — Android platform, Compose and general AndroidX\n\n).*?(\n\nResolve the latest stable Android SDK)",
              r"\1**Status: partially active.** The AGP 9 / API 37 portion remains gated by ADR-0011, but independent AndroidX\nreleases may proceed as narrow slices only when the current API-36 gates prove compatibility. PR #161 merged\nAndroidX Activity 1.13.0 after full CI and focused device smoke passed; that slice also proved the transitively resolved\nCore/Core-KTX 1.18.0 graph on BookWave's compileSdk 36. The next independent AndroidX slice is the explicit Core\ndirect-pin move to stable 1.19.0. Activity 1.14 remains prerelease and is excluded.\n\nLifecycle 2.11 Compose artifacts compile against API 37 and require AGP 9.2+, so Lifecycle now follows the same\nADR-0011 platform/build-foundation gate rather than remaining an independent Phase-3 bump.\2",
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              "After the upgraded build stack is green, re-run the modern-JDK compatibility matrix and update\n`CODEX_ENV_JAVA_VERSION` to the highest fully passing stable JDK.",
              "After the upgraded build stack is green, re-run the modern-JDK compatibility matrix and update\n`CODEX_ENV_JAVA_VERSION` to the highest fully passing supported stable/LTS JDK. Do not move the Codex baseline\nfrom JDK 21 to a short-lived newer feature release merely to increase the version number; as of 2026-09-15 Java 25\nrequires Gradle 9.1+ to run Gradle and Java 26 requires Gradle 9.4+.",
          )
          plan.write_text(text)

          agents = Path("AGENTS.md")
          text = agents.read_text()
          text = re.sub(
              r"JDK 21 is deliberate\..*?compatibility merely because Gradle itself starts\.",
              "JDK 21 is deliberate. A compatibility matrix run on 2026-09-08 proved that the complete BookWave gate\npasses on JDK 21. JDK 22, 23 and 24 all prepared the same Codex environment successfully but failed\n`verifyDebug` on the then-current Gradle 8.14.3 / AGP 8.12.0 / Kotlin 2.2.0 stack. BookWave now keeps the\nGradle 8.14 line on its latest maintenance patch, but that does not by itself promote the JDK baseline: Gradle\n8.14.x officially runs through Java 24, Java 25 requires Gradle 9.1+, and Java 26 requires Gradle 9.4+.\nBookWave still targets Java 17 bytecode, while normal GitHub CI stays on JDK 17 to exercise the minimum\nsupported runtime. Re-probe newer JDKs after the staged build-tool migration in\n`docs/latest-stable-upgrade-plan.md`; do not infer compatibility merely because Gradle itself starts.",
              text,
              count=1,
              flags=re.S,
          )
          agents.write_text(text)

      - name: Commit maintenance slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.properties version-control.md docs/latest-stable-upgrade-plan.md AGENTS.md
          git diff --cached --quiet && { echo "No maintenance changes produced"; exit 1; }
          git commit -m "chore(build): upgrade Gradle maintenance to 8.14.5"
          git push