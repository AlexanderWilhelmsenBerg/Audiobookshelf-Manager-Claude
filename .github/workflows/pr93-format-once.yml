name: PR93 format once

on:
  push:
    branches:
      - refactor/unified-resume-freshness
    paths:
      - .github/workflows/pr93-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Apply repository formatting
        run: ./gradlew ktlintFormat
      - name: Commit formatted source only
        run: |
          set -euo pipefail
          git rm .github/workflows/pr93-format-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app playback docs
          git commit -m 'Format unified resume freshness wiring'
          git push origin HEAD:refactor/unified-resume-freshness
