name: Ktlint 1.8 formatting bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-ktlint-engine-1-8-0
    paths:
      - '.github/workflows/ktlint-1-8-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    name: Apply ktlint 1.8 mechanical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ktlint-engine-1-8-0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Repair final known non-attached KDoc identified by ktlint 1.8
        shell: python
        run: |
          from pathlib import Path

          path = Path('core/database/src/main/kotlin/com/example/shelfplayer/core/database/entity/Entities.kt')
          old = '/**\n * PRODUCT_SPEC 13 — the Phase 0 subset of the conceptual schema.'
          new = '/*\n * PRODUCT_SPEC 13 — the Phase 0 subset of the conceptual schema.'
          text = path.read_text()
          if old not in text:
              raise SystemExit(f'Expected ktlint migration target not found in {path}: {old!r}')
          path.write_text(text.replace(old, new, 1))

      - name: Apply ktlint 1.8 formatter
        shell: bash
        run: |
          set +e
          ./gradlew ktlintFormat --rerun-tasks
          status=$?
          echo "ktlintFormat exit code: ${status}"
          exit 0

      - name: Commit mechanical formatting
        shell: bash
        run: |
          git add '*.gradle.kts' '**/*.gradle.kts' '**/*.kt'
          if git diff --cached --quiet; then
            echo 'No formatting changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: complete ktlint 1.8 formatting migration'
          git push origin HEAD:chore/bw-dep-01-ktlint-engine-1-8-0
