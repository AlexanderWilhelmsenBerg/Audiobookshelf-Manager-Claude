name: Ktlint 1.8 formatting bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-ktlint-engine-1-8-0
    paths:
      - '.github/workflows/ktlint-1-8-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    name: Apply ktlint 1.8 mechanical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ktlint-engine-1-8-0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Repair non-attached KDocs identified by ktlint 1.8
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('playback/src/main/kotlin/com/example/shelfplayer/playback/HeadsetHold.kt'): [
                  (
                      '    /**\n     * Takes a freshly published output list.',
                      '    /*\n     * Takes a freshly published output list.',
                  ),
                  (
                      '     */\n    /**\n     * The headset an explicit *Car* press gave up',
                      '     */\n\n    /**\n     * The headset an explicit *Car* press gave up',
                  ),
              ],
              Path('playback/src/main/kotlin/com/example/shelfplayer/playback/MediaItems.kt'): [
                  (
                      '    /**\n     * Builds the item for [session], positioned at the resume point the server reported.',
                      '    /*\n     * Builds the item for [session], positioned at the resume point the server reported.',
                  ),
                  (
                      "     */\n    /**\n     * A tappable link from the player's description line to a browse node.",
                      "     */\n\n    /**\n     * A tappable link from the player's description line to a browse node.",
                  ),
              ],
              Path('playback/src/main/kotlin/com/example/shelfplayer/playback/PlayerPositions.kt'): [
                  (
                      "/**\n * ADR-0016 — reading a book's position and length off the player.",
                      "/*\n * ADR-0016 — reading a book's position and length off the player.",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'Expected ktlint migration target not found in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Apply ktlint 1.8 formatter
        shell: bash
        run: |
          set +e
          ./gradlew ktlintFormat --rerun-tasks
          status=$?
          echo "ktlintFormat exit code: ${status}"
          exit 0

      - name: Commit mechanical formatting
        shell: bash
        run: |
          git add '*.gradle.kts' '**/*.gradle.kts' '**/*.kt'
          if git diff --cached --quiet; then
            echo 'No formatting changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply ktlint 1.8 formatting'
          git push origin HEAD:chore/bw-dep-01-ktlint-engine-1-8-0
