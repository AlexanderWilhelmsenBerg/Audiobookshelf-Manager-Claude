name: Ktlint 1.8 formatting bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-ktlint-engine-1-8-0
    paths:
      - '.github/workflows/ktlint-1-8-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    name: Apply ktlint 1.8 mechanical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ktlint-engine-1-8-0

      - name: Repair datastore non-attached KDoc identified by ktlint 1.8
        shell: python
        run: |
          from pathlib import Path

          path = Path('core/datastore/src/main/kotlin/com/example/shelfplayer/core/datastore/AppSettingsDataSource.kt')
          old = '    /** PRODUCT_SPEC ROUTE-001 / ROUTE-002 — auto-play when a car connects. Off unless explicitly chosen. */'
          new = '    /* PRODUCT_SPEC ROUTE-001 / ROUTE-002 — auto-play when a car connects. Off unless explicitly chosen. */'
          text = path.read_text()
          if old not in text:
              raise SystemExit(f'Expected ktlint migration target not found in {path}')
          path.write_text(text.replace(old, new, 1))

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Apply ktlint 1.8 formatter across all modules
        shell: bash
        run: |
          set +e
          ./gradlew ktlintFormat --rerun-tasks --continue
          status=$?
          echo "ktlintFormat exit code: ${status}"
          exit 0

      - name: Commit mechanical formatting
        shell: bash
        run: |
          git add '*.gradle.kts' '**/*.gradle.kts' '**/*.kt'
          if git diff --cached --quiet; then
            echo 'No formatting changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: repair remaining ktlint 1.8 formatting'
          git push origin HEAD:chore/bw-dep-01-ktlint-engine-1-8-0
