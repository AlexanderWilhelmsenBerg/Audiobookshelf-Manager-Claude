name: Ktlint 1.8 formatting bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-ktlint-engine-1-8-0
    paths:
      - '.github/workflows/ktlint-1-8-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    name: Apply ktlint 1.8 mechanical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ktlint-engine-1-8-0

      - name: Repair playback-test non-attached KDocs identified by ktlint 1.8
        shell: python
        run: |
          from pathlib import Path

          path = Path('playback/src/test/kotlin/com/example/shelfplayer/playback/HeadsetHoldTest.kt')
          markers = [
              '     * The case the class exists to prevent, reached from the other direction.',
              '     * An explicit *Car* press has to outlive the memory.',
              '     * A definite `TYPE_BUS` car is not a headset candidate, so narrowing to the active *headset* before',
          ]
          text = path.read_text()
          for marker in markers:
              old = '    /**\n' + marker
              new = '    /*\n' + marker
              if old not in text:
                  raise SystemExit(f'Expected ktlint migration target not found in {path}: {marker!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Apply ktlint 1.8 formatter
        shell: bash
        run: |
          set +e
          ./gradlew ktlintFormat --rerun-tasks
          status=$?
          echo "ktlintFormat exit code: ${status}"
          exit 0

      - name: Commit mechanical formatting
        shell: bash
        run: |
          git add '*.gradle.kts' '**/*.gradle.kts' '**/*.kt'
          if git diff --cached --quiet; then
            echo 'No formatting changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: repair playback test ktlint 1.8 KDocs'
          git push origin HEAD:chore/bw-dep-01-ktlint-engine-1-8-0
