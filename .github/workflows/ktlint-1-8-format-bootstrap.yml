name: Ktlint 1.8 formatting bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-ktlint-engine-1-8-0
    paths:
      - '.github/workflows/ktlint-1-8-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    name: Apply final ktlint 1.8 compatibility repairs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ktlint-engine-1-8-0

      - name: Apply non-autocorrectable ktlint 1.8 repairs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('core/model/src/test/kotlin/com/example/shelfplayer/core/model/download/DownloadPathsTest.kt'): [
                  (
                      'component.all { it.isLetterOrDigit() && it.code < 0x80 || it in "._-" },',
                      'component.all { (it.isLetterOrDigit() && it.code < 0x80) || it in "._-" },',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/AbsCapabilityResolver.kt'): [
                  (
                      '    /**\n     * PRODUCT_SPEC SYNC-001 — "missing expected fields produce a typed compatibility error rather than',
                      '    /*\n     * PRODUCT_SPEC SYNC-001 — "missing expected fields produce a typed compatibility error rather than',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/AbsLibraryApi.kt'): [
                  (
                      "    /**\n     * The running tally of one library's sweep, including when to stop.",
                      "    /*\n     * The running tally of one library's sweep, including when to stop.",
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/AuthService.kt'): [
                  (
                      '    /**\n     * Exchanges a stored token for the current user and permissions on a cold start.',
                      '    /*\n     * Exchanges a stored token for the current user and permissions on a cold start.',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/BookmarkDtos.kt'): [
                  (
                      '/**\n * Wire types for the bookmark routes, verified against Audiobookshelf 2.36.0 on 2026-08-13.',
                      '/*\n * Wire types for the bookmark routes, verified against Audiobookshelf 2.36.0 on 2026-08-13.',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/LibraryMapper.kt'): [
                  (
                      '    /**\n     * Every reason an item cannot be stored, in one place.',
                      '    /*\n     * Every reason an item cannot be stored, in one place.',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/ListeningSessionDtos.kt'): [
                  (
                      '/**\n * Wire types for `GET /api/me/listening-sessions`, captured against Audiobookshelf 2.36.0 on 2026-08-27.',
                      '/*\n * Wire types for `GET /api/me/listening-sessions`, captured against Audiobookshelf 2.36.0 on 2026-08-27.',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/PlaybackService.kt'): [
                  (
                      '    /**\n     * PRODUCT_SPEC PLAY-004 — "marking finished is explicit". This is the explicit route.',
                      '    /*\n     * PRODUCT_SPEC PLAY-004 — "marking finished is explicit". This is the explicit route.',
                  ),
              ],
              Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/gateway/AudiobookshelfGateway.kt'): [
                  (
                      '/**\n * PRODUCT_SPEC 23 — "Get current user and permissions" is [AuthApi.currentAccount], and there is no',
                      '/*\n * PRODUCT_SPEC 23 — "Get current user and permissions" is [AuthApi.currentAccount], and there is no',
                  ),
              ],
              Path('data/auth/src/test/kotlin/com/example/shelfplayer/data/auth/FakeAuthGateway.kt'): [
                  (
                      '    /** PRODUCT_SPEC 11.1 — not part of the auth tests; every method says so rather than pretending. */',
                      '    /* PRODUCT_SPEC 11.1 — not part of the auth tests; every method says so rather than pretending. */',
                  ),
              ],
              Path('data/library/src/test/kotlin/com/example/shelfplayer/data/library/DefaultPlaybackRepositoryTest.kt'): [
                  (
                      '    /** The active profile, without a database of profiles behind it. */',
                      '    /* The active profile, without a database of profiles behind it. */',
                  ),
              ],
              Path('data/library/src/test/kotlin/com/example/shelfplayer/data/library/DefaultSessionSyncRepositoryTest.kt'): [
                  (
                      '        /** PRODUCT_SPEC 11.1 — not part of these tests; every method reports so rather than pretending. */',
                      '        /* PRODUCT_SPEC 11.1 — not part of these tests; every method reports so rather than pretending. */',
                  ),
              ],
              Path('domain/src/main/kotlin/com/example/shelfplayer/domain/repository/PlaybackSettingsRepository.kt'): [
                  (
                      '    /**\n     * PRODUCT_SPEC ROUTE-001 / ROUTE-002 — whether connecting to a car starts the last book.',
                      '    /*\n     * PRODUCT_SPEC ROUTE-001 / ROUTE-002 — whether connecting to a car starts the last book.',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected exactly one ktlint migration target in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Format and commit final migration repairs
        shell: bash
        run: |
          set +e
          ./gradlew ktlintFormat --rerun-tasks --continue
          status=$?
          set -e
          echo "ktlintFormat exit code: ${status}"

          git add '*.gradle.kts' '**/*.gradle.kts' '**/*.kt'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: satisfy ktlint 1.8 standard rules'
            git push origin HEAD:chore/bw-dep-01-ktlint-engine-1-8-0
          fi

          exit "${status}"
