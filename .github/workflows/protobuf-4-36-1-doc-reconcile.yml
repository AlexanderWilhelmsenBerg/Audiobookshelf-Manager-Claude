name: Protobuf 4.36.1 ledger reconciliation

on:
  push:
    paths:
      - '.github/workflows/protobuf-4-36-1-doc-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconcile migration ledger and roadmap
        run: |
          python <<'PY'
          from pathlib import Path

          vc = Path('version-control.md')
          text = vc.read_text()
          text = text.replace(
              '**Repository baseline checked:** `main` at `05d87933d313209c34e5ebafd684edf36be92f57`',
              '**Repository baseline checked:** `main` at `74bddd7af5cb020e4a6bb229a1b4ff7718285a15`'
          )
          text = text.replace(
              '| `protobuf` | 4.31.1 | 4.36.1 (Protobuf 36.1) | ⬆️ Phase 5 runtime/protoc update with serialization compatibility checks. | 5 | 2026-09-15 | [Protobuf releases](https://github.com/protocolbuffers/protobuf/releases) |',
              '| `protobuf` | 4.36.1 | 4.36.1 (Protobuf 36.1) | ✅ Latest stable reached in active PR #166 with matched Java/Kotlin-lite runtime and protoc. The focused Proto DataStore suite and full classpath rerun gate are the compatibility evidence; the reported 36.1 Bazel prebuilt-tool integrity issue is outside BookWave\'s Gradle/Maven protoc path. | 5 | 2026-09-15 | [Protobuf releases](https://github.com/protocolbuffers/protobuf/releases) |'
          )
          marker = '| 2026-09-15 | #164 | kotlinx.serialization | 1.8.1 | 1.9.0 | 🎯 Latest stable compatible with the current Kotlin 2.2.0 compiler line |'
          row = '| 2026-09-15 | #165 | kotlinx.coroutines | 1.10.2 | 1.11.0 | ✅ Latest stable reached after full cancellation/concurrency rerun coverage on Kotlin 2.2.0 |'
          if row not in text:
              text = text.replace(marker, marker + '\n' + row)
          vc.write_text(text)

          plan = Path('docs/latest-stable-upgrade-plan.md')
          text = plan.read_text()
          marker = '| #164 | kotlinx.serialization | 1.8.1 | 1.9.0 | 2026-09-15 |'
          row = '| #165 | kotlinx.coroutines | 1.10.2 | 1.11.0 | 2026-09-15 |'
          if row not in text:
              text = text.replace(marker, marker + '\n' + row)
          old = '''**Status: active in compatibility-sized slices.** kotlinx.serialization 1.9.0 landed in PR #164 as the newest
stable release aligned with BookWave’s current Kotlin 2.2.0 compiler line. The next independent runtime probe is
kotlinx.coroutines 1.11.0: upstream builds it with Kotlin 2.2.20, so BookWave must prove compatibility on Kotlin
2.2.0 through the full rerun gate rather than assuming patch-level compiler compatibility. Stable
kotlinx.serialization 1.10.0+ remains behind the compiler/build-foundation re-resolution.'''
          new = '''**Status: active in compatibility-sized slices.** kotlinx.serialization 1.9.0 landed in PR #164 as the newest
stable release aligned with BookWave’s current Kotlin 2.2.0 compiler line, and kotlinx.coroutines 1.11.0 landed in
PR #165 after the full rerun gate proved it compatible with BookWave’s Kotlin 2.2.0 build despite upstream building
it with Kotlin 2.2.20. PR #166 is the next independent slice, moving the matched Protobuf Java/Kotlin-lite runtime
and protoc from 4.31.1 / 31.1 to 4.36.1 / 36.1. Stable kotlinx.serialization 1.10.0+ remains behind the
compiler/build-foundation re-resolution.'''
          if old not in text:
              raise SystemExit('Expected Phase 5 status block not found')
          text = text.replace(old, new)
          plan.write_text(text)
          PY
      - name: Commit reconciliation and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version-control.md docs/latest-stable-upgrade-plan.md
          git rm .github/workflows/protobuf-4-36-1-doc-reconcile.yml
          git commit -m 'docs: reconcile Phase 5 dependency ledger'
          git push
