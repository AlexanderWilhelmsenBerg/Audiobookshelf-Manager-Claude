name: CI · PR verification

run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.event_name == 'pull_request' && 'standard' || inputs.depth }}"

# GitHub-native BookWave pull-request gate, carrying forward the proven Forgejo CI quality model.
#
# Security model:
# - never expose signing material to pull-request code;
# - do not persist checkout credentials;
# - strip the automatic Forgejo/GitHub token before invoking repository-controlled
#   shell or Gradle code;
# - pin reusable actions and downloaded security tooling immutably.
#
# Reliability model:
# - automatic pull-request events run Standard;
# - Quick remains available as a manual smoke test;
# - Standard keeps the complete verifyDebug evidence without packaging an APK;
# - --rerun-tasks follows build/classpath changes, not workflow-only edits;
# - an optional debug APK is dispatched through the dedicated trusted Build APK workflow only after Standard/Intensive passes.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      depth:
        description: 'Verification depth'
        type: choice
        required: true
        default: standard
        options:
          - quick
          - standard
          - intensive
      profiling:
        description: 'Retain detailed CI telemetry for this run'
        type: boolean
        default: true
      build_apk:
        description: 'Build and upload a debug APK only after Standard/Intensive checks pass'
        type: boolean
        default: false
      force_rerun:
        description: 'Force --rerun-tasks even when the diff does not affect the build/classpath'
        type: boolean
        default: false
      seed_main_cache:
        description: 'Maintenance: seed enhanced Gradle cache from the exact current trusted main'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A second manual click should queue, not kill an already-expensive Gradle run. This also avoids
  # exercising the runner/container cancellation path unnecessarily.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  packages: read

defaults:
  run:
    shell: bash

env:
  # Bound JVM memory; Gradle uses the GitHub runner's available CPU capacity by default.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
  JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
  GRADLE_WRAPPER_JAR_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  identity:
    name: "CI · ${{ github.ref_name }} · resolve target"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      display_label: ${{ steps.metadata.outputs.display_label }}
      pr_number: ${{ steps.metadata.outputs.pr_number }}
      pr_title: ${{ steps.metadata.outputs.pr_title }}
      pr_head: ${{ steps.metadata.outputs.pr_head }}
      pr_branch: ${{ steps.metadata.outputs.pr_branch }}
      checkout_repository: ${{ steps.metadata.outputs.checkout_repository }}
      depth: ${{ steps.metadata.outputs.depth }}
      profiling: ${{ steps.metadata.outputs.profiling }}
      build_apk: ${{ steps.metadata.outputs.build_apk }}
      cache_write: ${{ steps.metadata.outputs.cache_write }}
    steps:
      - name: Resolve PR metadata or selected ref
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DEPTH: ${{ inputs.depth }}
          REQUESTED_PROFILING: ${{ inputs.profiling }}
          REQUESTED_BUILD_APK: ${{ inputs.build_apk }}
          REQUESTED_SEED_MAIN_CACHE: ${{ inputs.seed_main_cache }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SELECTED_BRANCH: ${{ github.ref_name }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            requested_pr="$EVENT_PR"
            pr_title="$EVENT_PR_TITLE"
            pr_head="$EVENT_HEAD_SHA"
            pr_branch="$EVENT_HEAD_BRANCH"
            checkout_repository="$EVENT_HEAD_REPOSITORY"
            depth="standard"
            profiling="false"
            build_apk="false"
            # A same-repository PR saves its own Gradle state so the next push to it reuses everything that
            # push already compiled. GitHub scopes these entries to refs/pull/N/merge: main and other PRs
            # can never restore them, so PR code cannot poison the trusted main cache. Fork PRs stay read-only.
            if [ "$EVENT_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
              cache_write=true
            else
              cache_write=false
            fi
          else
            requested_pr=""
            depth="${REQUESTED_DEPTH:-standard}"
            profiling="${REQUESTED_PROFILING:-false}"
            build_apk="${REQUESTED_BUILD_APK:-false}"
            cache_write=false
            pr_title=""
            pr_head="$SELECTED_SHA"
            pr_branch="$SELECTED_BRANCH"
            checkout_repository="$GITHUB_REPOSITORY"

            if [ "${REQUESTED_SEED_MAIN_CACHE:-false}" = "true" ]; then
              pr_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
              pr_branch=main
              checkout_repository="$GITHUB_REPOSITORY"
              depth=standard
              profiling=false
              build_apk=false
              cache_write=true
              echo "Trusted main cache seed requested at $pr_head."
            else
              pr_matches="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                -f state=open \
                -f head="$GITHUB_REPOSITORY_OWNER:$SELECTED_BRANCH" \
                -f per_page=2)"
              match_count="$(printf '%s' "$pr_matches" | jq 'length')"

              if [ "$match_count" -gt 1 ]; then
                echo "::error::Selected branch '$SELECTED_BRANCH' maps to multiple open PRs; close or retarget the duplicates first."
                exit 1
              elif [ "$match_count" -eq 1 ]; then
                pr_values="$(printf '%s' "$pr_matches" | jq -r '.[0] | [.number, .title, .head.sha, .head.ref, .head.repo.full_name] | @tsv')"
                IFS=$'\t' read -r requested_pr pr_title discovered_sha discovered_branch discovered_repo <<<"$pr_values"

                if [ "$discovered_sha" != "$SELECTED_SHA" ]; then
                  echo "::error::Selected branch moved while the workflow was being dispatched."
                  echo "selected_sha=$SELECTED_SHA"
                  echo "current_pr_head=$discovered_sha"
                  exit 1
                fi
                if [ "$discovered_branch" != "$SELECTED_BRANCH" ] || [ "$discovered_repo" != "$GITHUB_REPOSITORY" ]; then
                  echo "::error::Selected branch does not resolve to a same-repository PR head."
                  exit 1
                fi

                pr_head="$discovered_sha"
                pr_branch="$discovered_branch"
                checkout_repository="$discovered_repo"
                echo "GitHub branch selector resolved $SELECTED_BRANCH to PR #$requested_pr."
              else
                echo "GitHub branch selector resolved $SELECTED_BRANCH as a branch-only validation target."
              fi
            fi
          fi

          case "$depth" in quick|standard|intensive) ;; *) echo "::error::Unsupported verification depth: $depth"; exit 1 ;; esac
          if [ "$depth" = "quick" ] && [ "$build_apk" = "true" ]; then
            echo "::error::build_apk requires Standard or Intensive verification."
            exit 1
          fi
          if [ "$build_apk" = "true" ] && [ "$checkout_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Signed APK dispatch is not allowed for fork PRs."
            exit 1
          fi

          display_label="$pr_branch"
          if [ "${cache_write:-false}" = "true" ] && [ "$pr_branch" = "main" ]; then
            display_label="trusted main cache seed"
          elif [ -n "$requested_pr" ]; then
            display_label="PR #$requested_pr · ${pr_title:0:120}"
          fi

          {
            echo "display_label=$display_label"
            echo "pr_number=$requested_pr"
            echo "pr_title=$pr_title"
            echo "pr_head=$pr_head"
            echo "pr_branch=$pr_branch"
            echo "checkout_repository=$checkout_repository"
            echo "depth=$depth"
            echo "profiling=$profiling"
            echo "build_apk=$build_apk"
            echo "cache_write=${cache_write:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved CI target: $display_label · $checkout_repository@$pr_head · depth=$depth · build_apk=$build_apk"

  preflight:
    name: "CI · ${{ needs.identity.outputs.display_label }} · Preflight · wf:${{ github.ref_name }}"
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_changed: ${{ steps.classify.outputs.build_changed }}
      ci_infra_changed: ${{ steps.classify.outputs.ci_infra_changed }}
      dependency_inputs_changed: ${{ steps.classify.outputs.dependency_inputs_changed }}
      checked_head: ${{ steps.classify.outputs.checked_head }}
      status_description: ${{ steps.preflight_summary.outputs.status_description }}
    steps:
      # One full-history checkout serves all cheap prerequisite checks. No signing or release secrets are available here.
      - name: Check out BookWave
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.identity.outputs.checkout_repository }}
          ref: ${{ needs.identity.outputs.pr_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main
        run: |
          set -euo pipefail
          git fetch --no-tags --force "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/main:refs/remotes/bookwave-base/main"

      - name: PR policy and change classification
        id: classify
        continue-on-error: true
        env:
          REQUESTED_PR: ${{ needs.identity.outputs.pr_number }}
          EXPECTED_PR_HEAD: ${{ needs.identity.outputs.pr_head }}
          SELECTED_BRANCH: ${{ needs.identity.outputs.pr_branch }}
          TARGET_LABEL: ${{ needs.identity.outputs.display_label }}
        run: |
          set -euo pipefail

          base_ref="main"

          checked_out_head="$(git rev-parse HEAD)"
          echo "checked_head=$checked_out_head" >> "$GITHUB_OUTPUT"

          if [ -n "$REQUESTED_PR" ]; then
            if [ "$EXPECTED_PR_HEAD" != "$checked_out_head" ]; then
              echo "::error::PR #$REQUESTED_PR does not match the selected branch/ref."
              echo "pr_head=$EXPECTED_PR_HEAD"
              echo "checked_out_head=$checked_out_head"
              exit 1
            fi
            echo "Validated $TARGET_LABEL -> $SELECTED_BRANCH @ ${checked_out_head:0:8}."
          else
            echo "No PR number supplied; validating branch $SELECTED_BRANCH @ ${checked_out_head:0:8}."
          fi

          base="refs/remotes/bookwave-base/$base_ref"
          git rev-parse --verify "$base^{commit}" >/dev/null

          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "::error::Checked-out head does not contain current $base_ref. Rebase/update it before acceptance."
            echo "base=$(git rev-parse "$base")"
            echo "head=$(git rev-parse HEAD)"
            exit 1
          fi

          bash scripts/ci/classify-changes.sh "$base" HEAD

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.force_rerun }}" = "true" ]; then
            echo "build_changed=true" >> "$GITHUB_OUTPUT"
            echo "Full rerun forced by workflow input."
          fi

      - name: Gradle wrapper validation
        id: wrapper_check
        continue-on-error: true
        run: |
          set -euo pipefail

          distribution_url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')"
          distribution_sha="$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)"

          if ! printf '%s' "$distribution_sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::gradle-wrapper.properties must pin distributionSha256Sum."
            exit 1
          fi

          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          if [ "$actual" != "$GRADLE_WRAPPER_JAR_SHA256" ]; then
            echo "::error::Gradle wrapper JAR checksum mismatch."
            echo "distribution=$distribution_url"
            echo "expected=$GRADLE_WRAPPER_JAR_SHA256"
            echo "actual=$actual"
            echo "A wrapper upgrade must update this pinned digest in the PR workflow after independent verification."
            exit 1
          fi

          echo "Gradle wrapper JAR verified: $actual"
          echo "Gradle distribution is SHA-pinned: $distribution_sha"

      - name: Secret scan
        id: secret_scan
        continue-on-error: true
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="$tmp/gitleaks.tar.gz"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"

          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
          env -u GITHUB_TOKEN gitleaks git . --redact --verbose --no-banner --log-opts="refs/remotes/bookwave-base/main..HEAD"

      - name: Committed Room schemas are immutable
        id: schema_check
        continue-on-error: true
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          base="refs/remotes/bookwave-base/$base_ref"
          git rev-parse --verify "$base^{commit}" >/dev/null

          modified="$(git diff --diff-filter=MD --name-only "$base"...HEAD -- core/database/schemas)"
          if [ -n "$modified" ]; then
            echo "::error::A committed Room schema was modified or deleted. Bump the database version instead."
            echo "$modified"
            echo
            echo "A schema that has been built into an APK is a fact about somebody's phone. Room compares its"
            echo "identity hash on open, so changing one crashes the app at startup on every device that ran"
            echo "the previous build. Add a new version and a migration; never edit an existing file."
            git diff "$base"...HEAD -- core/database/schemas
            exit 1
          fi
          echo "No committed Room schema was modified."

      - name: Validate CI scripts
        id: script_check
        continue-on-error: true
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts/ci scripts/codex -type f -name '*.sh' -print0)
          python3 -m compileall -q scripts/ci
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'

      - name: Summarize preflight
        id: preflight_summary
        if: ${{ always() }}
        env:
          TARGET_LABEL: ${{ needs.identity.outputs.display_label }}
          WORKFLOW_SOURCE: ${{ github.ref_name }}
          POLICY_OUTCOME: ${{ steps.classify.outcome }}
          WRAPPER_OUTCOME: ${{ steps.wrapper_check.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
          SCRIPT_OUTCOME: ${{ steps.script_check.outcome }}
        run: |
          set -euo pipefail
          summary="${FORGEJO_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-}}"
          failed=()

          render() {
            local name="$1"
            local outcome="$2"
            local icon="✅"
            if [ "$outcome" != "success" ]; then
              icon="❌"
              failed+=("$name")
            fi
            printf '| %s | %s %s |\n' "$name" "$icon" "$outcome"
          }

          {
            echo "## CI · $TARGET_LABEL · Preflight · wf:$WORKFLOW_SOURCE"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            render "PR / branch policy" "$POLICY_OUTCOME"
            render "Gradle wrapper integrity" "$WRAPPER_OUTCOME"
            render "Secret scan" "$SECRET_SCAN_OUTCOME"
            render "Committed Room schemas" "$SCHEMA_OUTCOME"
            render "CI script syntax/tests" "$SCRIPT_OUTCOME"
            echo
          } > /tmp/bookwave-preflight-summary.md

          cat /tmp/bookwave-preflight-summary.md
          if [ -n "$summary" ]; then
            cat /tmp/bookwave-preflight-summary.md >> "$summary"
          fi

          if [ "${#failed[@]}" -eq 0 ]; then
            description="BookWave preflight passed"
          else
            joined="$(IFS=', '; echo "${failed[*]}")"
            description="Preflight failed: $joined"
          fi
          echo "status_description=${description:0:220}" >> "$GITHUB_OUTPUT"

      - name: Require every preflight check to pass
        if: ${{ always() }}
        env:
          POLICY_OUTCOME: ${{ steps.classify.outcome }}
          WRAPPER_OUTCOME: ${{ steps.wrapper_check.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
          SCRIPT_OUTCOME: ${{ steps.script_check.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "PR policy/change classification:$POLICY_OUTCOME" \
            "Gradle wrapper validation:$WRAPPER_OUTCOME" \
            "Secret scan:$SECRET_SCAN_OUTCOME" \
            "Room schema immutability:$SCHEMA_OUTCOME" \
            "CI script validation:$SCRIPT_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::Preflight check failed: $name ($outcome)"
              failed=1
            fi
          done
          exit "$failed"

  verify:
    name: "CI · ${{ needs.identity.outputs.display_label }} · verification · wf:${{ github.ref_name }}"
    runs-on: ubuntu-latest
    container:
      # The toolchain is built and verified by build-ci-image.yml, then consumed by immutable GHCR digest.
      # Registry credentials are used only by the runner to pull the image; PR-controlled steps do not
      # receive the package token as an environment variable.
      image: ghcr.io/alexanderwilhelmsenberg/bookwave-ci@sha256:a39aa3dad91c2a9e4464c527637ccd76ec8ba777d5d60c252f7cc3dd6f09e00b
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    needs:
      - identity
      - preflight
    timeout-minutes: 90
    outputs:
      status_description: ${{ steps.final_status.outputs.status_description }}
    steps:
      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "logical_cpus=$(nproc)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          printf 'cgroup_memory_max='; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
          printf 'cgroup_cpu_max='; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable
          df -h / || true

      - name: Check out validated PR HEAD
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.identity.outputs.checkout_repository }}
          ref: ${{ needs.preflight.outputs.checked_head }}
          persist-credentials: false

      - name: Set up Gradle with enhanced cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ needs.identity.outputs.cache_write != 'true' }}
          # Drop Gradle User Home files this build did not use before saving, so a PR entry stays lean.
          cache-cleanup: on-success

      - name: Prepare BookWave Android environment
        id: setup
        env:
          BOOKWAVE_CODEX_PREWARM: none
          BOOKWAVE_ANDROID_SDK_MODE: preinstalled
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          env -u GITHUB_TOKEN \
            BOOKWAVE_CODEX_PREWARM="$BOOKWAVE_CODEX_PREWARM" \
            BOOKWAVE_ANDROID_SDK_MODE="$BOOKWAVE_ANDROID_SDK_MODE" \
            bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Quick is deliberately only formatting evidence. A failure here prevents the expensive
      # compile/test/Lint/Kover graph from starting.
      - name: Quick KtLint
        id: quick_gate
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics

          set +e
          env -u GITHUB_TOKEN             ./gradlew quickKtlint --continue                -Pshelfplayer.warningsAsErrors=true 2>&1             | tee ci-diagnostics/gradle-quick.log
          status="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Verify debug once without assembling APKs
        id: verify_debug
        if: ${{ steps.setup.outcome == 'success' && steps.quick_gate.outcome == 'success' && needs.identity.outputs.depth != 'quick' }}
        continue-on-error: true
        env:
          BUILD_CHANGED: ${{ needs.preflight.outputs.build_changed }}
          DEPTH: ${{ needs.identity.outputs.depth }}
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          extra_args=()
          if [ "$BUILD_CHANGED" = "true" ]; then
            extra_args+=(--rerun-tasks)
            echo "Verification mode: full rerun (R-31 build/classpath safety)."
          else
            echo "Verification mode: normal."
          fi
          if [ "$DEPTH" = "intensive" ]; then
            extra_args+=(--rerun-tasks --no-build-cache)
            echo "Intensive mode: task outputs and Gradle build cache are not trusted as execution evidence."
          fi

          set +e
          env -u GITHUB_TOKEN             ./gradlew verifyDebug --continue -x assembleDebug "${extra_args[@]}"                -Pshelfplayer.warningsAsErrors=true 2>&1             | tee ci-diagnostics/gradle-verify.log
          status="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Room schema is committed and current
        id: schema_check
        if: ${{ always() && needs.identity.outputs.depth != 'quick' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            exit 1
          fi
          echo "Room schemas are committed and current."

      - name: Resolve dependencies for the debug variant
        id: dependencies
        if: ${{ always() && needs.identity.outputs.depth != 'quick' && steps.setup.outcome == 'success' && (needs.preflight.outputs.dependency_inputs_changed == 'true' || needs.identity.outputs.depth == 'intensive') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          set +e
          env -u GITHUB_TOKEN \
            ./gradlew :app:dependencies --configuration debugRuntimeClasspath  \
              > dependency-report.txt 2> ci-diagnostics/dependency-resolution.log
          status="$?"
          set -e
          if [ -s ci-diagnostics/dependency-resolution.log ]; then
            cat ci-diagnostics/dependency-resolution.log
          fi
          exit "$status"

      - name: Build consolidated diagnostics
        id: diagnostics
        if: ${{ always() }}
        env:
          TARGET_LABEL: ${{ needs.identity.outputs.display_label }}
          WORKFLOW_SOURCE: ${{ github.ref_name }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          DEPTH: ${{ needs.identity.outputs.depth }}
          QUICK_OUTCOME: ${{ steps.quick_gate.outcome }}
          QUICK_EXIT: ${{ steps.quick_gate.outputs.exit_code }}
          VERIFY_OUTCOME: ${{ steps.verify_debug.outcome }}
          VERIFY_EXIT: ${{ steps.verify_debug.outputs.exit_code }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          python3 scripts/ci/pr-diagnostics.py

          summary="${FORGEJO_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-}}"
          if [ -n "$summary" ]; then
            cat ci-diagnostics/summary.md >> "$summary"
          fi

      - name: Package quality reports on validation failure
        if: ${{ always() && (steps.quick_gate.outcome != 'success' || (needs.identity.outputs.depth != 'quick' && steps.verify_debug.outcome != 'success')) }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts

          mapfile -d '' reports < <(
            find . -type f \
              \( -path '*/build/reports/ktlint/*' \
                 -o -path '*/build/reports/detekt/*' \
                 -o -path '*/build/reports/lint-results-*.html' \
                 -o -path '*/build/reports/lint-results-*.sarif' \
                 -o -path '*/build/reports/lint-results-*.txt' \
                 -o -path '*/build/reports/tests/*' \
                 -o -path '*/build/test-results/*' \) \
              -print0
          )

          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No quality-report files were produced."
            exit 0
          fi

          printf '%s\0' "${reports[@]}" \
            | tar --null --files-from=- -czf ci-artifacts/quality-reports.tar.gz

          echo "Packaged ${#reports[@]} quality-report files into one failure-diagnostics archive."
          ls -lh ci-artifacts/quality-reports.tar.gz

      - name: Upload CI diagnostics on failure
        if: ${{ always() && (steps.setup.outcome != 'success' || steps.quick_gate.outcome != 'success' || (needs.identity.outputs.depth != 'quick' && steps.verify_debug.outcome != 'success') || (needs.identity.outputs.depth != 'quick' && steps.schema_check.outcome != 'success') || (steps.dependencies.outcome != 'success' && steps.dependencies.outcome != 'skipped')) }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload dependency report on dependency failure
        if: ${{ always() && needs.identity.outputs.depth != 'quick' && steps.dependencies.outcome != 'success' && steps.dependencies.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: dependency-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Room schemas on schema failure
        if: ${{ always() && needs.identity.outputs.depth != 'quick' && steps.schema_check.outcome != 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: core/database/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload packaged quality reports on validation failure
        if: ${{ always() && (steps.quick_gate.outcome != 'success' || (needs.identity.outputs.depth != 'quick' && steps.verify_debug.outcome != 'success')) }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: ci-artifacts/quality-reports.tar.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect CI telemetry
        if: ${{ always() }}
        env:
          BOOKWAVE_CI_SHA: ${{ needs.preflight.outputs.checked_head }}
          BOOKWAVE_CI_DEPTH: ${{ needs.identity.outputs.depth }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ci-telemetry.py ci-diagnostics/gradle-quick.log ci-diagnostics/gradle-verify.log

      - name: Upload CI telemetry
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-telemetry
          path: ci-telemetry/metrics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload profiling logs
        if: ${{ always() && needs.identity.outputs.profiling == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-profile-logs
          path: |
            ci-diagnostics/gradle-quick.log
            ci-diagnostics/gradle-verify.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Final verification gate
        id: verification_gate
        if: ${{ always() }}
        env:
          DEPTH: ${{ needs.identity.outputs.depth }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          QUICK_OUTCOME: ${{ steps.quick_gate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_debug.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local name="$1"
            local outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name failed or was skipped ($outcome). See the consolidated diagnostics above."
              failed=1
            fi
          }

          require_success "Android environment" "$SETUP_OUTCOME"
          require_success "Quick KtLint" "$QUICK_OUTCOME"

          if [ "$DEPTH" != "quick" ]; then
            require_success "verifyDebug" "$VERIFY_OUTCOME"
            require_success "Room schema" "$SCHEMA_OUTCOME"
            if [ "$DEPENDENCY_OUTCOME" != "success" ] && [ "$DEPENDENCY_OUTCOME" != "skipped" ]; then
              require_success "Dependency resolution" "$DEPENDENCY_OUTCOME"
            fi
          fi
          exit "$failed"

      - name: Final status description
        id: final_status
        if: ${{ always() }}
        env:
          DIAGNOSTIC_DESCRIPTION: ${{ steps.diagnostics.outputs.status_description }}
        run: |
          set -euo pipefail
          description="${DIAGNOSTIC_DESCRIPTION:-BookWave verification failed}"
          echo "status_description=${description:0:220}" >> "$GITHUB_OUTPUT"

  # Keeps exactly one generation of a PR's Gradle cache: once this run's verify job has saved its entries,
  # every older entry of the same kind on this PR's ref is deleted. Runs no repository code, so the
  # actions:write token never meets PR-controlled scripts. Closing the PR removes the rest
  # (pr-cache-cleanup.yml).
  prune-pr-cache:
    name: "CI · ${{ needs.identity.outputs.display_label }} · prune superseded PR cache"
    if: ${{ always() && github.event_name == 'pull_request' && needs.identity.outputs.cache_write == 'true' && needs.verify.result != 'skipped' }}
    needs:
      - identity
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete superseded cache entries for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          # One line per entry: id, kind, created. The kind is the key without its trailing content hash, so
          # each kind keeps only its newest entry. An entry this run restored by exact match and did not
          # re-save is still the newest of its kind and survives.
          gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/caches" \
            -f ref="$CACHE_REF" -F per_page=100 \
            --jq '.actions_caches[] | [.id, (.key | sub("-[0-9a-f]{8,}$"; "")), .created_at] | @tsv' \
            | sort -t $'\t' -k2,2 -k3,3r \
            | awk -F '\t' 'seen[$2]++ { print $1 }' \
            | while read -r id; do
                echo "Deleting superseded cache entry $id"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
              done

  dispatch-apk:
    name: Dispatch verified debug APK
    if: ${{ github.event_name == 'workflow_dispatch' && needs.identity.outputs.build_apk == 'true' && needs.identity.outputs.depth != 'quick' && needs.verify.result == 'success' }}
    needs:
      - identity
      - preflight
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Dispatch trusted Build APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.preflight.outputs.checked_head }}
          VERIFIED_BRANCH: ${{ needs.identity.outputs.pr_branch }}
          PR_NUMBER: ${{ needs.identity.outputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Verified APK handoff requires a PR number. Use Build APK directly for a branch-only build."
            exit 1
          fi

          jq -n \
            --arg event_type build_verified_apk \
            --arg source_sha "$VERIFIED_SHA" \
            --arg source_branch "$VERIFIED_BRANCH" \
            --arg pr_number "$PR_NUMBER" \
            '{event_type: $event_type, client_payload: {source_sha: $source_sha, source_branch: $source_branch, pr_number: $pr_number}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

          echo "Dispatched trusted Build APK for PR #$PR_NUMBER @ ${VERIFIED_SHA:0:8}; signing remains isolated in apk.yml."
