name: Pull request

# PRODUCT_SPEC 18 — the pull-request gate.
#
# Ordered so the cheapest signal fails first: wrapper validation and secret scanning before anything
# downloads a dependency, then the single `verifyDebug` command PRODUCT_SPEC 16.5 defines.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PRODUCT_SPEC 16.3 — Kotlin compiler warnings are errors in CI, and only in CI.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # PRODUCT_SPEC 18.1 — verifies gradle-wrapper.jar against the known-good checksums, which is
      # the mitigation for a malicious wrapper jar being committed.
      - uses: gradle/actions/wrapper-validation@v4

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PRODUCT_SPEC 15 / 18.8 — no production secrets in the repository.
      #
      # The binary is installed from a pinned release rather than through the marketplace action,
      # which is licence-gated for organizations; a scan that silently stops running is worse than
      # no scan, because the badge still says green.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.0
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree and history
        run: gitleaks detect --source . --redact --verbose --no-banner

  schema-immutability:
    name: Committed Room schemas are immutable
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PRODUCT_SPEC 13.1 / 22.11 — the check the "Room schema is committed and current" step below cannot
      # make, and the one that would have prevented a real crash.
      #
      # That step compares the *exported* schema against the committed one, so it catches a schema somebody
      # forgot to commit. It says nothing about a committed schema being **changed**, because once the change
      # is committed the working tree is clean and the step is green.
      #
      # On 2026-08-14 version 14 shipped in build 0.9.2, the next commit removed a column and left the version
      # at 14 on the reasoning that 14 "had not shipped", and the owner's phone would not start: Room stores
      # each version's identity hash in `room_master_table`, compares it on open, and has no migration to a
      # hash that changed underneath it. Fresh installs and every migration test starting from an older
      # version are unaffected, which is exactly what makes it easy to ship.
      #
      # A modified file under `schemas/` is therefore always wrong. Adding one — a new version — is the only
      # correct way to change the database.
      - name: No committed schema may be modified
        run: |
          base="origin/${{ github.base_ref }}"
          modified="$(git diff --diff-filter=MD --name-only "$base"...HEAD -- core/database/schemas)"
          if [ -n "$modified" ]; then
            echo "::error::A committed Room schema was modified or deleted. Bump the database version instead."
            echo "$modified"
            echo
            echo "A schema that has been built into an APK is a fact about somebody's phone. Room compares its"
            echo "identity hash on open, so changing one crashes the app at startup on every device that ran"
            echo "the previous build. Add a new version and a migration; never edit an existing file."
            git diff "$base"...HEAD -- core/database/schemas
            exit 1
          fi
          echo "No committed schema was modified."

  verify:
    name: verifyDebug
    runs-on: ubuntu-latest
    needs: [wrapper-validation]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check formatting
        run: ./gradlew ktlintCheck

      # PRODUCT_SPEC 16.5 — ktlintCheck, detekt with type resolution, Android Lint, unit tests,
      # Room schema verification and the debug assembly, in one command.
      #
      # `--continue` reports every independent failure instead of stopping at the first. The gate is
      # unchanged — the build still fails — but a reviewer sees the whole list in one run rather than
      # discovering the next lint error only after fixing the previous one.
      - name: Verify debug
        run: ./gradlew verifyDebug --continue -Pshelfplayer.warningsAsErrors=true

      # Gradle only prints lint's first finding on the console. The full text report is what makes a
      # lint failure diagnosable from the log alone, without downloading an artifact.
      - name: Print lint reports
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            found=1
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done < <(find . -path '*/build/reports/lint-results-*.txt' -print)
          [ "$found" -eq 1 ] || echo "No lint text reports were produced."

      # PRODUCT_SPEC 18.6 — a schema change that was not committed is a failure, not a surprise on
      # a user's device.
      #
      # `git status --porcelain`, not `git diff`: a schema for a brand-new database version is an
      # *untracked* file, which `git diff` reports as clean. That is exactly the case this check
      # exists to catch.
      - name: Room schema is committed and current
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            echo "--- exported schema ---"
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      # Uploaded unconditionally: the schema check above only runs when `verifyDebug` succeeded, so
      # on a failing build the exported schema would otherwise be unreachable — and that is exactly
      # when a first run needs to produce it.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: room-schemas
          path: core/database/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint and detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  dependency-report:
    name: Dependency and licence report
    runs-on: ubuntu-latest
    needs: [wrapper-validation]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # PRODUCT_SPEC 18.9 — the resolved dependency set is reviewable on every pull request, which
      # is what makes an unexpected transitive dependency visible before it ships.
      - name: Resolve dependencies for the debug variant
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt

      - uses: actions/upload-artifact@v6
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 7
