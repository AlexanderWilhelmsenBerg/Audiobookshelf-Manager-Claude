name: Pull request

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Generate KSP verification metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Generate verification metadata through the real gate
        run: ./gradlew verifyDebug --continue --rerun-tasks -Pshelfplayer.warningsAsErrors=true --write-verification-metadata sha256

      - name: Upload generated dependency verification metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-metadata-generated
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

      - name: Room schema is committed and current
        if: success()
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            exit 1
          fi
