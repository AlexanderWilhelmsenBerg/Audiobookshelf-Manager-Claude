name: Pull request

# PRODUCT_SPEC 18 — the pull-request gate.
#
# Ordered so the cheapest signal fails first: wrapper validation and secret scanning before anything
# downloads a dependency, then the single `verifyDebug` command PRODUCT_SPEC 16.5 defines.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Opening/closing a PR regenerates only the Build APK dropdown. That generated commit has
    # already been validated as workflow YAML and does not need the full Android verification lane.
    paths-ignore:
      - '.github/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PRODUCT_SPEC 16.3 — Kotlin compiler warnings are errors in CI, and only in CI.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.24.0'
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks git --redact --no-banner --verbose

  room-schema-immutability:
    name: Committed Room schemas are immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject edits to committed Room schemas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request; nothing to compare."
            exit 0
          fi

          base="$BASE_SHA"
          changes="$({
            git diff --name-status "$base"...HEAD -- core/database/schemas
          } || true)"

          modified="$(printf '%s\n' "$changes" | awk '$1 != "A" { print }')"
          if [ -n "$modified" ]; then
            echo "::error::A committed Room schema was modified or deleted."
            echo "$modified"
            echo
            echo "A schema that has been built into an APK is a fact about somebody's phone. Room compares its"
            echo "identity hash on open, so changing one crashes the app at startup on every device that ran"
            echo "the previous build. Add a new version and a migration; never edit an existing file."
            git diff "$base"...HEAD -- core/database/schemas
            exit 1
          fi
          echo "No committed schema was modified."

  verify:
    name: verifyDebug
    runs-on: ubuntu-latest
    needs: [wrapper-validation]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # PRODUCT_SPEC 16.5 — verifyDebug already includes ktlintCheck, detekt with type resolution,
      # Room schema verification and the debug assembly, in one command.
      #
      # `--continue` reports every independent failure instead of stopping at the first. The gate is
      # unchanged — the build still fails — but a reviewer sees the whole list in one run rather than
      # discovering the next lint error only after fixing the previous one.
      - name: Verify debug
        run: ./gradlew verifyDebug --continue --rerun-tasks --write-verification-metadata sha256 -Pshelfplayer.warningsAsErrors=true

      - name: Upload generated dependency verification metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

      # Gradle only prints lint's first finding on the console. The full text report is what makes a
      # lint failure diagnosable from the log alone, without downloading an artifact.
      - name: Print lint reports
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            found=1
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done < <(find . -path '*/build/reports/lint-results-*.txt' -print)
          [ "$found" -eq 1 ] || echo "No lint text reports were produced."

      # PRODUCT_SPEC 18.6 — a schema change that was not committed is a failure, not a surprise on
      # a user's device.
      #
      # `git status --porcelain`, not `git diff`: a schema for a brand-new database version is an
      # *untracked* file, which `git diff` reports as clean. That is exactly the case this check
      # exists to catch.
      - name: Room schema is committed and current
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            echo "--- exported schema ---"
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      # Uploaded unconditionally: the schema check above only runs when `verifyDebug` succeeded, so
      # on a failing build the exported schema would otherwise be unreachable — and that is exactly
      # when a first run needs to produce it.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: core/database/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint and detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  dependency-report:
    name: Dependency and licence report
    runs-on: ubuntu-latest
    needs: [wrapper-validation]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # PRODUCT_SPEC 18.9 — the resolved dependency set is reviewable on every pull request, which
      # is what makes an unexpected transitive dependency visible before it ships.
      - name: Resolve dependencies for the debug variant
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 7
