name: Pull request

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Print KSP verification entries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Resolve KSP and write verification metadata
        run: ./gradlew :core:database:kspDebugKotlin --rerun-tasks --write-verification-metadata sha256

      - name: Print only KSP 2.3.12 verification blocks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('gradle/verification-metadata.xml').read_text()
          blocks = re.findall(
              r'      <component group="com\.google\.devtools\.ksp"[^>]*version="2\.3\.12">.*?      </component>',
              text,
              flags=re.S,
          )
          if not blocks:
              raise SystemExit('No KSP 2.3.12 verification blocks found')
          print('\n'.join(blocks))
          PY

      - name: Room schema is committed and current
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::KSP changed committed Room schemas."
            echo "$changes"
            exit 1
          fi
