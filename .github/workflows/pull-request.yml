name: Pull request

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    name: Materialize dependency documentation refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ksp-2-3-12-phase2a
          fetch-depth: 0

      - name: Recover and apply reviewed documentation patch
        shell: bash
        run: |
          git fetch origin chore/bw-dep-01-ksp-2-3-12
          python - <<'PY'
          import base64
          import re
          import subprocess
          from pathlib import Path

          historical = subprocess.check_output(
              ['git', 'show', 'aa34aee12928476ce7d6161275bee1407462000b:.github/workflows/pull-request.yml'],
              text=True,
          )
          match = re.search(r"cat > /tmp/docs\.patch\.b64 <<'EOF'\n(.*?)\n\s+EOF", historical, re.S)
          if not match:
              raise SystemExit('Could not recover reviewed documentation patch')
          encoded = ''.join(match.group(1).split())
          Path('/tmp/docs.patch').write_bytes(base64.b64decode(encoded))
          PY
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          python - <<'PY'
          from pathlib import Path
          for name in (
              'docs/latest-stable-upgrade-plan.md',
              'docs/dependency-compatibility-inventory.md',
          ):
              path = Path(name)
              path.write_text('\n'.join(line.rstrip() for line in path.read_text().splitlines()) + '\n')
          PY
          git diff --check

      - name: Commit documentation to clean branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest-stable-upgrade-plan.md docs/dependency-compatibility-inventory.md
          git diff --cached --quiet && { echo "::error::No documentation change produced"; exit 1; }
          git commit -m "docs: refresh staged dependency migration plan"
          git push origin HEAD:chore/bw-dep-01-ksp-2-3-12-phase2a
