name: Pull request

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    name: Materialize dependency documentation refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ksp-2-3-12-phase2a
          fetch-depth: 0

      - name: Apply reviewed documentation patch
        shell: bash
        run: |
          cat > /tmp/docs.patch.b64 <<'EOF'
          
          
          
          
          EOF
          tr -d '[:space:]' < /tmp/docs.patch.b64 | base64 -d > /tmp/docs.patch
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          git diff --check
          git diff -- docs/latest-stable-upgrade-plan.md docs/dependency-compatibility-inventory.md

      - name: Commit documentation to clean branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest-stable-upgrade-plan.md docs/dependency-compatibility-inventory.md
          git diff --cached --quiet && { echo "::error::No documentation change produced"; exit 1; }
          git commit -m "docs: refresh staged dependency migration plan"
          git push origin HEAD:chore/bw-dep-01-ksp-2-3-12-phase2a
