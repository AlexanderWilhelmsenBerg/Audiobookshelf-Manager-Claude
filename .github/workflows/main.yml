name: Main

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apk.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
  JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
  GRADLE_WRAPPER_JAR_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172

jobs:
  release-checks:
    name: Release lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pinned Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          distribution_sha="$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)"
          [[ "$distribution_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::distributionSha256Sum must be pinned"; exit 1; }
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$actual" = "$GRADLE_WRAPPER_JAR_SHA256" || {
            echo "::error::Gradle wrapper JAR checksum mismatch"
            echo "expected=$GRADLE_WRAPPER_JAR_SHA256"
            echo "actual=$actual"
            exit 1
          }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify debug
        if: ${{ github.event_name != 'push' }}
        run: ./gradlew verifyDebug --continue --max-workers=4 -Pshelfplayer.warningsAsErrors=true
      - name: Release lint
        run: ./gradlew :app:lintRelease --max-workers=4 -Pshelfplayer.warningsAsErrors=true
      - name: Software Bill of Materials
        run: ./gradlew :app:sbom --max-workers=4
      - name: Dependency vulnerability scan
        run: ./scripts/vulnerability-scan.sh
      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease --max-workers=4 -Pshelfplayer.warningsAsErrors=true
      - name: Upload mapping and SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-supply-chain
          path: |
            app/build/reports/sbom/bom.json
            app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
