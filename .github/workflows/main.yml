name: Main

# PRODUCT_SPEC 18 — the main-branch gate.
#
# Everything the pull-request workflow runs, plus the release-side checks that are too slow to run on
# every pull request. Managed-device and Audiobookshelf container integration tests join this
# workflow in the phase that introduces the behavior they cover (PRODUCT_SPEC 17.1); adding an empty
# job for them now would report a green check for tests that do not exist.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a dependency that breaks the build is found before the next change lands on it.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  release-checks:
    name: Release lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify debug
        run: ./gradlew verifyDebug -Pshelfplayer.warningsAsErrors=true

      # PRODUCT_SPEC 16.5 — the release verification additionally runs release lint.
      - name: Release lint
        run: ./gradlew :app:lintRelease -Pshelfplayer.warningsAsErrors=true

      # PRODUCT_SPEC 18 — the Software Bill of Materials, unblocked by ADR-0024's licence decision.
      #
      # Run before the release assembly rather than after it: the task resolves
      # `releaseRuntimeClasspath` and builds nothing, so a component that reaches the app without a
      # pinned checksum fails here in seconds instead of after a full R8 run. It is also the reason
      # this step is not `if: always()` — a failing SBOM is a supply-chain finding, and continuing to
      # produce an APK past one would be the wrong order of business.
      - name: Software Bill of Materials
        run: ./gradlew :app:sbom

      # PRODUCT_SPEC 18 — the dependency vulnerability scan, over the SBOM produced above.
      #
      # `curl` against OSV's documented batch endpoint rather than a third-party scanning action: every
      # other action in this repository is first-party, and the SBOM already carries every purl the query
      # needs. `jq` is present on GitHub's Ubuntu runners.
      #
      # This reports what OSV knows about a published coordinate and says nothing about reachability, so
      # an advisory in a library the app never calls fails the build exactly like one in a library it
      # calls constantly. That is deliberate: deciding a vulnerability is unreachable belongs in a written
      # exemption rather than in a script's silence.
      - name: Dependency vulnerability scan
        run: ./scripts/vulnerability-scan.sh

      # PRODUCT_SPEC 18 — the release build is unsigned here on purpose. Signing happens only in a
      # protected environment with the key material, never in a workflow triggered by a push.
      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease -Pshelfplayer.warningsAsErrors=true

      # PRODUCT_SPEC 18 — the mapping archive. R8 writes these whenever minification runs, so this
      # needs no signing key and was never actually blocked on one; `docs/release.md` said it was.
      # Kept for the life of the build's retention rather than a release's, which is a gap this
      # cannot close: a crash report arriving months after a release needs the mapping from *that*
      # build, and that is a job for the store's own upload rather than for CI.
      - name: Upload mapping and SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-supply-chain
          path: |
            app/build/reports/sbom/bom.json
            app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
