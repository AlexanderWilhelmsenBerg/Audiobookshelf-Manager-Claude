name: Protobuf 4.36.1 compatibility bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-protobuf-4-36-1

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply Protobuf compatibility slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gradle/libs.versions.toml')
          text = path.read_text()
          old = 'protobuf = "4.31.1"'
          new = 'protobuf = "4.36.1"'
          if old not in text:
              raise SystemExit(f'expected version pin not found: {old}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate verification metadata and run required gates
        shell: bash
        run: |
          ./gradlew :core:datastore:testDebugUnitTest --rerun-tasks --write-verification-metadata sha256
          ./gradlew ktlintCheck --rerun-tasks --write-verification-metadata sha256
          ./gradlew verifyDebug --continue --rerun-tasks -Pshelfplayer.warningsAsErrors=true --write-verification-metadata sha256

      - name: Confirm schemas are untouched
        shell: bash
        run: git diff --exit-code -- core/datastore/src/main/proto

      - name: Commit permanent compatibility slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/libs.versions.toml gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
            exit 1
          fi
          git commit -m 'chore(deps): upgrade Protobuf to 4.36.1'
          git push
