name: Finalize OkHttp 5.4 ledger

on:
  push:
    branches:
      - chore/bw-dep-01-okhttp-5-4-0

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-okhttp-5-4-0

      - name: Reconcile merged Retrofit slice and OkHttp compatibility frontier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          plan = Path('docs/latest-stable-upgrade-plan.md')
          text = plan.read_text()
          row167 = '| #167 | Retrofit kotlinx.serialization converter | Jake Wharton 1.0.0 | Square 2.11.0 | 2026-09-16 |'
          row168 = '| #168 | Retrofit core + first-party converter | 2.11.0 | 3.0.0 | 2026-09-16 |'
          if row168 not in text:
              if text.count(row167) != 1:
                  raise SystemExit('Expected one #167 completed-slice row')
              text = text.replace(row167, row167 + '\n' + row168)

          old_phase = '\n'.join([
              'PR #167 retired the archived Jake Wharton Retrofit kotlinx.serialization converter in favor of Retrofit’s',
              'maintained first-party `converter-kotlinx-serialization` artifact while holding Retrofit core at 2.11.0 and OkHttp',
              'at 4.12.0. The next independent network slice upgrades Retrofit core and its first-party converter together from',
              '2.11.0 to 3.0.0 while deliberately keeping OkHttp at 4.12.0. Retrofit 3.0.0’s release notes state that 3.x maintains',
              'forward binary compatibility with 2.x and that its material dependency change is moving Retrofit’s OkHttp baseline',
              'to 4.12, which BookWave already uses directly. OkHttp 5 therefore remains a separate later risk axis. Stable',
              'kotlinx.serialization 1.10.0+ remains behind the compiler/build-foundation re-resolution.',
          ])
          new_phase = '\n'.join([
              'PR #167 retired the archived Jake Wharton Retrofit kotlinx.serialization converter, and PR #168 then upgraded',
              'Retrofit core plus its first-party converter to 3.0.0 while deliberately holding OkHttp at 4.12.0. The next',
              'independent network slice moves the shared OkHttp family to 5.4.0, the newest stable release whose Android artifact',
              'still compiles against API 36. OkHttp 5.5.0 raises `okhttp-android` to compileSdk 37, so it remains behind ADR-0011',
              'together with BookWave’s API 37 / AGP 9 foundation. OkHttp 5 keeps stable 4.x APIs binary and behaviorally compatible,',
              'while the 5.x line changes transport/runtime behavior such as enabling Happy Eyeballs by default. Keep the legacy',
              '`okhttp3.mockwebserver` compatibility artifact for this slice; moving tests to `mockwebserver3` is a separate',
              'API/package migration. Stable kotlinx.serialization 1.10.0+ remains behind the compiler/build-foundation re-resolution.',
          ])
          if text.count(old_phase) != 1:
              raise SystemExit('Expected one pre-OkHttp Phase 5 paragraph')
          plan.write_text(text.replace(old_phase, new_phase))

          ledger = Path('version-control.md')
          text = ledger.read_text()
          text, n = re.subn(
              r'\*\*Repository baseline checked:\*\* `main` at `[0-9a-f]{40}`',
              '**Repository baseline checked:** `main` at `19b8274162465a652e3068fe9e2fe4c7a50fe3bc`',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Expected one repository-baseline line')

          old_okhttp = '| `okhttp` | 4.12.0 | 5.5.0 | 🔁 Major network-stack migration deliberately left out of the converter-retirement slice; keep contract/TLS/WebSocket/download tests green when it moves. | 5 | 2026-09-16 | [OkHttp changelog](https://square.github.io/okhttp/changelogs/changelog/) |'
          new_okhttp = '| `okhttp` | 5.4.0 | 5.5.0 | 🎯 5.4.0 is the latest stable compatible with BookWave’s accepted API-36 / AGP-8 foundation. Upstream 5.4.0 builds `okhttp-android` with compileSdk 36; 5.5.0 raises it to compileSdk 37 and is therefore gated by ADR-0011. Preserve TLS, auth, WebSocket, download/resume and Media3 streaming contracts; keep the MockWebServer package migration separate. | 5 | 2026-09-16 | [OkHttp changelog](https://square.github.io/okhttp/changelogs/changelog/) |'
          if text.count(old_okhttp) != 1:
              raise SystemExit('Expected one old OkHttp ledger row')
          text = text.replace(old_okhttp, new_okhttp)

          old_retrofit = '| `retrofit` | 3.0.0 | 3.0.0 | ✅ Latest stable target in the active Retrofit-only Phase 5 slice. Upstream states that Retrofit 3.x maintains forward binary compatibility with 2.x and 3.0.0 moves Retrofit’s OkHttp baseline to 4.12, which BookWave already uses directly; OkHttp 5 remains a separate later migration. | 5 | 2026-09-16 | [Retrofit 3.0.0 release](https://github.com/square/retrofit/releases/tag/3.0.0) |'
          new_retrofit = '| `retrofit` | 3.0.0 | 3.0.0 | ✅ Latest stable reached in merged PR #168. Retrofit 3 remains on its stable API while the independent OkHttp 5 slice supplies the newer binary/behaviorally compatible HTTP engine. | 5 | 2026-09-16 | [Retrofit 3.0.0 release](https://github.com/square/retrofit/releases/tag/3.0.0) |'
          if text.count(old_retrofit) != 1:
              raise SystemExit('Expected one old Retrofit ledger row')
          text = text.replace(old_retrofit, new_retrofit)

          old_converter = '| Retrofit kotlinx.serialization converter | 3.0.0 (first-party; tracks `retrofit`) | 3.0.0 (first-party; tracks Retrofit) | ✅ Archived Jake Wharton 1.0.0 artifact was retired in merged PR #167. The active Retrofit 3 slice keeps the first-party converter aligned with Retrofit core at 3.0.0; OkHttp remains pinned separately at 4.12.0. | 5 | 2026-09-16 | [Retrofit 3.0.0 release](https://github.com/square/retrofit/releases/tag/3.0.0) |'
          new_converter = '| Retrofit kotlinx.serialization converter | 3.0.0 (first-party; tracks `retrofit`) | 3.0.0 (first-party; tracks Retrofit) | ✅ First-party converter aligned with Retrofit 3.0.0 in merged PR #168; no converter source change is part of the independent OkHttp 5 slice. | 5 | 2026-09-16 | [Retrofit 3.0.0 release](https://github.com/square/retrofit/releases/tag/3.0.0) |'
          if text.count(old_converter) != 1:
              raise SystemExit('Expected one old converter ledger row')
          text = text.replace(old_converter, new_converter)

          history167 = '| 2026-09-16 | #167 | Retrofit kotlinx.serialization converter | Jake Wharton 1.0.0 | Square 2.11.0 | ✅ Archived converter retired; first-party converter adopted without changing Retrofit or OkHttp major versions |'
          history168 = '| 2026-09-16 | #168 | Retrofit core + first-party converter | 2.11.0 | 3.0.0 | ✅ Latest stable reached; OkHttp intentionally held at 4.12.0 for the next independent network-major slice |'
          if history168 not in text:
              if text.count(history167) != 1:
                  raise SystemExit('Expected one #167 history row')
              text = text.replace(history167, history167 + '\n' + history168)
          ledger.write_text(text)
          PY

      - name: Commit ledger reconciliation
        shell: bash
        run: |
          git diff --quiet -- docs/latest-stable-upgrade-plan.md version-control.md && {
            echo 'Expected ledger changes were not produced.'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest-stable-upgrade-plan.md version-control.md
          git commit -m 'docs: record OkHttp API 36 compatibility frontier'
          git push origin HEAD:chore/bw-dep-01-okhttp-5-4-0
