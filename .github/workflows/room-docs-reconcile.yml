name: Reconcile Room upgrade documentation

on:
  push:
    branches:
      - chore/bw-dep-01-room-2-8-5

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-room-2-8-5
          fetch-depth: 0

      - name: Restore canonical docs from main and apply narrow migration updates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:version-control.md > version-control.md
          git show FETCH_HEAD:docs/latest-stable-upgrade-plan.md > docs/latest-stable-upgrade-plan.md

          python - <<'PY'
          from pathlib import Path

          ledger = Path("version-control.md")
          text = ledger.read_text()
          replacements = {
              '**Repository baseline checked:** `main` at `b4b7a38c82c26ede61322aac7ff2d1beb4c36a41`':
                  '**Repository baseline checked:** `main` at `50027ac5eb6b727477132ef291fb8adc8b22c1d2`',
              '| `androidxCore` | 1.17.0 direct pin; 1.18.0 resolved via Activity 1.13.0 | 1.19.0 | ⬆️ PR #161 proved the resolved Core 1.18.0 graph on BookWave\'s compileSdk 36. Keep the explicit direct-pin move to stable 1.19.0 as the next separate Phase 3 AndroidX slice. | 3 | 2026-09-15 | [Core releases](https://developer.android.com/jetpack/androidx/releases/core) |':
                  '| `androidxCore` | 1.17.0 direct pin; 1.18.0 resolved via Activity 1.13.0 | 1.19.0 | ⛔ Published Core 1.19.0 consumer requirements need compileSdk 37 and AGP 9.1+, so the explicit pin stays put until the ADR-0011 platform/build-foundation gate clears. | 3 | 2026-09-15 | [Core releases](https://developer.android.com/jetpack/androidx/releases/core) |',
              '| `androidxRoom` | 2.7.2 | 2.8.5 | 🔁 Persistence migration with schema/migration verification; keep separate from unrelated library bumps. | 4 | 2026-09-15 | [Room releases](https://developer.android.com/jetpack/androidx/releases/room) |':
                  '| `androidxRoom` | 2.8.5 | 2.8.5 | 🎯 Latest stable target in the active Room-only Phase 4 slice. Room 2.8 raises Android minSdk to 23 and the Room Gradle Plugin floor to AGP 8.4; BookWave minSdk 26 / AGP 8.12 remain compatible. Preserve all committed schemas and prove the database/migration suite unchanged. | 4 | 2026-09-15 | [Room releases](https://developer.android.com/jetpack/androidx/releases/room) |',
              '| `hilt` (Dagger/Hilt) | 2.58 | 2.60.1 | ⬆️ Dedicated Phase 4 DI upgrade after compiler/platform compatibility is established. | 4 | 2026-09-15 | [Dagger releases](https://github.com/google/dagger/releases) |':
                  '| `hilt` (Dagger/Hilt) | 2.58 | 2.60.1 | ⛔ Dagger/Hilt 2.59+ makes AGP 9 a requirement when the Hilt Gradle plugin is used, so 2.60.1 follows the ADR-0011 build-foundation gate. | 4 | 2026-09-15 | [Dagger releases](https://github.com/google/dagger/releases) |',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one ledger match for: {old[:80]}")
              text = text.replace(old, new)
          ledger.write_text(text)

          plan = Path("docs/latest-stable-upgrade-plan.md")
          text = plan.read_text()
          completed = '| #161 | AndroidX Activity | 1.12.4 | 1.13.0 | 2026-09-15 |'
          if text.count(completed) != 1:
              raise SystemExit("Expected one #161 completed row")
          text = text.replace(completed, completed + '\n| #162 | Gradle wrapper | 8.14.3 | 8.14.5 | 2026-09-15 |', 1)

          old_phase3 = '''**Status: partially active.** The AGP 9 / API 37 portion remains gated by ADR-0011, but independent AndroidX
          releases may proceed as narrow slices only when the current API-36 gates prove compatibility. PR #161 merged
          AndroidX Activity 1.13.0 after full CI and focused device smoke passed; that slice also proved the transitively resolved
          Core/Core-KTX 1.18.0 graph on BookWave's compileSdk 36. The next independent AndroidX slice is the explicit Core
          direct-pin move to stable 1.19.0. Activity 1.14 remains prerelease and is excluded.

          Lifecycle 2.11 Compose artifacts compile against API 37 and require AGP 9.2+, so Lifecycle now follows the same
          ADR-0011 platform/build-foundation gate rather than remaining an independent Phase-3 bump.'''.replace('          ', '')
          new_phase3 = '''**Status: partially active, with the remaining known updates platform-gated.** PR #161 merged AndroidX Activity
          1.13.0 after full CI and focused device smoke passed; that slice also proved the transitively resolved
          Core/Core-KTX 1.18.0 graph on BookWave's compileSdk 36. Re-resolution before this slice found stable Core 1.19.0
          requires compileSdk 37 and AGP 9.1+, so the explicit Core pin must not move independently on the current
          API-36 / AGP-8 foundation. Activity 1.14 remains prerelease and is excluded.

          Lifecycle 2.11 Compose artifacts compile against API 37 and require AGP 9.2+. Core 1.19.0, Lifecycle 2.11,
          Navigation 2.10, AndroidX Hilt 1.4 and the larger Compose/platform move therefore remain behind the same
          ADR-0011 platform/build-foundation gate.'''.replace('          ', '')
          if text.count(old_phase3) != 1:
              raise SystemExit("Expected one Phase 3 status block")
          text = text.replace(old_phase3, new_phase3)

          old_phase4 = '''Upgrade these in separate PRs because each owns user state or long-running behavior. DataStore reached the
          latest stable release in PR #154; do not manufacture another DataStore change while the ledger shows it
          current. Remaining ownership includes Room, WorkManager, Media3 and Dagger/Hilt whenever their rows are
          outdated.

          Room requirements:'''.replace('          ', '')
          new_phase4 = '''Upgrade these in separate PRs because each owns user state or long-running behavior. DataStore reached the
          latest stable release in PR #154; WorkManager and Media3 are also current in the live ledger. With the remaining
          independent Phase-3 paths gated, Room 2.8.5 is the next executable dependency axis.

          Room 2.8 raises Android minSdk from 21 to 23 and the Room Gradle Plugin minimum AGP from 8.1 to 8.4;
          BookWave minSdk 26 / AGP 8.12 satisfy both floors. This dependency/compiler upgrade does not itself justify
          changing the BookWave database version or rewriting committed schemas.

          Dagger/Hilt 2.59+ requires AGP 9 when the Hilt Gradle plugin is used, so Hilt 2.60.1 remains behind ADR-0011.

          Room requirements:'''.replace('          ', '')
          if text.count(old_phase4) != 1:
              raise SystemExit("Expected one Phase 4 intro block")
          text = text.replace(old_phase4, new_phase4)
          plan.write_text(text)
          PY

          git diff --check -- version-control.md docs/latest-stable-upgrade-plan.md

      - name: Commit reconciled documentation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/room-docs-reconcile.yml
          git add version-control.md docs/latest-stable-upgrade-plan.md .github/workflows/room-docs-reconcile.yml
          git diff --cached --check
          git commit -m "docs: reconcile Room migration frontier"
          git push
