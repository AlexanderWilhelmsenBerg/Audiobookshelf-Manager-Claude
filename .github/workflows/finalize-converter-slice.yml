name: Finalize converter slice bookkeeping

on:
  push:
    branches:
      - chore/bw-dep-01-first-party-retrofit-serialization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-first-party-retrofit-serialization

      - name: Reconcile source and migration ledgers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/AudiobookshelfServiceFactory.kt')
          text = source.read_text()
          old = '''import retrofit2.converter.kotlinx.serialization.asConverterFactory\nimport kotlinx.serialization.json.Json\nimport okhttp3.MediaType.Companion.toMediaType\nimport okhttp3.OkHttpClient\nimport retrofit2.Retrofit\n'''
          new = '''import kotlinx.serialization.json.Json\nimport okhttp3.MediaType.Companion.toMediaType\nimport okhttp3.OkHttpClient\nimport retrofit2.Retrofit\nimport retrofit2.converter.kotlinx.serialization.asConverterFactory\n'''
          if old not in text:
              raise SystemExit('expected converter import block not found')
          source.write_text(text.replace(old, new, 1))

          plan = Path('docs/latest-stable-upgrade-plan.md')
          text = plan.read_text()
          row = '| #165 | kotlinx.coroutines | 1.10.2 | 1.11.0 | 2026-09-15 |\n'
          if '| #166 | Protobuf runtime/protoc |' not in text:
              text = text.replace(row, row + '| #166 | Protobuf runtime/protoc | 4.31.1 / 31.1 | 4.36.1 / 36.1 | 2026-09-16 |\n', 1)
          old_phase = '''**Status: active in compatibility-sized slices.** kotlinx.serialization 1.9.0 landed in PR #164 as the newest\nstable release aligned with BookWave’s current Kotlin 2.2.0 compiler line, and kotlinx.coroutines 1.11.0 landed in\nPR #165 after the full rerun gate proved it compatible with BookWave’s Kotlin 2.2.0 build despite upstream building\nit with Kotlin 2.2.20. PR #166 is the next independent slice, moving the matched Protobuf Java/Kotlin-lite runtime\nand protoc from 4.31.1 / 31.1 to 4.36.1 / 36.1. Stable kotlinx.serialization 1.10.0+ remains behind the\ncompiler/build-foundation re-resolution.\n'''
          new_phase = '''**Status: active in compatibility-sized slices.** kotlinx.serialization 1.9.0 landed in PR #164 as the newest\nstable release aligned with BookWave’s current Kotlin 2.2.0 compiler line, kotlinx.coroutines 1.11.0 landed in PR #165\nafter the full rerun gate proved it compatible with BookWave’s Kotlin 2.2.0 build despite upstream building it with\nKotlin 2.2.20, and PR #166 moved the matched Protobuf Java/Kotlin-lite runtime and protoc to 4.36.1 / 36.1.\n\nThe archived Jake Wharton Retrofit kotlinx.serialization converter is retired as its own compatibility-sized axis:\nuse Retrofit’s maintained first-party `converter-kotlinx-serialization` artifact at the same 2.11.0 version as\nRetrofit core while deliberately holding Retrofit and OkHttp major versions fixed. Retrofit imported that converter\nunchanged in 2.10.0, so this isolates dependency ownership/coordinates from the later Retrofit 3 and OkHttp 5\nmigrations. Stable kotlinx.serialization 1.10.0+ remains behind the compiler/build-foundation re-resolution.\n'''
          if old_phase not in text:
              raise SystemExit('expected Phase 5 status block not found')
          text = text.replace(old_phase, new_phase, 1)
          text = text.replace('| retrofitKotlinxSerialization | Phase 5; migrate away from archived converter when appropriate |\n', '')
          plan.write_text(text)

          ledger = Path('version-control.md')
          text = ledger.read_text()
          text = text.replace('**Repository baseline checked:** `main` at `74bddd7af5cb020e4a6bb229a1b4ff7718285a15`', '**Repository baseline checked:** `main` at `615444e0f7bb671a32bdba4d4158694646e3357f`')
          text = text.replace('| `okhttp` | 4.12.0 | 5.5.0 | 🔁 Major network-stack migration; keep contract/TLS/WebSocket/download tests green. | 5 | 2026-09-15 | [OkHttp changelog](https://square.github.io/okhttp/changelogs/changelog/) |', '| `okhttp` | 4.12.0 | 5.5.0 | 🔁 Major network-stack migration deliberately left out of the converter-retirement slice; keep contract/TLS/WebSocket/download tests green when it moves. | 5 | 2026-09-16 | [OkHttp changelog](https://square.github.io/okhttp/changelogs/changelog/) |')
          text = text.replace('| `protobuf` | 4.36.1 | 4.36.1 (Protobuf 36.1) | ✅ Latest stable reached in active PR #166 with matched Java/Kotlin-lite runtime and protoc. The focused Proto DataStore suite and full classpath rerun gate are the compatibility evidence; the reported 36.1 Bazel prebuilt-tool integrity issue is outside BookWave\'s Gradle/Maven protoc path. | 5 | 2026-09-15 | [Protobuf releases](https://github.com/protocolbuffers/protobuf/releases) |', '| `protobuf` | 4.36.1 | 4.36.1 (Protobuf 36.1) | ✅ Latest stable reached in merged PR #166 with matched Java/Kotlin-lite runtime and protoc. The focused Proto DataStore suite and full classpath rerun gate are the compatibility evidence; the reported 36.1 Bazel prebuilt-tool integrity issue is outside BookWave\'s Gradle/Maven protoc path. | 5 | 2026-09-16 | [Protobuf releases](https://github.com/protocolbuffers/protobuf/releases) |')
          text = text.replace('| `retrofit` | 2.11.0 | 3.0.0 | 🔁 Major network-stack migration, preferably coordinated with OkHttp/converter evidence but not hidden in an unrelated PR. | 5 | 2026-09-15 | [Retrofit changelog](https://github.com/square/retrofit/blob/trunk/CHANGELOG.md) |', '| `retrofit` | 2.11.0 | 3.0.0 | 🔁 Major migration remains a later independent slice. Retrofit 2.12.0 is also stable, while 3.0.0 is the current stable frontier and keeps forward binary compatibility with 2.x; the converter-retirement slice intentionally holds core at 2.11.0. | 5 | 2026-09-16 | [Retrofit changelog](https://github.com/square/retrofit/blob/trunk/CHANGELOG.md) |')
          text = text.replace('| `retrofitKotlinxSerialization` | 1.0.0 | 1.0.0 (final; project archived) | 🔁 Do not chase a nonexistent newer release; migrate from the archived Jake Wharton converter to Retrofit\'s maintained first-party Kotlin serialization converter during the Retrofit migration. | 5 | 2026-09-15 | [Archived converter repository](https://github.com/JakeWharton/retrofit2-kotlinx-serialization-converter) |', '| Retrofit kotlinx.serialization converter | 2.11.0 (first-party; tracks `retrofit`) | 3.0.0 (first-party; tracks Retrofit) | ✅ Archived Jake Wharton 1.0.0 artifact retired in this Phase 5 slice. Retrofit imported that converter unchanged in 2.10.0, so the maintained Square artifact can replace it independently of the Retrofit 3 / OkHttp 5 migrations. | 5 | 2026-09-16 | [Retrofit changelog](https://github.com/square/retrofit/blob/trunk/CHANGELOG.md) |')
          history = '| 2026-09-15 | #165 | kotlinx.coroutines | 1.10.2 | 1.11.0 | ✅ Latest stable reached after full cancellation/concurrency rerun coverage on Kotlin 2.2.0 |\n'
          if '| 2026-09-16 | #166 | Protobuf runtime/protoc |' not in text:
              text = text.replace(history, history + '| 2026-09-16 | #166 | Protobuf runtime/protoc | 4.31.1 / 31.1 | 4.36.1 / 36.1 | ✅ Latest stable reached; application source and committed schemas unchanged |\n', 1)
          ledger.write_text(text)
          PY

          git diff --check
          git diff --exit-code -- core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/AudiobookshelfServiceFactory.kt docs/latest-stable-upgrade-plan.md version-control.md && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/network/src/main/kotlin/com/example/shelfplayer/core/network/api/AudiobookshelfServiceFactory.kt docs/latest-stable-upgrade-plan.md version-control.md
          git commit -m "docs: reconcile first-party Retrofit converter slice"
          git push origin HEAD:chore/bw-dep-01-first-party-retrofit-serialization
