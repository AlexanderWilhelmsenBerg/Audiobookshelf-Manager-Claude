name: Record Gradle maintenance history

on:
  push:
    branches:
      - chore/bw-dep-01-gradle-8-14-5

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add PR 162 to the living ledger
        shell: python
        run: |
          from pathlib import Path
          path = Path("version-control.md")
          text = path.read_text()
          anchor = "| 2026-09-15 | #161 | AndroidX Activity | 1.12.4 | 1.13.0 | ✅ Latest stable reached |\n"
          row = "| 2026-09-15 | #162 | Gradle wrapper | 8.14.3 | 8.14.5 | 🎯 Latest stable release in the accepted 8.14 maintenance line; Gradle 9 remains gated |\n"
          if row not in text:
              text = text.replace(anchor, anchor + row)
          path.write_text(text)
      - name: Commit history row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-control.md
          git diff --cached --quiet && { echo "History row already present"; exit 0; }
          git commit -m "docs: record Gradle 8.14.5 maintenance slice"
          git push