name: Serialization 1.9.0 verification bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-serialization-1-9-0

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-serialization-1-9-0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply serialization compatibility slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('gradle/libs.versions.toml')
          text = catalog.read_text()
          old = 'kotlinxSerialization = "1.8.1"'
          new = 'kotlinxSerialization = "1.9.0"'
          if old not in text:
              raise SystemExit(f'expected catalog pin not found: {old}')
          catalog.write_text(text.replace(old, new, 1))

          ledger = Path('version-control.md')
          text = ledger.read_text()
          old_base = '**Repository baseline checked:** `main` at `50027ac5eb6b727477132ef291fb8adc8b22c1d2`'
          new_base = '**Repository baseline checked:** `main` at `72cabb1e36d8597eaf6f303e159f0c88615f395c`'
          if old_base not in text:
              raise SystemExit('expected ledger baseline not found')
          text = text.replace(old_base, new_base, 1)
          old_row = '| `kotlinxSerialization` | 1.8.1 | 1.11.0 | ⬆️ Phase 5; 1.12.0-RC is excluded as prerelease. | 5 | 2026-09-15 | [kotlinx.serialization releases](https://github.com/Kotlin/kotlinx.serialization/releases) |'
          new_row = '| `kotlinxSerialization` | 1.9.0 | 1.11.0 | 🎯 1.9.0 is the newest stable release aligned with BookWave’s current Kotlin 2.2.0 compiler line. Upstream 1.10.0 moved to Kotlin 2.3.0 and 1.11.0 is based on Kotlin 2.3.20, so those remain compiler-gated until Phase 1/2 re-resolves Kotlin. | 5 | 2026-09-15 | [kotlinx.serialization releases](https://github.com/Kotlin/kotlinx.serialization/releases) |'
          if old_row not in text:
              raise SystemExit('expected serialization ledger row not found')
          ledger.write_text(text.replace(old_row, new_row, 1))

          plan = Path('docs/latest-stable-upgrade-plan.md')
          text = plan.read_text()
          room_row = '| #162 | Gradle wrapper | 8.14.3 | 8.14.5 | 2026-09-15 |'
          if '| #163 | AndroidX Room | 2.7.2 | 2.8.5 | 2026-09-15 |' not in text:
              if room_row not in text:
                  raise SystemExit('expected completed-slices insertion point not found')
              text = text.replace(room_row, room_row + '\n| #163 | AndroidX Room | 2.7.2 | 2.8.5 | 2026-09-15 |', 1)
          old_phase = '''## Phase 5 — Kotlin runtime, serialization and network stack

Upgrade deliberately from the current values to the stable targets recorded in `/version-control.md`. This
phase owns kotlinx-coroutines, kotlinx-serialization, OkHttp, Retrofit, the Kotlin serialization converter,
Protobuf runtime/protoc and `javax.inject` compatibility. Several jumps cross major versions. The archived
Jake Wharton Retrofit serialization converter should be treated as a migration to Retrofit's maintained
first-party path, not as a version bump that does not exist.
'''
          new_phase = '''## Phase 5 — Kotlin runtime, serialization and network stack

**Status: active in compatibility-sized slices.** The current Kotlin 2.2.0 foundation can take
kotlinx.serialization 1.9.0 independently because that stable release is based on Kotlin 2.2.0. Stable
kotlinx.serialization 1.10.0 moved to Kotlin 2.3.0 and 1.11.0 is based on Kotlin 2.3.20, so those later
releases remain behind the compiler/build-foundation re-resolution rather than being forced into this slice.

Upgrade deliberately from the current values to the compatible stable targets recorded in `/version-control.md`.
This phase owns kotlinx-coroutines, kotlinx-serialization, OkHttp, Retrofit, the Kotlin serialization converter,
Protobuf runtime/protoc and `javax.inject` compatibility. Several jumps cross major versions. The archived
Jake Wharton Retrofit serialization converter should be treated as a migration to Retrofit's maintained
first-party path, not as a version bump that does not exist.
'''
          if old_phase not in text:
              raise SystemExit('expected Phase 5 text not found')
          plan.write_text(text.replace(old_phase, new_phase, 1))
          PY

      - name: Generate verification metadata and run required gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintCheck --rerun-tasks --write-verification-metadata sha256
          ./gradlew verifyDebug --continue --rerun-tasks -Pshelfplayer.warningsAsErrors=true --write-verification-metadata sha256

          schema_changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$schema_changes" ]; then
            echo "::error::Serialization dependency upgrade changed committed Room schemas."
            echo "$schema_changes"
            exit 1
          fi

      - name: Commit permanent slice and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/serialization-1-9-0-bootstrap.yml
          git add gradle/libs.versions.toml gradle/verification-metadata.xml version-control.md docs/latest-stable-upgrade-plan.md .github/workflows/serialization-1-9-0-bootstrap.yml
          git diff --cached --check
          git commit -m "chore(deps): upgrade kotlinx.serialization to 1.9.0"
          git push