name: Activity verification bootstrap

on:
  push:
    branches:
      - chore/bw-dep-01-activity-1-13-0
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Generate strict verification metadata for AndroidX Activity 1.13.0
        run: ./gradlew --write-verification-metadata sha256 :app:assembleDebug --rerun-tasks

      - name: Commit generated verification metadata
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "::error::Gradle produced no verification-metadata change for the Activity upgrade."
            exit 1
          fi
          git diff -- gradle/verification-metadata.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "chore(deps): record Activity verification metadata"
          git push
