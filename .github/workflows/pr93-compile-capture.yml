name: PR93 compile capture

on:
  push:
    branches:
      - diagnostic/pr93-compile
    paths:
      - .github/workflows/pr93-compile-capture.yml

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Capture compile output
        shell: bash
        run: |
          set +e
          ./gradlew :playback:compileDebugKotlin :app:compileDebugKotlin --continue -Pshelfplayer.warningsAsErrors=true > compile.txt 2>&1
          status=$?
          echo "exit_status=$status" >> compile.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compile.txt
          git commit -m "Capture PR93 compile failure" || true
          git push
          exit 0
