name: PR93 final verify capture

on:
  push:
    branches:
      - diagnostic/pr93-final-verify
    paths:
      - .github/workflows/pr93-final-verify.yml

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Capture exact verifyDebug output
        shell: bash
        run: |
          set +e
          ./gradlew ktlintCheck verifyDebug --continue -Pshelfplayer.warningsAsErrors=true > final-verify.txt 2>&1
          status=$?
          echo "exit_status=$status" >> final-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-verify.txt
          git commit -m "Capture final PR93 verification" || true
          git push
          exit 0
