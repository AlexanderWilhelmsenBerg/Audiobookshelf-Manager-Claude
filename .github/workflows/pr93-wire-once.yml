name: PR93 service wiring once

on:
  push:
    branches:
      - refactor/unified-resume-freshness
    paths:
      - .github/workflows/pr93-wire-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
      - name: Apply service wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr93-wire.py
          git diff --check
          git status --short
          git rm .github/workflows/pr93-wire-once.yml scripts/pr93-wire.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/BookChanges.kt playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt app/src/main/kotlin/com/example/shelfplayer/feature/player/PlayerViewModel.kt
          git commit -m "Wire unified resume freshness into Media3"
          git push origin HEAD:refactor/unified-resume-freshness
