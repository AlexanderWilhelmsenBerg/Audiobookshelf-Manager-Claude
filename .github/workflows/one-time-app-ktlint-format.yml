name: One-time app ktlint format

on:
  push:
    branches:
      - feature/glass-mini-player-navigation
    paths:
      - .github/workflows/one-time-app-ktlint-format.yml

permissions:
  contents: write

jobs:
  format-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/glass-mini-player-navigation

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format app Kotlin
        run: ./gradlew :app:ktlintFormat

      - name: Commit formatter output
        run: |
          if git diff --quiet -- app/src/main/kotlin; then
            echo "No app formatting changes needed."
            exit 0
          fi
          git config user.name "bookwave-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin
          git commit -m "Format glass UI changes"
          git push origin HEAD:feature/glass-mini-player-navigation
