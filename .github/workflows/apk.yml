name: Build APK

run-name: "Build APK · ${{ github.ref_name }}"

# Canonical BookWave APK producer.
#
# Manual: use GitHub's native "Use workflow from" selector, choose debug/release and optional verification.
# Verified PR handoff: PR CI sends repository_dispatch only after a requested Standard/Intensive run passes;
# this trusted workflow revalidates the exact same-repository PR head before exposing signing secrets.
#
# Debug and release builds use the same protected BOOKWAVE_SIGNING_* identity, matching the proven
# Forgejo path. Downloaded debug APKs therefore upgrade one another in place without certificate drift.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which build to produce'
        type: choice
        default: debug
        options:
          - debug
          - release
      run_checks:
        description: 'Run verifyDebug before building'
        type: boolean
        default: false
      include_loopbound:
        description: 'Embed the private Loopbound game bundle'
        type: boolean
        default: true
      loopbound_ref:
        description: 'Loopbound branch, tag, or commit to embed'
        type: string
        required: true
        default: 'main'
  repository_dispatch:
    types: [build_verified_apk]

concurrency:
  group: build-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  source:
    name: Resolve APK source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.source.outputs.pr }}
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
      variant: ${{ steps.source.outputs.variant }}
      run_checks: ${{ steps.source.outputs.run_checks }}
      include_loopbound: ${{ steps.source.outputs.include_loopbound }}
      loopbound_ref: ${{ steps.source.outputs.loopbound_ref }}
    steps:
      - name: Resolve and validate source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.client_payload.source_sha }}
          VERIFIED_BRANCH: ${{ github.event.client_payload.source_branch }}
          VERIFIED_PR: ${{ github.event.client_payload.pr_number }}
          MANUAL_VARIANT: ${{ inputs.variant }}
          MANUAL_RUN_CHECKS: ${{ inputs.run_checks }}
          MANUAL_INCLUDE_LOOPBOUND: ${{ inputs.include_loopbound }}
          MANUAL_LOOPBOUND_REF: ${{ inputs.loopbound_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SHA="${VERIFIED_SHA,,}"
            BRANCH="$VERIFIED_BRANCH"
            NUMBER="$VERIFIED_PR"
            VARIANT=debug
            RUN_CHECKS=false
            INCLUDE_LOOPBOUND=true
            LOOPBOUND_REF=main

            if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Verified dispatch must contain a full commit SHA."
              exit 1
            fi
            if ! [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Verified dispatch must contain a PR number."
              exit 1
            fi

            IFS=$'\t' read -r PR_SHA PR_BRANCH CROSS_REPO <<< "$(
              gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --json headRefOid,headRefName,isCrossRepository \
                --jq '[.headRefOid, .headRefName, .isCrossRepository] | @tsv'
            )"
            if [ "$CROSS_REPO" = "true" ]; then
              echo "::error::Signed APK builds are not allowed from fork PRs."
              exit 1
            fi
            if [ "${PR_SHA,,}" != "$SHA" ]; then
              echo "::error::PR #$NUMBER moved after verification: expected $SHA, current head is $PR_SHA."
              exit 1
            fi
            if [ "$PR_BRANCH" != "$BRANCH" ]; then
              echo "::error::Verified branch '$BRANCH' no longer matches PR #$NUMBER branch '$PR_BRANCH'."
              exit 1
            fi
            echo "Verified CI handoff: PR #$NUMBER · $BRANCH @ ${SHA:0:8}"
          else
            SHA="$GITHUB_SHA"
            BRANCH="$GITHUB_REF_NAME"
            NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
              --state open --limit 1 --json number --jq '.[0].number // empty')"
            VARIANT="${MANUAL_VARIANT:-debug}"
            RUN_CHECKS="${MANUAL_RUN_CHECKS:-false}"
            INCLUDE_LOOPBOUND="${MANUAL_INCLUDE_LOOPBOUND:-true}"
            LOOPBOUND_REF="${MANUAL_LOOPBOUND_REF:-main}"
            echo "Manual build: $BRANCH @ ${SHA:0:8}; PR ${NUMBER:-none}."
          fi

          case "$VARIANT" in debug|release) ;; *) echo "::error::Unsupported APK variant: $VARIANT"; exit 1 ;; esac
          {
            echo "pr=${NUMBER:-}"
            echo "branch=$BRANCH"
            echo "sha=$SHA"
            echo "variant=$VARIANT"
            echo "run_checks=$RUN_CHECKS"
            echo "include_loopbound=$INCLUDE_LOOPBOUND"
            echo "loopbound_ref=$LOOPBOUND_REF"
          } >> "$GITHUB_OUTPUT"

  loopbound:
    name: Loopbound web bundle
    needs: source
    if: ${{ needs.source.outputs.include_loopbound == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.bundle.outputs.sha }}
    steps:
      - name: Require Loopbound read token
        env:
          LOOPBOUND_READ_TOKEN: ${{ secrets.LOOPBOUND_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LOOPBOUND_READ_TOKEN:-}" ]; then
            echo "::error::Loopbound embedding is enabled, but LOOPBOUND_READ_TOKEN is not configured."
            echo "::error::Create a fine-grained token limited to AlexanderWilhelmsenBerg/Loopbound with Contents: Read."
            exit 1
          fi

      - name: Check out private Loopbound source
        uses: actions/checkout@v7
        with:
          repository: AlexanderWilhelmsenBerg/Loopbound
          ref: ${{ needs.source.outputs.loopbound_ref }}
          token: ${{ secrets.LOOPBOUND_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate, test and build Loopbound
        id: bundle
        run: |
          set -euo pipefail
          npm ci
          npm run validate:content
          npm test
          npm run build
          LOOPBOUND_SHA=$(git rev-parse HEAD)
          test -f dist/index.html
          printf '%s\n' "$LOOPBOUND_SHA" > dist/BOOKWAVE_LOOPBOUND_VERSION
          echo "sha=$LOOPBOUND_SHA" >> "$GITHUB_OUTPUT"
          echo "Built Loopbound ${LOOPBOUND_SHA:0:8} from ${{ needs.source.outputs.loopbound_ref }}."

      - name: Upload compiled Loopbound bundle
        uses: actions/upload-artifact@v7
        with:
          name: loopbound-web-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  apk:
    name: ${{ needs.source.outputs.variant }} APK
    needs: [source, loopbound]
    if: ${{ always() && needs.source.result == 'success' && (needs.loopbound.result == 'success' || needs.loopbound.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR build checks out the immutable head SHA resolved above. The workflow definition still comes
          # from `main`, but the source being compiled is exactly the PR revision named in the run.
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Download compiled Loopbound bundle
        if: ${{ needs.source.outputs.include_loopbound == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: loopbound-web-${{ github.run_id }}
          path: app/src/main/assets/loopbound

      - name: Verify staged Loopbound bundle
        if: ${{ needs.source.outputs.include_loopbound == 'true' }}
        env:
          EXPECTED_LOOPBOUND_SHA: ${{ needs.loopbound.outputs.sha }}
        run: |
          set -euo pipefail
          test -f app/src/main/assets/loopbound/index.html
          test -f app/src/main/assets/loopbound/BOOKWAVE_LOOPBOUND_VERSION
          ACTUAL_LOOPBOUND_SHA=$(tr -d '\r\n' < app/src/main/assets/loopbound/BOOKWAVE_LOOPBOUND_VERSION)
          if [ "$ACTUAL_LOOPBOUND_SHA" != "$EXPECTED_LOOPBOUND_SHA" ]; then
            echo "::error::Loopbound bundle version marker does not match the build job."
            exit 1
          fi
          echo "Staged Loopbound ${ACTUAL_LOOPBOUND_SHA:0:8} into BookWave assets."

      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Stage shared BookWave signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOOKWAVE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_BASE64:-}" ] || missing+=("BOOKWAVE_SIGNING_KEYSTORE_BASE64")
          [ -n "${STORE_PASSWORD:-}" ] || missing+=("BOOKWAVE_SIGNING_STORE_PASSWORD")
          [ -n "${KEY_ALIAS:-}" ] || missing+=("BOOKWAVE_SIGNING_KEY_ALIAS")
          [ -n "${KEY_PASSWORD:-}" ] || missing+=("BOOKWAVE_SIGNING_KEY_PASSWORD")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Build APK requires one stable BOOKWAVE_SIGNING_* identity for both debug and release."
            printf '::error::Missing secret: %s\n' "${missing[@]}"
            exit 1
          fi

          path="$RUNNER_TEMP/bookwave-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$path"
          chmod 600 "$path"
          test -s "$path" || { echo "::error::Decoded signing keystore is empty."; exit 1; }

          signer="$(keytool -list -v -keystore "$path" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$signer" || { echo "::error::Could not read the signing certificate fingerprint."; exit 1; }

          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "signer=$signer" >> "$GITHUB_OUTPUT"
          echo "Signing identity: ${signer:0:16}…"

      # Off by default so a quick device build is quick. On when you want the APK to carry the same
      # guarantee a merged commit does.
      - name: Verify debug
        if: ${{ needs.source.outputs.run_checks == 'true' }}
        env:
          BOOKWAVE_DEBUG_KEYSTORE: ${{ steps.keystore.outputs.path }}
          BOOKWAVE_DEBUG_STORE_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_STORE_PASSWORD }}
          BOOKWAVE_DEBUG_KEY_ALIAS: ${{ secrets.BOOKWAVE_SIGNING_KEY_ALIAS }}
          BOOKWAVE_DEBUG_KEY_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew verifyDebug -Pshelfplayer.warningsAsErrors=true

      - name: Assemble debug
        if: ${{ needs.source.outputs.variant == 'debug' }}
        env:
          BOOKWAVE_PR: ${{ needs.source.outputs.pr }}
          BOOKWAVE_COMMIT: ${{ needs.source.outputs.sha }}
          BOOKWAVE_BRANCH: ${{ needs.source.outputs.branch }}
          BOOKWAVE_RUN_NUMBER: ${{ github.run_number }}
          BOOKWAVE_DEBUG_KEYSTORE: ${{ steps.keystore.outputs.path }}
          BOOKWAVE_DEBUG_STORE_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_STORE_PASSWORD }}
          BOOKWAVE_DEBUG_KEY_ALIAS: ${{ secrets.BOOKWAVE_SIGNING_KEY_ALIAS }}
          BOOKWAVE_DEBUG_KEY_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - name: Assemble release
        if: ${{ needs.source.outputs.variant == 'release' }}
        env:
          BOOKWAVE_PR: ${{ needs.source.outputs.pr }}
          BOOKWAVE_COMMIT: ${{ needs.source.outputs.sha }}
          BOOKWAVE_BRANCH: ${{ needs.source.outputs.branch }}
          BOOKWAVE_RUN_NUMBER: ${{ github.run_number }}
          BOOKWAVE_SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          BOOKWAVE_SIGNING_STORE_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_STORE_PASSWORD }}
          BOOKWAVE_SIGNING_KEY_ALIAS: ${{ secrets.BOOKWAVE_SIGNING_KEY_ALIAS }}
          BOOKWAVE_SIGNING_KEY_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # The version is read back out of the built APK rather than out of the build script, because the
      # artefact's name should describe the bytes attached to it. R-04 is exactly this failure: a
      # versionName that had not moved in nine builds made every field report name the wrong build.
      #
      # `versionCode` is 1000 + this run's number, so every APK this workflow produces installs over the
      # one before it regardless of which branch each came from. The pull request is in the artefact name
      # and on the About tab instead of in the code — see `BuildIdentity`.
      - name: Read the built version
        id: version
        env:
          PR_NUMBER: ${{ needs.source.outputs.pr }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_BRANCH: ${{ needs.source.outputs.branch }}
          INCLUDE_LOOPBOUND: ${{ needs.source.outputs.include_loopbound }}
          LOOPBOUND_SHA: ${{ needs.loopbound.outputs.sha }}
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          BADGING=$("$AAPT" dump badging "$APK")
          NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          # The pull request goes in the artefact's name because it is no longer in the code. A downloads
          # folder holding three of these has to be readable without opening any of them.
          echo "label=$NAME-$CODE${PR_NUMBER:+-pr$PR_NUMBER}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.variant }} APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package | \`$PKG\` |"
            echo "| Version | \`$NAME\` (code \`$CODE\`) |"
            echo "| Commit | \`${SOURCE_SHA:0:8}\` on \`$SOURCE_BRANCH\` |"
            echo "| Source | ${PR_NUMBER:+PR $PR_NUMBER · }\`$SOURCE_BRANCH\`, as the About tab reports it |"
            if [ "$INCLUDE_LOOPBOUND" = "true" ]; then
              echo "| Loopbound | \`${LOOPBOUND_SHA:0:8}\` from \`${{ inputs.loopbound_ref }}\` |"
            else
              echo "| Loopbound | not bundled |"
            fi
            echo "| Checks | ${{ needs.source.outputs.run_checks == 'true' && 'verifyDebug passed' || 'not run — assembled only' }} |"
            echo
            # Asked of the artefact rather than inferred from whether a secret was set: the point is to
            # tell somebody whether the file they are about to download will install, and — for debug —
            # whether it will install *over the one already on the phone*.
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            SIGNER=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ -n "$SIGNER" ]; then
              echo "| Signer | \`${SIGNER:0:16}…\` |"
            fi
            echo
            if [ -z "$SIGNER" ]; then
              echo "> **Unsigned**, because the signing secrets are not set on this repository."
              if [ "${{ inputs.variant }}" = "release" ]; then
                echo "> It cannot be installed as-is — it is for inspecting what R8 produced."
              else
                echo "> Signed with a key this runner generated and then threw away, so it will **not**"
                echo "> install over an existing BookWave: \`adb install -r\` fails and you must"
                echo "> uninstall first, losing the sign-in and the downloads."
              fi
              echo "> \`docs/release.md\` § Signing lists the four secrets that fix this."
            elif [ "${{ inputs.variant }}" = "release" ]; then
              echo "> **Signed** with the upload key, and installable. Play App Signing re-signs it"
              echo "> on upload (ADR-0024), so this is not the key end users will verify against."
            else
              echo "> **Signed** with the stable key, so \`adb install -r\` upgrades in place and the"
              echo "> sign-in, passcode, progress and downloaded books all survive. The signer above"
              echo "> should match the previous build's; if it changed, the first install needs an"
              echo "> uninstall."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # upload-artifact v7 can upload one file directly instead of wrapping it in a ZIP. Give the
      # debug APK a descriptive filename first because direct uploads use the filename as the artifact name.
      - name: Prepare the debug APK for direct download
        if: ${{ needs.source.outputs.variant == 'debug' }}
        id: debug_artifact
        env:
          SOURCE_APK: ${{ steps.version.outputs.apk }}
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          set -euo pipefail
          TARGET="bookwave-debug-${LABEL}.apk"
          cp "$SOURCE_APK" "$TARGET"
          echo "apk=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload the debug APK
        if: ${{ needs.source.outputs.variant == 'debug' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.debug_artifact.outputs.apk }}
          archive: false
          if-no-files-found: error
          # Long enough to still be there when a device test is remembered a fortnight later, short enough
          # not to accumulate 27 MB per curious run forever.
          retention-days: 30

      - name: Upload the release APK
        if: ${{ needs.source.outputs.variant == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: bookwave-release-${{ steps.version.outputs.label }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      # R8's mapping is the only thing that makes a release stack trace readable, and it is regenerated on
      # every build — so an APK kept without its mapping is an APK whose crashes cannot be read.
      - name: Upload the R8 mapping
        if: ${{ needs.source.outputs.variant == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: bookwave-release-mapping-${{ steps.version.outputs.label }}
          path: app/build/outputs/mapping/release/**
          if-no-files-found: warn
          retention-days: 30
