name: Build APK

# An APK on demand, so a device test never waits for somebody to run a build by hand.
#
# ## How to get one
#
# GitHub → Actions → **Build APK** → *Run workflow*. Pick the branch, pick debug or release, run it. When
# it finishes, the APK is on the run's summary page under **Artifacts**. Phones can download it directly
# from that page.
#
# ## Why `workflow_dispatch` only
#
# Not on every push: this repository already runs `verifyDebug` on every pull request and the full release
# gate on `main`, and an APK built for a commit nobody asked about is 27 MB of storage and three minutes of
# runner for an artefact that expires unread. Asking for one is a deliberate act, so the trigger is too.
#
# ## Release depends on four repository secrets; debug depends on one of its own
#
# `PRODUCT_SPEC 15` and ADR-0024 keep key material out of the *repository* — Play App Signing holds the
# key that matters, and what a maintainer needs here is an **upload** key.
#
# **Release**: with the secrets set, the APK is signed and installs. Without them it is unsigned, useful
# for inspecting what R8 emitted and impossible to install.
#
# **Debug is signed by its own key and by nothing else.** The four secrets below configure the *release*
# build; they used to configure the debug build too, which made a debug APK's signature depend on whether
# they happened to be set — so a run with them and a run without them produced two differently-signed debug
# APKs and every switch cost the tester an uninstall. `DebugSigning.kt` owns the debug key now.
#
# On a runner that key has nothing to adopt (`~/.android/debug.keystore` does not exist on a fresh
# machine), so the build generates one — a **different** one on every run, which is the same
# `INSTALL_FAILED_UPDATE_INCOMPATIBLE` by a different route. Set `BOOKWAVE_DEBUG_KEYSTORE_BASE64` to stop
# that: it is restored to the fixed path the build reads, so every APK this workflow produces carries the
# same signature and `adb install -r` upgrades in place, keeping the sign-in, passcode, progress and
# downloaded books.
#
# To make one: build once locally, then `base64 -w0 ~/.bookwave/debug.keystore`. It is not a secret in any
# meaningful sense — it holds Android's public debug credentials — but it is stored as one because that is
# the mechanism GitHub gives for putting a file on a runner.
#
# The run summary prints the signer's fingerprint, read back out of the artefact rather than assumed.
#
#   BOOKWAVE_DEBUG_KEYSTORE_BASE64     base64 of ~/.bookwave/debug.keystore — optional. Without it the
#                                      workflow falls back to the upload keystore below, so one key signs
#                                      both; with neither, every debug APK needs an uninstall first.
#   BOOKWAVE_SIGNING_KEYSTORE_BASE64   base64 of the upload keystore (`base64 -w0 upload.jks`)
#   BOOKWAVE_SIGNING_STORE_PASSWORD
#   BOOKWAVE_SIGNING_KEY_ALIAS
#   BOOKWAVE_SIGNING_KEY_PASSWORD
#
# The keystore is written to the runner's temp directory, never into the checkout — the build refuses a
# keystore inside the repository outright, which is `ReleaseSigning.kt`'s second refusal.
#
# **This workflow is `workflow_dispatch` only, which is what makes signing here legitimate.**
# `PRODUCT_SPEC 18` forbids signing in a workflow triggered by a push; asking for a signed build is a
# deliberate act by somebody with write access, and `main.yml` — which *is* push-triggered — is left
# unsigned.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which build to produce'
        type: choice
        default: debug
        options:
          - debug
          - release
      run_checks:
        description: 'Run verifyDebug before building (slower, but the APK is then known-good)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  apk:
    name: ${{ inputs.variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Off by default so a quick device build is quick. On when you want the APK to carry the same
      # guarantee a merged commit does.
      - name: Verify debug
        if: ${{ inputs.run_checks }}
        run: ./gradlew verifyDebug -Pshelfplayer.warningsAsErrors=true

      # Decoded outside the checkout, and removed by the runner with the rest of RUNNER_TEMP. Skipped
      # entirely when the secret is absent, which leaves the build with no signing inputs at all.
      # **Release only** — the debug key is staged above and is deliberately independent of this one.
      # Restored to the fixed path `DebugSigning.kt` reads, so a debug APK from this workflow carries the
      # same signature as the last one. Skipped when the secret is absent, which leaves the build to
      # generate a fresh key — installable, but not *upgradable* over the previous run's APK.
      - name: Stage the debug keystore
        id: debugkey
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_DEBUG_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bookwave"
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.bookwave/debug.keystore"
            echo "source=debug-secret" >> "$GITHUB_OUTPUT"
            echo "Restored the shared debug keystore from BOOKWAVE_DEBUG_KEYSTORE_BASE64."
          elif [ -n "${UPLOAD_KEYSTORE_BASE64:-}" ]; then
            # No debug keystore of its own, but there is an upload key. Use it for debug too, with its own
            # credentials — a deliberate fallback rather than the invisible coupling this replaced, and the
            # only way one key can sign both without a second secret.
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$HOME/.bookwave/debug.keystore"
            echo "source=upload-key" >> "$GITHUB_OUTPUT"
            echo "No debug keystore secret; using the upload key for debug as well, so both are stable."
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "No keystore secrets at all; this build's debug key will be newly generated and thrown away."
          fi

      - name: Stage the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # The emptiness test is inside the script rather than in the step's `if`: a step's own `env`
          # block is not in scope for its own `if` expression, so `env.KEYSTORE_BASE64 != ''` there is
          # always true and would decode an empty secret into an empty keystore — which reaches Gradle
          # as a *partly* configured signing setup and fails the build for the wrong reason.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing keystore secret set; the release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble
        env:
          BOOKWAVE_SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          BOOKWAVE_SIGNING_STORE_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_STORE_PASSWORD }}
          BOOKWAVE_SIGNING_KEY_ALIAS: ${{ secrets.BOOKWAVE_SIGNING_KEY_ALIAS }}
          BOOKWAVE_SIGNING_KEY_PASSWORD: ${{ secrets.BOOKWAVE_SIGNING_KEY_PASSWORD }}
          # Only when the debug keystore *is* the upload keystore — otherwise the build uses Android's own
          # public debug credentials, which is what the generated and the shared-secret cases both hold.
          BOOKWAVE_DEBUG_STORE_PASSWORD: ${{ steps.debugkey.outputs.source == 'upload-key' && secrets.BOOKWAVE_SIGNING_STORE_PASSWORD || '' }}
          BOOKWAVE_DEBUG_KEY_ALIAS: ${{ steps.debugkey.outputs.source == 'upload-key' && secrets.BOOKWAVE_SIGNING_KEY_ALIAS || '' }}
          BOOKWAVE_DEBUG_KEY_PASSWORD: ${{ steps.debugkey.outputs.source == 'upload-key' && secrets.BOOKWAVE_SIGNING_KEY_PASSWORD || '' }}
        run: ./gradlew :app:assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }}

      # The version is read back out of the built APK rather than out of the build script, because the
      # artefact's name should describe the bytes attached to it. R-04 is exactly this failure: a
      # versionName that had not moved in nine builds made every field report name the wrong build.
      - name: Read the built version
        id: version
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          BADGING=$("$AAPT" dump badging "$APK")
          NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "label=$NAME-$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.variant }} APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package | \`$PKG\` |"
            echo "| Version | \`$NAME\` (code \`$CODE\`) |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Checks | ${{ inputs.run_checks && 'verifyDebug passed' || 'not run — assembled only' }} |"
            echo
            # Asked of the artefact rather than inferred from whether a secret was set: the point is to
            # tell somebody whether the file they are about to download will install, and — for debug —
            # whether it will install *over the one already on the phone*.
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            SIGNER=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ -n "$SIGNER" ]; then
              echo "| Signer | \`${SIGNER:0:16}…\` |"
            fi
            echo
            if [ -z "$SIGNER" ]; then
              echo "> **Unsigned**, because the signing secrets are not set on this repository."
              if [ "${{ inputs.variant }}" = "release" ]; then
                echo "> It cannot be installed as-is — it is for inspecting what R8 produced."
              else
                echo "> Signed with a key this runner generated and then threw away, so it will **not**"
                echo "> install over an existing BookWave: \`adb install -r\` fails and you must"
                echo "> uninstall first, losing the sign-in and the downloads."
              fi
              echo "> \`docs/release.md\` § Signing lists the four secrets that fix this."
            elif [ "${{ inputs.variant }}" = "release" ]; then
              echo "> **Signed** with the upload key, and installable. Play App Signing re-signs it"
              echo "> on upload (ADR-0024), so this is not the key end users will verify against."
            else
              echo "> **Signed** with the stable key, so \`adb install -r\` upgrades in place and the"
              echo "> sign-in, passcode, progress and downloaded books all survive. The signer above"
              echo "> should match the previous build's; if it changed, the first install needs an"
              echo "> uninstall."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: bookwave-${{ inputs.variant }}-${{ steps.version.outputs.label }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
          # Long enough to still be there when a device test is remembered a fortnight later, short enough
          # not to accumulate 27 MB per curious run forever.
          retention-days: 30

      # R8's mapping is the only thing that makes a release stack trace readable, and it is regenerated on
      # every build — so an APK kept without its mapping is an APK whose crashes cannot be read.
      - name: Upload the R8 mapping
        if: ${{ inputs.variant == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: bookwave-release-mapping-${{ steps.version.outputs.label }}
          path: app/build/outputs/mapping/release/**
          if-no-files-found: warn
          retention-days: 30
