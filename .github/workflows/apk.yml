name: Build APK

# An APK on demand, so a device test never waits for somebody to run a build by hand.
#
# ## How to get one
#
# GitHub → Actions → **Build APK** → *Run workflow*. Pick the branch, pick debug or release, run it. When
# it finishes, the APK is on the run's summary page under **Artifacts**. Phones can download it directly
# from that page.
#
# ## Why `workflow_dispatch` only
#
# Not on every push: this repository already runs `verifyDebug` on every pull request and the full release
# gate on `main`, and an APK built for a commit nobody asked about is 27 MB of storage and three minutes of
# runner for an artefact that expires unread. Asking for one is a deliberate act, so the trigger is too.
#
# ## The release build is unsigned, and that is the point
#
# `PRODUCT_SPEC 15` and ADR-0024 keep key material out of the repository — Play App Signing holds it.
# A release APK from here therefore **cannot be installed** without being signed first; it is for
# inspecting what R8 produced, which nothing has ever done (`docs/release.md` lists launching it once as
# still outstanding). Choose `debug` for anything you intend to put on a phone.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which build to produce'
        type: choice
        default: debug
        options:
          - debug
          - release
      run_checks:
        description: 'Run verifyDebug before building (slower, but the APK is then known-good)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  apk:
    name: ${{ inputs.variant }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Off by default so a quick device build is quick. On when you want the APK to carry the same
      # guarantee a merged commit does.
      - name: Verify debug
        if: ${{ inputs.run_checks }}
        run: ./gradlew verifyDebug -Pshelfplayer.warningsAsErrors=true

      - name: Assemble
        run: ./gradlew :app:assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }}

      # The version is read back out of the built APK rather than out of the build script, because the
      # artefact's name should describe the bytes attached to it. R-04 is exactly this failure: a
      # versionName that had not moved in nine builds made every field report name the wrong build.
      - name: Read the built version
        id: version
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          BADGING=$("$AAPT" dump badging "$APK")
          NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "label=$NAME-$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.variant }} APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package | \`$PKG\` |"
            echo "| Version | \`$NAME\` (code \`$CODE\`) |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Checks | ${{ inputs.run_checks && 'verifyDebug passed' || 'not run — assembled only' }} |"
            echo
            if [ "${{ inputs.variant }}" = "release" ]; then
              echo "> **Unsigned.** Play App Signing holds the key and it is not in this repository"
              echo "> (ADR-0024), so this cannot be installed as-is. Use the debug variant for a phone."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: bookwave-${{ inputs.variant }}-${{ steps.version.outputs.label }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
          # Long enough to still be there when a device test is remembered a fortnight later, short enough
          # not to accumulate 27 MB per curious run forever.
          retention-days: 30

      # R8's mapping is the only thing that makes a release stack trace readable, and it is regenerated on
      # every build — so an APK kept without its mapping is an APK whose crashes cannot be read.
      - name: Upload the R8 mapping
        if: ${{ inputs.variant == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: bookwave-release-mapping-${{ steps.version.outputs.label }}
          path: app/build/outputs/mapping/release/**
          if-no-files-found: warn
          retention-days: 30
