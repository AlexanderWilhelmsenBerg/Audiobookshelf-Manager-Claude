name: Refresh Retrofit 3 ledger baseline

on:
  push:
    branches:
      - chore/bw-dep-01-retrofit-3-0-0-clean

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-retrofit-3-0-0-clean

      - name: Refresh exact main baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('version-control.md')
          text = path.read_text()
          old = '**Repository baseline checked:** `main` at `5ba6f7a079259fc4101cf69dc832e53286f1cf34`'
          new = '**Repository baseline checked:** `main` at `920f7194aee0533b22ae2cf7aa9e7f58a4a23e15`'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old baseline, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff -- version-control.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-control.md
          git commit -m "docs: refresh Retrofit slice main baseline"
          git push origin HEAD:chore/bw-dep-01-retrofit-3-0-0-clean
