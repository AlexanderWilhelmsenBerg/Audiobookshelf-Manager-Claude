name: One-time HomeScreen import cleanup

on:
  push:
    branches:
      - feature/glass-mini-player-navigation
    paths:
      - .github/workflows/one-time-fix-home-imports.yml

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/glass-mini-player-navigation

      - name: Fix HomeScreen import order
        run: python .github/scripts/fix_home_imports.py

      - name: Commit import cleanup
        run: |
          git config user.name "bookwave-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/example/shelfplayer/feature/home/HomeScreen.kt
          git commit -m "Fix HomeScreen import ordering"
          git push origin HEAD:feature/glass-mini-player-navigation
