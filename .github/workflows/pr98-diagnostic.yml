name: PR 98 diagnostic

on:
  push:
    branches:
      - diagnostic/pr98-checks

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diagnostic/pr98-checks
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Capture app verification
        shell: bash
        run: |
          set +e
          ./gradlew :app:verifyDebug -Pshelfplayer.warningsAsErrors=true --stacktrace --console=plain > /tmp/pr98-verify.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- last 500 lines ---"
            tail -n 500 /tmp/pr98-verify.log
          } > .github/pr98-diagnostic.txt
          rm .github/workflows/pr98-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pr98-diagnostic.txt .github/workflows/pr98-diagnostic.yml
          git commit -m 'Capture PR98 app verification diagnostic'
          git push origin HEAD:diagnostic/pr98-checks
