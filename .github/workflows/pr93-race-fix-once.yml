name: PR93 race repair once

on:
  push:
    branches: [diagnostic/pr93-race-fix-runner]

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
