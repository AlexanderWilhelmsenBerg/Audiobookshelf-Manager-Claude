name: PR93 source repair

on:
  push:
    branches:
      - diagnostic/pr93-race-fix-runner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper
        uses: actions/checkout@v7
        with:
          ref: diagnostic/pr93-race-fix-runner

      - name: Preserve source patch
        run: cp tools/pr93_race_fix_followup.py /tmp/pr93_final_fix.py

      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
          clean: true

      - name: Apply source fixes
        run: |
          python3 /tmp/pr93_final_fix.py
          git diff --check
          git status --short

      - name: Push source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/example/shelfplayer/feature/player/PlayerViewModel.kt
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/ResumeFreshnessCoordinator.kt
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/OwnedResumePlayer.kt
          git commit -m "Fix PR93 full CI findings"
          git push origin HEAD:refactor/unified-resume-freshness
