name: PR93 race repair once

on:
  push:
    branches: [diagnostic/pr93-race-fix-runner]

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out runner helpers
        uses: actions/checkout@v7
        with:
          ref: diagnostic/pr93-race-fix-runner

      - name: Preserve repair scripts
        run: |
          cp tools/pr93_race_fix.py /tmp/pr93_race_fix.py
          cp tools/pr93_race_fix_followup.py /tmp/pr93_race_fix_followup.py

      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
          clean: true

      - name: Patch ownership races and retire the old custom resume path
        run: |
          python3 /tmp/pr93_race_fix.py
          python3 /tmp/pr93_race_fix_followup.py
          git diff --check
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format repaired code
        run: ./gradlew :playback:ktlintFormat

      - name: Run focused machine tests and formatting gate
        run: ./gradlew :playback:testDebugUnitTest ktlintCheck --continue -Pshelfplayer.warningsAsErrors=true

      - name: Verify only intended files changed
        run: |
          git diff --check
          git status --short

      - name: Commit repaired PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/AtomicResume.kt \
                  playback/src/main/kotlin/com/example/shelfplayer/playback/BookChanges.kt \
                  playback/src/main/kotlin/com/example/shelfplayer/playback/ResumeFreshnessCoordinator.kt \
                  playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt \
                  playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackController.kt \
                  playback/src/main/kotlin/com/example/shelfplayer/playback/FreshnessReopen.kt \
                  playback/src/test/kotlin/com/example/shelfplayer/playback/AtomicResumeTest.kt \
                  playback/src/test/kotlin/com/example/shelfplayer/playback/FreshnessReopenTest.kt
          git commit -m "Close PR93 resume ownership races"
          git push origin HEAD:refactor/unified-resume-freshness
