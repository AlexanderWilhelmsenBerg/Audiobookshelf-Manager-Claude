name: KSP verification bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/bw-dep-01-ksp-2-3-12-current

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Check local environment
        run: ./scripts/check-local-environment.sh

      - name: Generate KSP dependency verification metadata
        run: ./gradlew verifyDebug --continue --rerun-tasks -Pshelfplayer.warningsAsErrors=true --write-verification-metadata sha256

      - name: Run formatting gate from the changed classpath
        run: ./gradlew ktlintCheck --rerun-tasks

      - name: Run strict BookWave gate from the changed classpath
        run: ./gradlew verifyDebug --continue --rerun-tasks -Pshelfplayer.warningsAsErrors=true

      - name: Ensure Room schemas remain unchanged
        run: git diff --exit-code -- core/database/schemas

      - name: Commit generated verification metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Verification metadata is already current."
            exit 0
          fi
          git commit -m "chore(deps): trust KSP 2.3.12 artifacts"
          git push origin HEAD:chore/bw-dep-01-ksp-2-3-12-current
