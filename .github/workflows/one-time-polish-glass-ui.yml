name: One-time glass UI polish

on:
  push:
    branches:
      - feature/glass-mini-player-navigation
    paths:
      - .github/workflows/one-time-polish-glass-ui.yml

permissions:
  contents: write

jobs:
  patch-home-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/glass-mini-player-navigation

      - name: Apply HomeScreen glass navigation polish
        run: python .github/scripts/one_time_polish_glass_ui.py

      - name: Commit HomeScreen polish
        run: |
          git config user.name "bookwave-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/example/shelfplayer/feature/home/HomeScreen.kt
          git commit -m "Polish glass library navigation"
          git push origin HEAD:feature/glass-mini-player-navigation
