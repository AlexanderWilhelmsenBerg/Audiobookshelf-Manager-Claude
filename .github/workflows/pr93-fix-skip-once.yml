name: PR93 repair skip once

on:
  push:
    branches:
      - refactor/unified-resume-freshness
    paths:
      - .github/workflows/pr93-fix-skip-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/unified-resume-freshness
          fetch-depth: 0
      - name: Restore raw-service skip invalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt"); t=p.read_text(); marker="    /**\n     * PRODUCT_SPEC PLAY-003 — one play or pause, in the playing book'"'"'s history.\n"; insert="    private fun skipBy(delta: Duration) {\n        val current = player ?: return\n        if (current.mediaItemCount == 0) return\n        // Issue #91 — notification skip reaches the raw player through a custom session command.\n        // Invalidate before moving so an older freshness answer cannot overwrite this explicit skip.\n        resumeFreshness.invalidate(ResumeInvalidation.Seek)\n        current.seekTo((current.bookPosition() + delta).inWholeMilliseconds.coerceAtLeast(0))\n    }\n\n"; assert t.count(marker)==1, t.count(marker); p.write_text(t.replace(marker, insert+marker, 1))'
          git rm .github/workflows/pr93-fix-skip-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playback/src/main/kotlin/com/example/shelfplayer/playback/PlaybackService.kt
          git commit -m 'Restore notification skip freshness invalidation'
          git push origin HEAD:refactor/unified-resume-freshness
