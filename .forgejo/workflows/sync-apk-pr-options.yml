name: Deprecated — APK branch dropdown refresh

# Retained temporarily because the Forgejo MCP file API cannot delete repository files.
# Build APK now uses Forgejo's native "Use workflow from" branch selector directly.
# This workflow intentionally performs no repository mutation and can be removed after merge.

on:
  workflow_dispatch:

jobs:
  retired:
    name: Native branch selector is now authoritative
    runs-on: linux-amd64
    timeout-minutes: 2
    steps:
      - name: Explain replacement
        run: |
          echo "The generated APK branch dropdown has been retired."
          echo "Open the Build APK workflow and choose the BookWave branch with Forgejo's native 'Use workflow from' selector."
