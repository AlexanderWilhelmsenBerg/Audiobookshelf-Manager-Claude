name: Sync APK PR picker (retired)

# Retained temporarily because the current Forgejo gateway cannot delete repository files.
# The static APK pull-request dropdown was retired: Build APK now accepts an optional PR number
# and resolves that PR live through the Forgejo API at dispatch time.
#
# This workflow is intentionally manual-only and performs no repository mutation. It can be deleted
# in a later cleanup commit once a file-delete path is available.

on:
  workflow_dispatch:

jobs:
  retired:
    name: APK picker synchronizer retired
    runs-on: linux-amd64
    timeout-minutes: 2
    steps:
      - name: Explain retired workflow
        run: |
          echo "The APK PR picker synchronizer is retired."
          echo "Use Build APK and enter an optional PR number instead."
          echo "No branch or pull request will be created."
