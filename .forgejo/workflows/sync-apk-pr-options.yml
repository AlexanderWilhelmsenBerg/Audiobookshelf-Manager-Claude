name: Refresh workflow branch dropdowns

# Forgejo renders workflow_dispatch choice inputs from static YAML; it does not populate them dynamically.
# Run this helper when either the Build APK or Pull request branch list is stale. It snapshots the
# repository's current branches into both workflow dropdowns and commits the generated lists to main.
#
# This intentionally does NOT run automatically when branches change: every generated update moves main,
# which can make unrelated open PRs need a rebase. The user decides when refreshing the picker is worth it.

on:
  workflow_dispatch:

concurrency:
  group: refresh-workflow-branch-dropdowns
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh branch choices
    runs-on: linux-amd64
    container:
      image: forgejo.homebord.org/alexander/bookwave-ci@sha256:bf0f8f06ed41f9dd98b36332b2f1170906d0363c89fdd7c918ce0186844b6b85
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Read current repository branches
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/bookwave-branches.ndjson"
          payload="$RUNNER_TEMP/bookwave-branches.json"
          : > "$pages"

          page=1
          while :; do
            page_json="$(curl -fsS \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H 'Accept: application/json' \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/branches?limit=100&page=$page")"
            count="$(jq 'length' <<<"$page_json")"
            if [ "$count" -eq 0 ]; then
              break
            fi
            jq -c '.[]' <<<"$page_json" >> "$pages"
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          jq -s '.' "$pages" > "$payload"
          echo "BRANCH_PAYLOAD=$payload" >> "$FORGEJO_ENV"

      - name: Regenerate branch choices
        run: |
          set -euo pipefail
          python3 - "$BRANCH_PAYLOAD" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          branches = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          names = sorted(
              {
                  item.get("name")
                  for item in branches
                  if isinstance(item, dict) and isinstance(item.get("name"), str) and item["name"]
              }
          )
          if "main" in names:
              names.remove("main")
              names.insert(0, "main")
          if not names:
              raise SystemExit("Forgejo returned no repository branches")

          def replace_block(workflow, begin, end, values):
              options = "\n".join(f"          - {json.dumps(name)}" for name in values)
              replacement = f"{begin}\n{options}\n{end}"
              text = workflow.read_text(encoding="utf-8")
              pattern = rf"(?ms)^{re.escape(begin)}$.*?^{re.escape(end)}$"
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"{workflow}: expected one generated branch block, found {count}")
              workflow.write_text(updated, encoding="utf-8")
              print(f"{workflow}: generated {len(values)} branch choices.")

          replace_block(
              Path(".forgejo/workflows/apk.yml"),
              "          # BEGIN GENERATED BOOKWAVE BRANCH OPTIONS",
              "          # END GENERATED BOOKWAVE BRANCH OPTIONS",
              names,
          )

          pr_names = ["__select_pr_branch__", *[name for name in names if name != "main"]]
          replace_block(
              Path(".forgejo/workflows/pull-request.yml"),
              "          # BEGIN GENERATED PR SOURCE BRANCH OPTIONS",
              "          # END GENERATED PR SOURCE BRANCH OPTIONS",
              pr_names,
          )
          PY

      - name: Validate generated workflows
        run: |
          set -euo pipefail
          grep -Fq "bookwave_branch:" .forgejo/workflows/apk.yml
          grep -Fq "type: choice" .forgejo/workflows/apk.yml
          grep -Fq "# BEGIN GENERATED BOOKWAVE BRANCH OPTIONS" .forgejo/workflows/apk.yml
          grep -Fq "# END GENERATED BOOKWAVE BRANCH OPTIONS" .forgejo/workflows/apk.yml

          grep -Fq "bookwave_branch:" .forgejo/workflows/pull-request.yml
          grep -Fq "default: \"__select_pr_branch__\"" .forgejo/workflows/pull-request.yml
          grep -Fq "# BEGIN GENERATED PR SOURCE BRANCH OPTIONS" .forgejo/workflows/pull-request.yml
          grep -Fq "# END GENERATED PR SOURCE BRANCH OPTIONS" .forgejo/workflows/pull-request.yml
          if grep -A200 -F "# BEGIN GENERATED PR SOURCE BRANCH OPTIONS" .forgejo/workflows/pull-request.yml \
              | sed -n '1,/END GENERATED PR SOURCE BRANCH OPTIONS/p' \
              | grep -Fxq '          - "main"'; then
            echo "::error::main must not be offered as a PR source branch."
            exit 1
          fi

      - name: Commit refreshed choices
        run: |
          set -euo pipefail
          if git diff --quiet -- .forgejo/workflows/apk.yml .forgejo/workflows/pull-request.yml; then
            echo "Workflow branch dropdowns are already current."
            exit 0
          fi

          git config user.name 'forgejo-actions[bot]'
          git config user.email 'forgejo-actions@localhost'
          git add .forgejo/workflows/apk.yml .forgejo/workflows/pull-request.yml
          git commit -m 'Refresh workflow branch choices [skip ci]'
          git push origin HEAD:main

          summary="${FORGEJO_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-}}"
          if [ -n "$summary" ]; then
            {
              echo "### Workflow branch dropdowns refreshed"
              echo
              echo "The branch choices in Build APK and Pull request now match the repository."
              echo
              echo "Note: this moved main; open PRs may now need a rebase."
            } >> "$summary"
          fi
