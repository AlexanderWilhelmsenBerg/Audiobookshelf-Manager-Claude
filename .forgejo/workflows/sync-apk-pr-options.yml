name: Sync APK PR picker

# Forgejo workflow_dispatch choice lists are static YAML. This workflow regenerates BookWave's APK
# PR choices from Forgejo's current open same-repository pull requests.
#
# Review boundary: this workflow NEVER pushes to main. When choices change it commits only to the
# dedicated mcp/apk-pr-picker branch and opens (or refreshes) a PR to main. A maintainer still merges it.
# The automatic FORGEJO_TOKEN is sufficient for this repository; no long-lived workflow-sync token is used.

on:
  push:
    branches: [main]
    paths:
      - '.forgejo/workflows/sync-apk-pr-options.yml'
      - '.forgejo/scripts/sync_apk_pr_options.py'
  pull_request_target:
    types: [opened, closed, reopened]
  workflow_dispatch:

concurrency:
  group: forgejo-sync-apk-pr-picker
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh open PR choices through review branch
    runs-on: linux-amd64
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install picker prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git jq python3
          rm -rf /var/lib/apt/lists/*

      - name: Read current Forgejo pull requests
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Accept: application/json' \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/pulls?state=open&limit=100&page=1" \
            > "$RUNNER_TEMP/open-prs.json"
          count="$(jq 'length' "$RUNNER_TEMP/open-prs.json")"
          echo "Forgejo returned $count open pull request(s)."
          if [ "$count" -ge 100 ]; then
            echo "::error::Open PR list reached the 100-item safety limit; add pagination before regenerating choices."
            exit 1
          fi

      - name: Regenerate Build APK choices
        run: python3 .forgejo/scripts/sync_apk_pr_options.py "$RUNNER_TEMP/open-prs.json"

      - name: Validate generated workflow contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.forgejo/workflows/apk.yml').read_text(encoding='utf-8')
          required = (
              'name: Build APK',
              '# BEGIN GENERATED OPEN PR OPTIONS',
              '# END GENERATED OPEN PR OPTIONS',
              'FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/pulls/$requested_number',
              'actions/upload-artifact@v3',
              'actions/download-artifact@v3',
          )
          missing = [part for part in required if part not in text]
          if missing:
              raise SystemExit(f'generated Forgejo apk.yml is missing required contract text: {missing}')
          PY

      - name: Publish picker update as review branch and PR
        env:
          PICKER_BRANCH: mcp/apk-pr-picker
        run: |
          set -euo pipefail

          if git diff --quiet -- .forgejo/workflows/apk.yml; then
            echo "APK PR picker is already current; nothing to publish."
            exit 0
          fi

          git config user.name 'forgejo-actions[bot]'
          git config user.email 'forgejo-actions@localhost'
          git switch -C "$PICKER_BRANCH"
          git add .forgejo/workflows/apk.yml
          git commit -m 'Refresh Forgejo APK pull request choices'

          # This branch is generated state and is owned by this workflow. Rebuild it from current main
          # every time so the PR contains only the latest picker delta. Main is never a push target.
          git push --force origin "HEAD:refs/heads/$PICKER_BRANCH"

          open_prs="$(curl -fsS \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Accept: application/json' \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/pulls?state=open&limit=100&page=1")"
          existing="$(jq -r --arg branch "$PICKER_BRANCH" \
            '[.[] | select(.head.ref == $branch) | (.number // .index)] | first // empty' <<<"$open_prs")"

          if [ -n "$existing" ]; then
            echo "Updated existing APK picker PR #$existing via $PICKER_BRANCH."
            exit 0
          fi

          payload="$(jq -n \
            --arg title 'Refresh Forgejo APK pull request choices' \
            --arg head "$PICKER_BRANCH" \
            --arg base 'main' \
            --arg body 'Generated by Forgejo Actions. This PR only refreshes the static Build APK pull-request dropdown; merge remains manual.' \
            '{title:$title, head:$head, base:$base, body:$body}')"

          created="$(curl -fsS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/pulls")"
          number="$(jq -r '.number // .index // empty' <<<"$created")"
          test -n "$number" || { echo "::error::Forgejo did not return a PR number after creating the picker PR."; exit 1; }
          echo "Opened APK picker PR #$number from $PICKER_BRANCH; main remains untouched."
