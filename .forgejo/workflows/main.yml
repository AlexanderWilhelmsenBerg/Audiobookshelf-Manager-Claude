name: Main

# Forgejo-native main-branch release gate. The GitHub workflow remains untouched as fallback.
# pull-request.yml already verifies every push to main, so this workflow avoids repeating
# the same expensive debug gate on push while keeping scheduled/manual runs self-contained.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/workflows/apk.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  # Four workers is the measured sweet spot on the self-hosted Forgejo runner.
  # Keep release/R8 heap headroom while bounding Kotlin independently.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
  JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
  GRADLE_WRAPPER_JAR_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172

jobs:
  release-checks:
    name: Release lint and build
    runs-on: linux-amd64
    container:
      image: forgejo.homebord.org/alexander/bookwave-ci@sha256:bf0f8f06ed41f9dd98b36332b2f1170906d0363c89fdd7c918ce0186844b6b85
    timeout-minutes: 90
    steps:
      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "logical_cpus=$(nproc)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          printf 'cgroup_memory_max='; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
          printf 'cgroup_cpu_max='; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable
          df -h / || true

      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pinned Gradle wrapper
        run: |
          set -euo pipefail

          distribution_url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')"
          distribution_sha="$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)"

          if ! printf '%s' "$distribution_sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::gradle-wrapper.properties must pin distributionSha256Sum."
            exit 1
          fi

          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          if [ "$actual" != "$GRADLE_WRAPPER_JAR_SHA256" ]; then
            echo "::error::Gradle wrapper JAR checksum mismatch."
            echo "distribution=$distribution_url"
            echo "expected=$GRADLE_WRAPPER_JAR_SHA256"
            echo "actual=$actual"
            echo "A wrapper upgrade must update this pinned digest after independent verification."
            exit 1
          fi

          echo "Gradle wrapper JAR verified: $actual"
          echo "Gradle distribution is SHA-pinned: $distribution_sha"

      - name: Compute Gradle cache key
        id: gradle_cache_key
        run: |
          set -euo pipefail
          echo "hash=$(bash scripts/ci/gradle-cache-key.sh)" >> "$FORGEJO_OUTPUT"

      - name: Restore trusted Gradle cache
        id: gradle_cache
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: bookwave-gradle-trusted-v1-${{ steps.gradle_cache_key.outputs.hash }}-${{ forgejo.sha }}
          restore-keys: |
            bookwave-gradle-trusted-v1-${{ steps.gradle_cache_key.outputs.hash }}
            bookwave-gradle-trusted-v1-

      - name: Report Gradle cache restore
        run: |
          echo "gradle_cache_hit=${{ steps.gradle_cache.outputs.cache-hit }}"
          echo "gradle_cache_matched_key=${{ steps.gradle_cache.outputs.cache-matched-key }}"

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: none
          BOOKWAVE_ANDROID_SDK_MODE: preinstalled
        run: |
          set -euo pipefail
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            BOOKWAVE_CODEX_PREWARM="$BOOKWAVE_CODEX_PREWARM" \
            BOOKWAVE_ANDROID_SDK_MODE="$BOOKWAVE_ANDROID_SDK_MODE" \
            bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$FORGEJO_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      # The Forgejo PR gate is intentionally manual. With fast-forward-only merges, a reviewed PR
      # reaches main as the exact accepted commit, so push-main avoids repeating verifyDebug a second time.
      # Scheduled/manual main runs remain standalone health checks and therefore verify debug themselves.
      - name: Verify debug
        if: ${{ forgejo.event_name != 'push' }}
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew verifyDebug --continue --max-workers=4 -Pshelfplayer.warningsAsErrors=true

      - name: Release lint
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew :app:lintRelease --max-workers=4 -Pshelfplayer.warningsAsErrors=true

      - name: Software Bill of Materials
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew :app:sbom --max-workers=4

      - name: Dependency vulnerability scan
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./scripts/vulnerability-scan.sh

      - name: Assemble release (unsigned)
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew :app:assembleRelease --max-workers=4 -Pshelfplayer.warningsAsErrors=true

      # Only the default branch may publish the trusted namespace. A manually dispatched
      # feature branch can restore it, but can never create a cache later consumed by secret-bearing jobs.
      - name: Save trusted Gradle cache
        if: ${{ success() && forgejo.ref == 'refs/heads/main' && steps.gradle_cache.outputs.cache-hit != 'true' }}
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: bookwave-gradle-trusted-v1-${{ steps.gradle_cache_key.outputs.hash }}-${{ forgejo.sha }}

      - name: Upload mapping and SBOM
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: release-supply-chain
          path: |
            app/build/reports/sbom/bom.json
            app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: main-quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
