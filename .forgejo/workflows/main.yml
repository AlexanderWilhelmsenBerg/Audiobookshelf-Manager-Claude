name: Main

# Forgejo-native main-branch gate. The GitHub workflow remains untouched as fallback.
# This preserves the current release checks while using the proven self-hosted runner setup.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/workflows/apk.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  release-checks:
    name: Release lint and build
    runs-on: linux-amd64
    timeout-minutes: 90
    steps:
      - name: Check out BookWave
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper JAR
        run: |
          set -euo pipefail
          distribution_url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')"
          wrapper_version="$(printf '%s\n' "$distribution_url" | sed -E 's#.*gradle-([0-9][0-9A-Za-z.+-]*)-(bin|all)\.zip.*#\1#')"
          if [ -z "$wrapper_version" ] || [ "$wrapper_version" = "$distribution_url" ]; then
            echo "::error::Could not determine Gradle wrapper version from $distribution_url"
            exit 1
          fi
          expected="$(curl -fsSL "https://services.gradle.org/distributions/gradle-${wrapper_version}-wrapper.jar.sha256" | tr -d '[:space:]')"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "::error::Gradle wrapper JAR checksum mismatch"; exit 1; }
          echo "Gradle $wrapper_version wrapper JAR verified: $actual"

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq openjdk-17-jdk-headless python3 unzip
          rm -rf /var/lib/apt/lists/*
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
          BOOKWAVE_DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          bash scripts/codex/setup.sh
          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Verify debug
        run: ./gradlew verifyDebug --max-workers=2 -Pshelfplayer.warningsAsErrors=true

      - name: Release lint
        run: ./gradlew :app:lintRelease --max-workers=2 -Pshelfplayer.warningsAsErrors=true

      - name: Software Bill of Materials
        run: ./gradlew :app:sbom --max-workers=2

      - name: Dependency vulnerability scan
        run: ./scripts/vulnerability-scan.sh

      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease --max-workers=2 -Pshelfplayer.warningsAsErrors=true

      - name: Upload mapping and SBOM
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-supply-chain
          path: |
            app/build/reports/sbom/bom.json
            app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: main-quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
