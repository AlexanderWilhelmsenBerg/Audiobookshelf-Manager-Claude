name: CI · PR verification

run-name: "CI · PR #${{ inputs.pr_number }} — ${{ forgejo.ref_name }}"

# Forgejo-native BookWave pull-request gate.
#
# Keep the repository's GitHub quality contract while adapting execution to the
# self-hosted linux-amd64 Forgejo runner. GitHub workflows remain untouched.
#
# Security model:
# - never expose signing material to pull-request code;
# - do not persist checkout credentials;
# - strip the automatic Forgejo/GitHub token before invoking repository-controlled
#   shell or Gradle code;
# - pin reusable actions and downloaded security tooling immutably.
#
# Reliability model:
# - fail cheap policy/supply-chain/schema checks before Android work;
# - require manually selected heads to contain current main;
# - run exactly one expensive verifyDebug pass;
# - add --rerun-tasks only when the diff can affect the build/classpath (or when explicitly forced),
#   matching docs/risks.md R-31 without verifying the same commit twice.

# Forgejo PR verification is intentionally manual. Branch updates stay cheap while work is
# in progress; run this workflow on the PR branch once the change is ready for acceptance.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Forgejo PR number being verified'
        required: true
        type: string
      force_rerun:
        description: 'Force --rerun-tasks even when the diff does not affect the build/classpath'
        type: boolean
        default: false

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  # A second manual click should queue, not kill an already-expensive Gradle run. This also avoids
  # exercising the runner/container cancellation path unnecessarily.
  cancel-in-progress: false

env:
  # Runner-specific limits. Keep the repository's diagnostics/encoding flags while
  # bounding Gradle and Kotlin memory independently on the self-hosted runner.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
  JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
  GRADLE_WRAPPER_JAR_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  preflight:
    name: "CI · PR #${{ inputs.pr_number }} · Preflight"
    runs-on: linux-amd64
    timeout-minutes: 10
    outputs:
      classpath_changed: ${{ steps.classify.outputs.classpath_changed }}
      checked_head: ${{ steps.classify.outputs.checked_head }}
      status_description: ${{ steps.preflight_summary.outputs.status_description }}
    steps:
      # One full-history checkout serves all cheap prerequisite checks. On the capacity-1 shared runner,
      # separate jobs only repeated container/network/checkout startup without adding isolation: none of
      # these checks receives secrets or privileged credentials.
      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR policy and change classification
        id: classify
        continue-on-error: true
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          SELECTED_BRANCH: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail

          case "$FORGEJO_EVENT_NAME" in
            pull_request)
              base_ref="${FORGEJO_BASE_REF:?FORGEJO_BASE_REF is required for pull_request runs}"
              ;;
            workflow_dispatch)
              base_ref="main"

              requested_pr="$REQUESTED_PR"
              if ! [[ "$requested_pr" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::PR number must be a positive integer: $requested_pr"
                exit 1
              fi

              pr_head="$(git ls-remote "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git" "refs/pull/$requested_pr/head" | awk 'NR == 1 { print $1 }')"
              if [ -z "$pr_head" ]; then
                echo "::error::Forgejo PR #$requested_pr does not expose a readable head ref."
                exit 1
              fi

              checked_out_head="$(git rev-parse HEAD)"
              echo "checked_head=$checked_out_head" >> "$GITHUB_OUTPUT"
              if [ "$pr_head" != "$checked_out_head" ]; then
                echo "::error::PR #$requested_pr does not match the selected branch/ref."
                echo "pr_head=$pr_head"
                echo "checked_out_head=$checked_out_head"
                exit 1
              fi

              echo "Validated PR #$requested_pr -> $SELECTED_BRANCH @ ${checked_out_head:0:8}."
              ;;
            *)
              echo "::error::Unsupported event for PR verification: $FORGEJO_EVENT_NAME"
              exit 1
              ;;
          esac

          base="origin/$base_ref"
          git rev-parse --verify "$base^{commit}" >/dev/null

          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "::error::Checked-out head does not contain current $base_ref. Rebase/update it before acceptance."
            echo "base=$(git rev-parse "$base")"
            echo "head=$(git rev-parse HEAD)"
            exit 1
          fi

          changed_files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$changed_files"

          classpath_changed=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .forgejo/workflows/*|\
              build.gradle.kts|\
              settings.gradle.kts|\
              gradle.properties|\
              gradle/libs.versions.toml|\
              gradle/verification-metadata.xml|\
              gradle/wrapper/*|\
              build-logic/*|\
              buildSrc/*|\
              scripts/codex/*|\
              */build.gradle.kts|\
              */gradle.lockfile|\
              gradle.lockfile)
                classpath_changed=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$FORGEJO_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.force_rerun }}" = "true" ]; then
            classpath_changed=true
            echo "Full rerun forced by workflow input."
          fi

          echo "classpath_changed=$classpath_changed" >> "$GITHUB_OUTPUT"
          echo "verification_mode=$([ "$classpath_changed" = true ] && echo rerun || echo normal)"

      - name: Gradle wrapper validation
        id: wrapper_check
        continue-on-error: true
        run: |
          set -euo pipefail

          distribution_url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')"
          distribution_sha="$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)"

          if ! printf '%s' "$distribution_sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::gradle-wrapper.properties must pin distributionSha256Sum."
            exit 1
          fi

          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          if [ "$actual" != "$GRADLE_WRAPPER_JAR_SHA256" ]; then
            echo "::error::Gradle wrapper JAR checksum mismatch."
            echo "distribution=$distribution_url"
            echo "expected=$GRADLE_WRAPPER_JAR_SHA256"
            echo "actual=$actual"
            echo "A wrapper upgrade must update this pinned digest in the PR workflow after independent verification."
            exit 1
          fi

          echo "Gradle wrapper JAR verified: $actual"
          echo "Gradle distribution is SHA-pinned: $distribution_sha"

      - name: Secret scan
        id: secret_scan
        continue-on-error: true
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="$tmp/gitleaks.tar.gz"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"

          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN gitleaks detect --source . --redact --verbose --no-banner

      - name: Committed Room schemas are immutable
        id: schema_check
        continue-on-error: true
        run: |
          set -euo pipefail
          base_ref="${FORGEJO_BASE_REF:-main}"
          base="origin/$base_ref"
          git rev-parse --verify "$base^{commit}" >/dev/null

          modified="$(git diff --diff-filter=MD --name-only "$base"...HEAD -- core/database/schemas)"
          if [ -n "$modified" ]; then
            echo "::error::A committed Room schema was modified or deleted. Bump the database version instead."
            echo "$modified"
            echo
            echo "A schema that has been built into an APK is a fact about somebody's phone. Room compares its"
            echo "identity hash on open, so changing one crashes the app at startup on every device that ran"
            echo "the previous build. Add a new version and a migration; never edit an existing file."
            git diff "$base"...HEAD -- core/database/schemas
            exit 1
          fi
          echo "No committed Room schema was modified."

      - name: Summarize preflight
        id: preflight_summary
        if: ${{ always() }}
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          POLICY_OUTCOME: ${{ steps.classify.outcome }}
          WRAPPER_OUTCOME: ${{ steps.wrapper_check.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
        run: |
          set -euo pipefail
          summary="${FORGEJO_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-}}"
          failed=()

          render() {
            local name="$1"
            local outcome="$2"
            local icon="✅"
            if [ "$outcome" != "success" ]; then
              icon="❌"
              failed+=("$name")
            fi
            printf '| %s | %s %s |\n' "$name" "$icon" "$outcome"
          }

          {
            echo "## CI · PR #$REQUESTED_PR · Preflight"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            render "PR / branch policy" "$POLICY_OUTCOME"
            render "Gradle wrapper integrity" "$WRAPPER_OUTCOME"
            render "Secret scan" "$SECRET_SCAN_OUTCOME"
            render "Committed Room schemas" "$SCHEMA_OUTCOME"
            echo
          } > /tmp/bookwave-preflight-summary.md

          cat /tmp/bookwave-preflight-summary.md
          if [ -n "$summary" ]; then
            cat /tmp/bookwave-preflight-summary.md >> "$summary"
          fi

          if [ "${#failed[@]}" -eq 0 ]; then
            description="BookWave preflight passed"
          else
            joined="$(IFS=', '; echo "${failed[*]}")"
            description="Preflight failed: $joined"
          fi
          echo "status_description=${description:0:220}" >> "$GITHUB_OUTPUT"

      - name: Require every preflight check to pass
        if: ${{ always() }}
        env:
          POLICY_OUTCOME: ${{ steps.classify.outcome }}
          WRAPPER_OUTCOME: ${{ steps.wrapper_check.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "PR policy/change classification:$POLICY_OUTCOME" \
            "Gradle wrapper validation:$WRAPPER_OUTCOME" \
            "Secret scan:$SECRET_SCAN_OUTCOME" \
            "Room schema immutability:$SCHEMA_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::Preflight check failed: $name ($outcome)"
              failed=1
            fi
          done
          exit "$failed"

  verify:
    name: "CI · PR #${{ inputs.pr_number }} · verification"
    runs-on: linux-amd64
    container:
      image: forgejo.homebord.org/alexander/bookwave-ci@sha256:bf0f8f06ed41f9dd98b36332b2f1170906d0363c89fdd7c918ce0186844b6b85
    needs: preflight
    timeout-minutes: 90
    outputs:
      status_description: ${{ steps.diagnostics.outputs.status_description }}
    steps:
      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "logical_cpus=$(nproc)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          printf 'cgroup_memory_max='; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
          printf 'cgroup_cpu_max='; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable
          df -h / || true

      - name: Check out validated PR HEAD
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.checked_head }}
          persist-credentials: false

      - name: Compute Gradle cache key
        id: gradle_cache_key
        run: |
          set -euo pipefail
          echo "hash=$(bash scripts/ci/gradle-cache-key.sh)" >> "$FORGEJO_OUTPUT"

      - name: Restore trusted Gradle cache
        id: gradle_cache
        continue-on-error: true
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: bookwave-gradle-trusted-v1-${{ steps.gradle_cache_key.outputs.hash }}
          restore-keys: |
            bookwave-gradle-trusted-v1-

      - name: Report Gradle cache restore
        if: ${{ always() }}
        run: |
          echo "gradle_cache_step=${{ steps.gradle_cache.outcome }}"
          echo "gradle_cache_hit=${{ steps.gradle_cache.outputs.cache-hit }}"
          echo "gradle_cache_matched_key=${{ steps.gradle_cache.outputs.cache-matched-key }}"

      - name: Prepare BookWave Android environment
        id: setup
        env:
          BOOKWAVE_CODEX_PREWARM: none
          BOOKWAVE_ANDROID_SDK_MODE: preinstalled
        run: |
          set -euo pipefail
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            BOOKWAVE_CODEX_PREWARM="$BOOKWAVE_CODEX_PREWARM" \
            BOOKWAVE_ANDROID_SDK_MODE="$BOOKWAVE_ANDROID_SDK_MODE" \
            bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$FORGEJO_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Verify debug once and capture full log
        id: verify_debug
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        env:
          CLASSPATH_CHANGED: ${{ needs.preflight.outputs.classpath_changed }}
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          extra_args=()
          if [ "$CLASSPATH_CHANGED" = "true" ]; then
            extra_args+=(--rerun-tasks)
            echo "Verification mode: full rerun (R-31 classpath/build safety)."
          else
            echo "Verification mode: normal."
          fi

          set +e
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            ./gradlew verifyDebug --continue "${extra_args[@]}" --max-workers=4 \
              -Pshelfplayer.warningsAsErrors=true 2>&1 \
            | tee ci-diagnostics/gradle-verify.log
          status="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Room schema is committed and current
        id: schema_check
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            exit 1
          fi
          echo "Room schemas are committed and current."

      - name: Resolve dependencies for the debug variant
        id: dependencies
        if: ${{ always() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          set +e
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            ./gradlew :app:dependencies --configuration debugRuntimeClasspath --max-workers=4 \
              > dependency-report.txt 2> ci-diagnostics/dependency-resolution.log
          status="$?"
          set -e
          if [ -s ci-diagnostics/dependency-resolution.log ]; then
            cat ci-diagnostics/dependency-resolution.log
          fi
          exit "$status"

      - name: Check debug APK output
        id: apk_check
        if: ${{ always() }}
        continue-on-error: true
        env:
          VERIFY_OUTCOME: ${{ steps.verify_debug.outcome }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -gt 0 ]; then
            printf 'Debug APK: %s\n' "${apks[@]}"
            exit 0
          fi

          if [ "$VERIFY_OUTCOME" = "success" ]; then
            echo "::error::verifyDebug passed but no debug APK was produced."
            exit 1
          fi

          echo "No debug APK produced because verification did not complete successfully; not counted as a separate failure."

      - name: Build consolidated diagnostics
        id: diagnostics
        if: ${{ always() }}
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_debug.outcome }}
          VERIFY_EXIT: ${{ steps.verify_debug.outputs.exit_code }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          APK_OUTCOME: ${{ steps.apk_check.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          python3 scripts/ci/pr-diagnostics.py

          summary="${FORGEJO_STEP_SUMMARY:-${GITHUB_STEP_SUMMARY:-}}"
          if [ -n "$summary" ]; then
            cat ci-diagnostics/summary.md >> "$summary"
          fi

      - name: Upload CI diagnostics
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: ci-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload dependency report
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: dependency-report
          path: dependency-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Room schemas
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: room-schemas
          path: core/database/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload quality reports
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: quality-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.txt
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK when available
        if: ${{ always() }}
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Final verification gate
        if: ${{ always() }}
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_debug.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_check.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          APK_OUTCOME: ${{ steps.apk_check.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "Android environment:$SETUP_OUTCOME" \
            "verifyDebug:$VERIFY_OUTCOME" \
            "Room schema:$SCHEMA_OUTCOME" \
            "Dependency resolution:$DEPENDENCY_OUTCOME" \
            "Debug APK:$APK_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name failed or was skipped ($outcome). See the consolidated diagnostics above."
              failed=1
            fi
          done
          exit "$failed"

  pr-status:
    name: "CI · PR #${{ inputs.pr_number }} · publish check"
    runs-on: linux-amd64
    needs:
      - preflight
      - verify
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Publish PR verification status
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          SELECTED_BRANCH: ${{ forgejo.ref_name }}
          CHECKED_HEAD: ${{ needs.preflight.outputs.checked_head }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PREFLIGHT_DESCRIPTION: ${{ needs.preflight.outputs.status_description }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_DESCRIPTION: ${{ needs.verify.outputs.status_description }}
        run: |
          set -euo pipefail

          if ! [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Cannot publish a PR status for invalid PR number: $REQUESTED_PR"
            exit 1
          fi

          pr_json="$(curl -fsS \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Accept: application/json' \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/pulls/$REQUESTED_PR")"

          pr_values="$(printf '%s' "$pr_json" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const pr = JSON.parse(raw);
              process.stdout.write((pr.head?.sha || "") + "\t" + (pr.head?.ref || ""));
            });
          ')"
          IFS=$'\t' read -r pr_head pr_branch <<<"$pr_values"

          if [ -z "$pr_head" ] || [ -z "$pr_branch" ]; then
            echo "::error::Forgejo did not return a usable head for PR #$REQUESTED_PR."
            exit 1
          fi

          state=failure
          status_sha="$pr_head"
          description="BookWave PR verification failed"

          if [ "$SELECTED_BRANCH" != "$pr_branch" ]; then
            description="Selected branch does not match PR #$REQUESTED_PR"
          elif [ -n "$CHECKED_HEAD" ] && [ "$CHECKED_HEAD" != "$pr_head" ]; then
            status_sha="$CHECKED_HEAD"
            description="PR head changed during verification; rerun checks"
          elif [ "$PREFLIGHT_RESULT" != "success" ]; then
            description="${PREFLIGHT_DESCRIPTION:-BookWave preflight failed}"
          elif [ "$VERIFY_RESULT" != "success" ]; then
            description="${VERIFY_DESCRIPTION:-BookWave verification failed}"
          else
            status_sha="$CHECKED_HEAD"
            state=success
            description="BookWave PR verification passed"
          fi

          description="${description:0:220}"
          payload="$(STATUS_STATE="$state" STATUS_DESCRIPTION="$description" node -e '
            process.stdout.write(JSON.stringify({
              state: process.env.STATUS_STATE,
              context: "BookWave / PR verification",
              description: process.env.STATUS_DESCRIPTION
            }));
          ')"

          curl -fsS \
            -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/statuses/$status_sha"

          echo "Published $state status for PR #$REQUESTED_PR at $status_sha: $description"
