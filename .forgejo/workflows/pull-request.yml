name: Pull request

# Forgejo-native BookWave pull-request gate.
#
# Keep the repository's GitHub quality contract while adapting execution to the
# self-hosted linux-amd64 Forgejo runner. GitHub workflows remain untouched.
#
# Security model:
# - never expose signing material to pull-request code;
# - do not persist checkout credentials;
# - strip the automatic Forgejo/GitHub token before invoking repository-controlled
#   shell or Gradle code;
# - pin reusable actions and downloaded security tooling immutably.
#
# Reliability model:
# - fail cheap policy/supply-chain checks before Android work;
# - require PR heads to contain current main;
# - run the expensive --rerun-tasks acceptance only when the PR can affect the
#   build/classpath, matching docs/risks.md R-31 rather than rerunning every PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  # Runner-specific limits. Keep the repository's diagnostics/encoding flags while
  # bounding Gradle and Kotlin memory independently on the self-hosted runner.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
  JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
  GRADLE_WRAPPER_JAR_SHA256: 7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  policy:
    name: PR policy and change classification
    runs-on: linux-amd64
    timeout-minutes: 10
    outputs:
      classpath_changed: ${{ steps.classify.outputs.classpath_changed }}
    steps:
      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require current main and classify changes
        id: classify
        run: |
          set -euo pipefail

          classpath_changed=false

          if [ "$FORGEJO_EVENT_NAME" = "pull_request" ]; then
            base_ref="${FORGEJO_BASE_REF:?FORGEJO_BASE_REF is required for pull_request runs}"
            base="origin/$base_ref"

            git rev-parse --verify "$base^{commit}" >/dev/null

            if ! git merge-base --is-ancestor "$base" HEAD; then
              echo "::error::PR head does not contain current $base_ref. Rebase or update the branch before merge."
              echo "base=$(git rev-parse "$base")"
              echo "head=$(git rev-parse HEAD)"
              exit 1
            fi

            changed_files="$(git diff --name-only "$base"...HEAD)"
            printf '%s\n' "$changed_files"

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                .forgejo/workflows/*|\
                build.gradle.kts|\
                settings.gradle.kts|\
                gradle.properties|\
                gradle/libs.versions.toml|\
                gradle/verification-metadata.xml|\
                gradle/wrapper/*|\
                build-logic/*|\
                buildSrc/*|\
                scripts/codex/*|\
                */build.gradle.kts|\
                */gradle.lockfile|\
                gradle.lockfile)
                  classpath_changed=true
                  ;;
              esac
            done <<< "$changed_files"
          elif [ "$FORGEJO_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs are explicit acceptance runs; make them exercise the
            # strongest path regardless of the currently checked-out diff.
            classpath_changed=true
          fi

          echo "classpath_changed=$classpath_changed" >> "$GITHUB_OUTPUT"
          echo "classpath_changed=$classpath_changed"

  wrapper_validation:
    name: Gradle wrapper validation
    runs-on: linux-amd64
    timeout-minutes: 10
    steps:
      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Validate pinned Gradle wrapper
        run: |
          set -euo pipefail

          distribution_url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')"
          distribution_sha="$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2-)"

          if ! printf '%s' "$distribution_sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::gradle-wrapper.properties must pin distributionSha256Sum."
            exit 1
          fi

          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          if [ "$actual" != "$GRADLE_WRAPPER_JAR_SHA256" ]; then
            echo "::error::Gradle wrapper JAR checksum mismatch."
            echo "distribution=$distribution_url"
            echo "expected=$GRADLE_WRAPPER_JAR_SHA256"
            echo "actual=$actual"
            echo "A wrapper upgrade must update this pinned digest in the PR workflow after independent verification."
            exit 1
          fi

          echo "Gradle wrapper JAR verified: $actual"
          echo "Gradle distribution is SHA-pinned: $distribution_sha"

  secret_scan:
    name: Secret scan
    runs-on: linux-amd64
    timeout-minutes: 10
    steps:
      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="$tmp/gitleaks.tar.gz"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"

          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree and history
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN gitleaks detect --source . --redact --verbose --no-banner

  schema_immutability:
    name: Committed Room schemas are immutable
    if: ${{ forgejo.event_name == 'pull_request' }}
    runs-on: linux-amd64
    timeout-minutes: 10
    steps:
      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No committed schema may be modified
        run: |
          set -euo pipefail
          base="origin/${FORGEJO_BASE_REF:?FORGEJO_BASE_REF is required}"
          git rev-parse --verify "$base^{commit}" >/dev/null

          modified="$(git diff --diff-filter=MD --name-only "$base"...HEAD -- core/database/schemas)"
          if [ -n "$modified" ]; then
            echo "::error::A committed Room schema was modified or deleted. Bump the database version instead."
            echo "$modified"
            echo
            echo "A schema that has been built into an APK is a fact about somebody's phone. Room compares its"
            echo "identity hash on open, so changing one crashes the app at startup on every device that ran"
            echo "the previous build. Add a new version and a migration; never edit an existing file."
            git diff "$base"...HEAD -- core/database/schemas
            exit 1
          fi
          echo "No committed Room schema was modified."

  verify:
    name: verifyDebug
    runs-on: linux-amd64
    needs: [policy, wrapper_validation, secret_scan]
    timeout-minutes: 90
    steps:
      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "logical_cpus=$(nproc)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          printf 'cgroup_memory_max='; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
          printf 'cgroup_cpu_max='; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable
          df -h / || true

      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            openjdk-17-jdk-headless \
            python3 \
            unzip
          rm -rf /var/lib/apt/lists/*

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"
          java -version

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            BOOKWAVE_CODEX_PREWARM="$BOOKWAVE_CODEX_PREWARM" \
            BOOKWAVE_ANDROID_SDK_ROOT="$BOOKWAVE_ANDROID_SDK_ROOT" \
            bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Verify debug
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew verifyDebug --continue --max-workers=1 -Pshelfplayer.warningsAsErrors=true

      - name: Print lint reports
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            found=1
            echo "===== $report ====="
            cat "$report"
          done < <(find . -path '*/build/reports/lint-results-*.txt' -print)
          [ "$found" -eq 1 ] || echo "No lint text reports were produced."

      - name: Room schema is committed and current
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            echo "--- exported schema ---"
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload Room schemas
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: room-schemas
          path: core/database/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint and detekt reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  dependency_report:
    name: Dependency and licence report
    runs-on: linux-amd64
    needs: [policy, wrapper_validation, secret_scan]
    timeout-minutes: 45
    steps:
      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            openjdk-17-jdk-headless \
            python3 \
            unzip
          rm -rf /var/lib/apt/lists/*

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            BOOKWAVE_CODEX_PREWARM="$BOOKWAVE_CODEX_PREWARM" \
            BOOKWAVE_ANDROID_SDK_ROOT="$BOOKWAVE_ANDROID_SDK_ROOT" \
            bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Resolve dependencies for the debug variant
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew :app:dependencies --configuration debugRuntimeClasspath --max-workers=1 > dependency-report.txt

      - name: Upload dependency report
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 7

  classpath_rerun_acceptance:
    name: Classpath rerun acceptance
    if: ${{ (forgejo.event_name == 'pull_request' || forgejo.event_name == 'workflow_dispatch') && needs.policy.outputs.classpath_changed == 'true' }}
    runs-on: linux-amd64
    needs: [policy, wrapper_validation, secret_scan]
    timeout-minutes: 90
    steps:
      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "logical_cpus=$(nproc)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          printf 'cgroup_memory_max='; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
          printf 'cgroup_cpu_max='; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable
          df -h / || true

      - name: Check out BookWave
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            openjdk-17-jdk-headless \
            python3 \
            unzip
          rm -rf /var/lib/apt/lists/*

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          env -u FORGEJO_TOKEN -u GITHUB_TOKEN \
            BOOKWAVE_CODEX_PREWARM="$BOOKWAVE_CODEX_PREWARM" \
            BOOKWAVE_ANDROID_SDK_ROOT="$BOOKWAVE_ANDROID_SDK_ROOT" \
            bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Rerun full BookWave gate
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN ./gradlew verifyDebug --continue --rerun-tasks --max-workers=1 -Pshelfplayer.warningsAsErrors=true
