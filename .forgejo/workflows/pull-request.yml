name: Pull request

# Forgejo-native BookWave pull-request gate.
#
# Keep the GitHub quality contract and job boundaries intact while adapting execution
# to the self-hosted linux-amd64 Forgejo runner. GitHub workflows remain untouched.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  # The self-hosted runner shares its host with other homelab workloads. Keep the
  # original 5 GiB heap limit and bound worker parallelism for predictable execution.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: linux-amd64
    steps:
      - name: Check out BookWave
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper JAR
        run: |
          set -euo pipefail
          distribution_url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')"
          wrapper_version="$(printf '%s\n' "$distribution_url" | sed -E 's#.*gradle-([0-9][0-9A-Za-z.+-]*)-(bin|all)\.zip.*#\1#')"
          if [ -z "$wrapper_version" ] || [ "$wrapper_version" = "$distribution_url" ]; then
            echo "::error::Could not determine Gradle wrapper version from $distribution_url"
            exit 1
          fi
          expected="$(curl -fsSL "https://services.gradle.org/distributions/gradle-${wrapper_version}-wrapper.jar.sha256" | tr -d '[:space:]')"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Gradle wrapper JAR checksum mismatch for Gradle $wrapper_version"
            echo "expected=$expected"
            echo "actual=$actual"
            exit 1
          fi
          echo "Gradle $wrapper_version wrapper JAR verified: $actual"

  secret-scan:
    name: Secret scan
    runs-on: linux-amd64
    steps:
      - name: Check out BookWave
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.0
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree and history
        run: gitleaks detect --source . --redact --verbose --no-banner

  schema-immutability:
    name: Committed Room schemas are immutable
    if: ${{ forgejo.event_name == 'pull_request' }}
    runs-on: linux-amd64
    steps:
      - name: Check out BookWave
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: No committed schema may be modified
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FORGEJO_BASE_REF"
          base="origin/$FORGEJO_BASE_REF"
          modified="$(git diff --diff-filter=MD --name-only "$base"...HEAD -- core/database/schemas)"
          if [ -n "$modified" ]; then
            echo "::error::A committed Room schema was modified or deleted. Bump the database version instead."
            echo "$modified"
            echo
            echo "A schema that has been built into an APK is a fact about somebody's phone. Room compares its"
            echo "identity hash on open, so changing one crashes the app at startup on every device that ran"
            echo "the previous build. Add a new version and a migration; never edit an existing file."
            git diff "$base"...HEAD -- core/database/schemas
            exit 1
          fi
          echo "No committed Room schema was modified."

  verify:
    name: verifyDebug
    runs-on: linux-amd64
    needs: [wrapper-validation]
    timeout-minutes: 90
    steps:
      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "logical_cpus=$(nproc)"
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo || true
          printf 'cgroup_memory_max='; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
          printf 'cgroup_cpu_max='; cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable
          df -h / || true

      - name: Check out BookWave
        uses: actions/checkout@v6

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            openjdk-17-jdk-headless \
            python3 \
            unzip
          rm -rf /var/lib/apt/lists/*

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"
          java -version

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
          BOOKWAVE_DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Verify debug
        run: ./gradlew verifyDebug --continue --max-workers=2 -Pshelfplayer.warningsAsErrors=true

      - name: Print lint reports
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            found=1
            echo "===== $report ====="
            cat "$report"
          done < <(find . -path '*/build/reports/lint-results-*.txt' -print)
          [ "$found" -eq 1 ] || echo "No lint text reports were produced."

      - name: Room schema is committed and current
        run: |
          changes="$(git status --porcelain -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room exported a schema that is not committed, or differs from the committed one."
            echo "$changes"
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            echo "--- exported schema ---"
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: room-schemas
          path: core/database/schemas/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload lint and detekt reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  dependency-report:
    name: Dependency and licence report
    runs-on: linux-amd64
    needs: [wrapper-validation]
    timeout-minutes: 45
    steps:
      - name: Check out BookWave
        uses: actions/checkout@v6

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            openjdk-17-jdk-headless \
            python3 \
            unzip
          rm -rf /var/lib/apt/lists/*

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
          BOOKWAVE_DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Resolve dependencies for the debug variant
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --max-workers=2 > dependency-report.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 7

  classpath-rerun-acceptance:
    name: Classpath rerun acceptance
    if: ${{ forgejo.event_name == 'pull_request' || forgejo.event_name == 'workflow_dispatch' }}
    runs-on: linux-amd64
    timeout-minutes: 90
    steps:
      - name: Check out BookWave
        uses: actions/checkout@v6

      - name: Install runner prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            openjdk-17-jdk-headless \
            python3 \
            unzip
          rm -rf /var/lib/apt/lists/*

          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$FORGEJO_ENV"
          echo "$JAVA_HOME/bin" >> "$FORGEJO_PATH"

      - name: Prepare BookWave Android environment
        env:
          BOOKWAVE_CODEX_PREWARM: light
          BOOKWAVE_DEBUG_KEYSTORE_BASE64: ${{ secrets.BOOKWAVE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export BOOKWAVE_ANDROID_SDK_ROOT="$HOME/.bookwave/android-sdk"
          bash scripts/codex/setup.sh

          echo "ANDROID_HOME=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.bookwave/android-sdk" >> "$FORGEJO_ENV"
          echo "$HOME/.bookwave/android-sdk/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$HOME/.bookwave/android-sdk/platform-tools" >> "$FORGEJO_PATH"
          echo "$HOME/.local/bin" >> "$FORGEJO_PATH"

      - name: Rerun ktlint gate
        run: ./gradlew ktlintCheck --rerun-tasks --max-workers=2

      - name: Rerun full BookWave gate
        run: ./gradlew verifyDebug --continue --rerun-tasks --max-workers=2 -Pshelfplayer.warningsAsErrors=true
