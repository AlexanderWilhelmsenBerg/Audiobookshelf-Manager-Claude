syntax = "proto3";

package shelfplayer.settings;

option java_package = "com.example.shelfplayer.core.datastore";
option java_multiple_files = true;

// PRODUCT_SPEC SET-001 / SET-002 — global application settings.
//
// Only non-sensitive values belong here. Tokens and passwords are stored by the Keystore-backed
// secret store added in Phase 1 (PRODUCT_SPEC AUTH-003, SET-001).
//
// Field numbers are never reused. Removing a field means reserving its number, so that a device
// upgrading from an older build cannot reinterpret old bytes as a new meaning.
message AppSettings {
  // Bumped whenever a field's *meaning* changes, so a settings migration can be written and tested
  // (PRODUCT_SPEC SET-001). Adding a new field with a safe default does not need a bump.
  int32 schema_version = 1;

  // PRODUCT_SPEC AUTH-002 — survives app restart. Empty means "no profile selected yet".
  string active_profile_id = 2;

  ThemeMode theme_mode = 3;

  // PRODUCT_SPEC SET-002 — Material You. Off by default so the app looks the same on every device
  // until the user opts in.
  bool dynamic_color = 4;

  // PRODUCT_SPEC SET-002 (Privacy/diagnostics). Both default to false and must stay that way.
  bool diagnostics_include_server_host = 5;
  bool diagnostics_include_media_titles = 6;

  // PRODUCT_SPEC 20, Phase 0 — set once the bundled demo library has been written to Room, so the
  // seed runs on first launch only and a user who deletes demo content does not get it back.
  bool fixture_library_seeded = 7;

  // Field 8 held `home_shows_libraries`, a toggle that swapped the home screen for a list of libraries.
  // It is gone: the app always opens on the books, and browsing by library is an entry in Settings rather
  // than a mode the home screen can be in. A setting that changes what a screen *is* costs a user a trip
  // to Settings and back to find out what it does.
  //
  // Reserved, not reused. A device upgrading from a build that wrote this field still has the bytes on
  // disk, and a new field with number 8 would read them as its own.
  reserved 8;
  reserved "home_shows_libraries";

  // PRODUCT_SPEC SET-001 / AUTH-002 — preferences that belong to one account, keyed by profile id.
  //
  // Per profile rather than global because two accounts on one server are two different people's
  // shelves: PRODUCT_SPEC 5.2 keeps their content apart, and a sort order or a default library that
  // followed the device rather than the account would leak one person's arrangement onto another's
  // screen. Removing a profile removes its entry.
  map<string, ProfileSettings> profile_settings = 9;

  // PRODUCT_SPEC PLAY-001 / 14.5 — the identifier this install sends as `deviceInfo.deviceId` when it
  // opens a playback session.
  //
  // A random UUID generated on first use, not a hardware or advertising identifier: the server uses it
  // to group a device's listening sessions, which a random value does exactly as well, and an
  // ANDROID_ID or an IMEI would hand a self-hosted server a cross-app identifier it has no use for.
  //
  // It is stored rather than regenerated per process so that a restart does not appear on the user's
  // own server as a new device every time.
  string playback_device_id = 10;

  // PRODUCT_SPEC SET-002 (Playback) / PLAY-008 — the sleep timer's defaults.
  //
  // Device-wide rather than per profile, unlike everything in `ProfileSettings`. A sleep timer is a
  // property of how someone uses their phone at night; it does not belong to whichever account is
  // signed in, and putting it per profile would silently reset it on a profile switch.
  //
  // All three are zero-by-default, and zero means "not chosen" rather than "zero minutes" — the
  // reader substitutes `SleepTimerSettings.Default`. That is what lets a default change in a later
  // build reach a user who never opened the setting.
  int32 sleep_timer_default_minutes = 11;
  int32 sleep_timer_fade_seconds = 12;

  // PRODUCT_SPEC PLAY-008 — "requires explicit opt-in". `false` by default, which proto3 gives free.
  bool sleep_timer_shake_to_restart = 13;

  // PRODUCT_SPEC PLAY-006 / PLAY-007 / PLAY-009 — the playback controls.
  //
  // Device-wide rather than per profile, for the same reason the sleep timer is: how fast somebody
  // listens and how far a skip jumps are properties of the person holding the phone, not of whichever
  // account is signed in. A profile switch that silently reset the speed to 1.0x would be a bug the user
  // could not explain.
  //
  // Zero means "not chosen" throughout, and the reader substitutes the model's default. That is what lets
  // a default change in a later build reach a user who never opened the setting — and it is why the speed
  // is stored in hundredths as an int rather than as a float, where 0.0 and "unset" would be the same
  // bits and a rounding error could persist forever.
  int32 default_speed_hundredths = 14;
  int32 skip_back_seconds = 15;
  int32 skip_forward_seconds = 16;

  // PRODUCT_SPEC PLAY-009 — "disabled by default". The four amounts are still stored while disabled, so
  // turning it back on restores what the user chose rather than the factory bands.
  bool auto_rewind_enabled = 17;
  int32 auto_rewind_short_seconds = 18;
  int32 auto_rewind_medium_seconds = 19;
  int32 auto_rewind_long_seconds = 20;
  int32 auto_rewind_very_long_seconds = 21;

  // A `BufferPreset` name rather than an enum defined here, for the reason `library_sort_order` gives: an
  // enum would have to be kept in step across a module boundary and a renumbered constant reads back as a
  // different preset, silently. A name that no longer resolves falls back to Automatic.
  string buffer_preset = 22;

  // PRODUCT_SPEC PLAY-009 — the four amounts are meaningless without knowing whether the user has ever
  // touched them. Proto3 cannot distinguish "stored 0" from "never written" for an int, and 0 seconds is
  // a legitimate choice for the short bucket, so this flag carries what the zeros cannot.
  bool auto_rewind_configured = 23;
}

// PRODUCT_SPEC SET-001 — one account's view preferences.
//
// Nothing here is a credential or an identifier of the user. It is how they last left a screen.
message ProfileSettings {
  // PRODUCT_SPEC 6.1 step 9 — the library this profile opens on. Empty means no choice has been made,
  // which is not the same as a choice of "all": the home shelf spans every granted library by default,
  // and this narrows it only once the user picks one.
  string default_library_id = 1;

  // PRODUCT_SPEC LIB-002 — sort order per library, keyed by library id.
  //
  // The value is a `BookSortOrder` name rather than an enum defined here, deliberately. An enum would
  // have to be kept in step with the domain type across a module boundary, and the failure mode of
  // getting that wrong is silent: a renumbered constant reads back as a different order. A name that
  // no longer resolves falls back to the default instead, which is visible and harmless.
  map<string, string> library_sort_order = 2;

  // The order used on the home shelf, which spans libraries and so has no library id to key on.
  string shelf_sort_order = 3;
}

enum ThemeMode {
  THEME_MODE_UNSPECIFIED = 0;
  THEME_MODE_SYSTEM = 1;
  THEME_MODE_LIGHT = 2;
  THEME_MODE_DARK = 3;
}
