syntax = "proto3";

package shelfplayer.settings;

option java_package = "com.example.shelfplayer.core.datastore";
option java_multiple_files = true;

// PRODUCT_SPEC SET-001 / SET-002 — global application settings.
//
// Only non-sensitive values belong here. Tokens and passwords are stored by the Keystore-backed
// secret store added in Phase 1 (PRODUCT_SPEC AUTH-003, SET-001).
//
// Field numbers are never reused. Removing a field means reserving its number, so that a device
// upgrading from an older build cannot reinterpret old bytes as a new meaning.
message AppSettings {
  // Bumped whenever a field's *meaning* changes, so a settings migration can be written and tested
  // (PRODUCT_SPEC SET-001). Adding a new field with a safe default does not need a bump.
  int32 schema_version = 1;

  // PRODUCT_SPEC AUTH-002 — survives app restart. Empty means "no profile selected yet".
  string active_profile_id = 2;

  ThemeMode theme_mode = 3;

  // PRODUCT_SPEC SET-002 — Material You. Off by default so the app looks the same on every device
  // until the user opts in.
  bool dynamic_color = 4;

  // PRODUCT_SPEC SET-002 (Privacy/diagnostics). Both default to false and must stay that way.
  bool diagnostics_include_server_host = 5;
  bool diagnostics_include_media_titles = 6;

  // PRODUCT_SPEC 20, Phase 0 — set once the bundled demo library has been written to Room, so the
  // seed runs on first launch only and a user who deletes demo content does not get it back.
  bool fixture_library_seeded = 7;

  // Field 8 held `home_shows_libraries`, a toggle that swapped the home screen for a list of libraries.
  // It is gone: the app always opens on the books, and browsing by library is an entry in Settings rather
  // than a mode the home screen can be in. A setting that changes what a screen *is* costs a user a trip
  // to Settings and back to find out what it does.
  //
  // Reserved, not reused. A device upgrading from a build that wrote this field still has the bytes on
  // disk, and a new field with number 8 would read them as its own.
  reserved 8;
  reserved "home_shows_libraries";

  // PRODUCT_SPEC SET-001 / AUTH-002 — preferences that belong to one account, keyed by profile id.
  //
  // Per profile rather than global because two accounts on one server are two different people's
  // shelves: PRODUCT_SPEC 5.2 keeps their content apart, and a sort order or a default library that
  // followed the device rather than the account would leak one person's arrangement onto another's
  // screen. Removing a profile removes its entry.
  map<string, ProfileSettings> profile_settings = 9;

  // PRODUCT_SPEC PLAY-001 / 14.5 — the identifier this install sends as `deviceInfo.deviceId` when it
  // opens a playback session.
  //
  // A random UUID generated on first use, not a hardware or advertising identifier: the server uses it
  // to group a device's listening sessions, which a random value does exactly as well, and an
  // ANDROID_ID or an IMEI would hand a self-hosted server a cross-app identifier it has no use for.
  //
  // It is stored rather than regenerated per process so that a restart does not appear on the user's
  // own server as a new device every time.
  string playback_device_id = 10;

  // PRODUCT_SPEC SET-002 (Playback) / PLAY-008 — the sleep timer's defaults.
  //
  // Device-wide rather than per profile, unlike everything in `ProfileSettings`. A sleep timer is a
  // property of how someone uses their phone at night; it does not belong to whichever account is
  // signed in, and putting it per profile would silently reset it on a profile switch.
  //
  // All three are zero-by-default, and zero means "not chosen" rather than "zero minutes" — the
  // reader substitutes `SleepTimerSettings.Default`. That is what lets a default change in a later
  // build reach a user who never opened the setting.
  int32 sleep_timer_default_minutes = 11;
  // Seconds, 5–30 (PLAY-008). Zero is "never chosen" and reads back as the product default; **-1 is off**,
  // which the requirement's word *optional* asks for and which zero cannot express because zero is already
  // taken. One field with a sentinel rather than a second boolean, because there are only two states to
  // distinguish and the sentinel is checked in exactly one place.
  int32 sleep_timer_fade_seconds = 12;

  // PRODUCT_SPEC PLAY-008 — "requires explicit opt-in". `false` by default, which proto3 gives free.
  bool sleep_timer_shake_to_restart = 13;

  // PRODUCT_SPEC PLAY-006 / PLAY-007 / PLAY-009 — the playback controls.
  //
  // Device-wide rather than per profile, for the same reason the sleep timer is: how fast somebody
  // listens and how far a skip jumps are properties of the person holding the phone, not of whichever
  // account is signed in. A profile switch that silently reset the speed to 1.0x would be a bug the user
  // could not explain.
  //
  // Zero means "not chosen" throughout, and the reader substitutes the model's default. That is what lets
  // a default change in a later build reach a user who never opened the setting — and it is why the speed
  // is stored in hundredths as an int rather than as a float, where 0.0 and "unset" would be the same
  // bits and a rounding error could persist forever.
  int32 default_speed_hundredths = 14;
  int32 skip_back_seconds = 15;
  int32 skip_forward_seconds = 16;

  // PRODUCT_SPEC PLAY-009 — "disabled by default". The four amounts are still stored while disabled, so
  // turning it back on restores what the user chose rather than the factory bands.
  bool auto_rewind_enabled = 17;
  int32 auto_rewind_short_seconds = 18;
  int32 auto_rewind_medium_seconds = 19;
  int32 auto_rewind_long_seconds = 20;
  int32 auto_rewind_very_long_seconds = 21;

  // A `BufferPreset` name rather than an enum defined here, for the reason `library_sort_order` gives: an
  // enum would have to be kept in step across a module boundary and a renumbered constant reads back as a
  // different preset, silently. A name that no longer resolves falls back to Automatic.
  string buffer_preset = 22;

  // PRODUCT_SPEC PLAY-009 — the four amounts are meaningless without knowing whether the user has ever
  // touched them. Proto3 cannot distinguish "stored 0" from "never written" for an int, and 0 seconds is
  // a legitimate choice for the short bucket, so this flag carries what the zeros cannot.
  bool auto_rewind_configured = 23;

  // PRODUCT_SPEC PLAY-008 / PLAY-009 — how far to rewind when the *sleep timer* stopped playback.
  //
  // Separate from the auto-rewind bands above, and deliberately so. Those answer "you paused and came
  // back"; this answers "you fell asleep", and the honest amount for the second is minutes rather than
  // seconds — a listener who dozed off does not know when, only that the last thing they remember was a
  // while before the timer fired.
  //
  // Zero means off, and off is also the default, so unlike the auto-rewind bands this needs no companion
  // "configured" flag: "never set" and "set to off" want the same behaviour and always will. A feature
  // that moves a listener's position without being asked cannot acquire a non-zero default later.
  int32 sleep_timer_rewind_seconds = 24;

  // PRODUCT_SPEC ROUTE-001 / ROUTE-003 — whether a car head unit connecting should start the last book.
  //
  // Off by default, and it is the only setting in this file that can cause audio to begin without anyone
  // pressing anything. ROUTE-002 says auto-play "requires explicit user selection"; until per-device
  // policy exists this is the single global switch, and the UI has to say what it does.
  bool auto_play_on_car_connect = 26;

  // Field 27 held `finished_threshold_seconds`, a per-device finished threshold. It is gone: the rule is
  // the library's `markAsFinishedTimeRemaining`, read from the server, and this app keeps no competing
  // number. There is nothing on the server to synchronise a per-listener value with — the user object has
  // no settings field at all — so a device-local one could only ever disagree with the web interface.
  // See ADR-0013.
  //
  // Reserved, not reused. Build 0.9.2 wrote this field on a device, and a new field numbered 27 would read
  // those bytes as its own.
  reserved 27;
  reserved "finished_threshold_seconds";

  // PRODUCT_SPEC DL-004 / ADR-0018 decision 5 — what each kind of traffic may use.
  //
  // Wi-Fi is always allowed and is not a setting: turning it off would leave a category with no network at
  // all, which is not a preference anybody has. So each category is one boolean — *may this also use
  // cellular* — which is exactly the owner's words: "you should be able to turn cellular on for downloads
  // and smart download, but you can't turn off wifi".
  //
  // The defaults differ, and the difference is the point. Streaming a chapter costs a few megabytes and
  // somebody pressing play on a train wants it to work; downloading a book costs hundreds and is almost
  // always something they meant to do at home. So:
  //
  //   streaming        — cellular ON by default
  //   manual downloads — cellular OFF by default
  //   smart downloads  — cellular OFF by default
  //
  // Stored as *disable* flags for the one that defaults to on, and *enable* flags for the two that default
  // to off, so that a zero-valued proto — a device that has never opened this screen — reads back as the
  // product default. That is proto3's only way to distinguish "unset" from "set to false", and getting it
  // wrong would silently flip a default for every existing install.
  bool streaming_cellular_disabled = 28;
  bool downloads_cellular_enabled = 29;
  bool smart_downloads_cellular_enabled = 30;

  // PRODUCT_SPEC DL-005 / ADR-0018 decision 1 — download the next book in a series at the halfway mark.
  //
  // Off by default. It spends storage and data on a book nobody asked for, which is a reasonable thing to
  // want and a rude thing to assume.
  bool smart_download_enabled = 31;

  // PRODUCT_SPEC DL-006 / ADR-0018 decision 7 — remove a finished book after this many days.
  //
  // Zero is off, which is also the default: deleting somebody's audiobook because a timer expired is the
  // most destructive thing this app can do on its own, and it happens only when explicitly asked for.
  int32 delete_finished_after_days = 32;

  // Decision 7's second half — when smart download fetches the next book in a series, remove the one
  // before it. Off by default, and meaningless unless smart download is on.
  bool delete_previous_on_smart_download = 33;

  // PRODUCT_SPEC DL-003 / ADR-0018 decision 4 / ADR-0020 — which storage volume downloads are written to.
  //
  // The volume's UUID as `StorageManager` reports it, or empty for the device's own internal storage —
  // which is both the default and what proto3's zero value means here, so no inversion is needed.
  //
  // A UUID and not a path. A removable volume's mount path is not stable across reboots or across
  // devices, so a stored path would resolve to the wrong place or to nothing; the UUID is what the volume
  // itself is called. A UUID that no longer resolves — the card was removed — falls back to internal for
  // *new* downloads, and existing ones keep the absolute URIs their manifest already holds.
  string download_storage_volume_uuid = 34;

  // PRODUCT_SPEC ROUTE-002 / SET-002 (Devices) — what to do when each known output device connects.
  //
  // Keyed by the app's own device id — a kind and an advertised name, never a hardware address. See
  // `KnownDevice` for why that is the minimum-permission choice and what it costs.
  //
  // A device absent from this map is a device never seen, and it gets `DevicePolicy.Default`. A device
  // present with `DEVICE_POLICY_UNSPECIFIED` gets the same, which is what makes the proto3 zero value safe
  // here: unset and "arm only" really are the same answer.
  map<string, KnownDevice> known_devices = 35;

  // PRODUCT_SPEC PLAY-002 — what a transient interruption does. The zero value is `pause`, which is the
  // requirement's default, so an install that predates this field behaves exactly as it did.
  FocusBehaviour focus_behaviour = 36;

  // PRODUCT_SPEC ROUTE-003 — what opening the app does to the player. The zero value is "nothing until a
  // media command", which is both the safe answer and what the app did before this field existed.
  StartupMode startup_mode = 37;

  // PRODUCT_SPEC SET-002 (Appearance/accessibility) — the language the app draws itself in.
  //
  // A BCP 47 tag (`en`, `nb`), or empty for "follow the system" — which is both the default and proto3's
  // zero value, so an install that predates this field keeps behaving exactly as it did.
  //
  // A tag rather than an enum, deliberately. The set of languages this app ships is a *resource* fact: it
  // grows when somebody adds a `values-xx` directory, and an enum in this file would have to be edited in
  // step or the new translation would be unreachable. A tag no build recognises reads back as "follow the
  // system", which is visible and harmless — see `AppLanguage.ofTag`.
  string app_language_tag = 38;

  // PRODUCT_SPEC 6.4 step 6 "the app queues the next book" — whether finishing a book starts the next one
  // in its series.
  //
  // Stored **inverted** on purpose. The feature is on by default, and proto3's zero value for a bool is
  // false, so a field named `auto_advance_series` would read back as *off* for every install that predates
  // it — turning a default into a silent opt-out nobody chose. Naming the field for the non-default state
  // makes the zero value mean "the default", which is the same trick `startup_mode` gets from having its
  // safe answer at zero.
  bool auto_advance_series_disabled = 39;
}

// PRODUCT_SPEC SET-001 — one account's view preferences.
//
// Nothing here is a credential or an identifier of the user. It is how they last left a screen.
message ProfileSettings {
  // PRODUCT_SPEC 6.1 step 9 — the library this profile opens on. Empty means no choice has been made,
  // which is not the same as a choice of "all": the home shelf spans every granted library by default,
  // and this narrows it only once the user picks one.
  string default_library_id = 1;

  // PRODUCT_SPEC LIB-002 — sort order per library, keyed by library id.
  //
  // The value is a `BookSortOrder` name rather than an enum defined here, deliberately. An enum would
  // have to be kept in step with the domain type across a module boundary, and the failure mode of
  // getting that wrong is silent: a renumbered constant reads back as a different order. A name that
  // no longer resolves falls back to the default instead, which is visible and harmless.
  map<string, string> library_sort_order = 2;

  // The order used on the home shelf, which spans libraries and so has no library id to key on.
  string shelf_sort_order = 3;
}

// PRODUCT_SPEC ROUTE-002 — one output device this app has seen.
message KnownDevice {
  // What the device calls itself. Shown as-is; ROUTE-002 forbids hardware addresses in ordinary UI, and
  // this is not one.
  string display_name = 1;
  DeviceKind kind = 2;
  DevicePolicy policy = 3;
  // Wall-clock, for ordering the settings list by recency.
  int64 last_seen_epoch_millis = 4;
}

// The zero value is the product default on purpose: ROUTE-002 says every new device is `Arm only`, so a
// device stored before this field existed, or written by a build that did not set it, behaves correctly.
enum DevicePolicy {
  DEVICE_POLICY_UNSPECIFIED = 0;
  DEVICE_POLICY_ARM_ONLY = 1;
  DEVICE_POLICY_NEVER = 2;
  DEVICE_POLICY_AUTO_PLAY = 3;
  DEVICE_POLICY_ASK = 4;
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_WIRED = 1;
  DEVICE_KIND_BLUETOOTH = 2;
  DEVICE_KIND_CAR = 3;
  DEVICE_KIND_HEARING_AID = 4;
  DEVICE_KIND_SPEAKER = 5;
  DEVICE_KIND_OTHER = 6;
}

// PRODUCT_SPEC PLAY-002. Zero is `pause` because that is the stated default and because an unset field must
// never be the option that keeps making noise.
enum FocusBehaviour {
  FOCUS_BEHAVIOUR_PAUSE = 0;
  FOCUS_BEHAVIOUR_DUCK = 1;
}

// PRODUCT_SPEC ROUTE-003. Zero is "only on a media command", which satisfies "app launch alone never starts
// playback by default" for every install, including one upgrading from a build with no such setting.
enum StartupMode {
  STARTUP_MODE_ON_MEDIA_COMMAND = 0;
  STARTUP_MODE_RESTORE_PAUSED = 1;
  STARTUP_MODE_RESUME_ON_OPEN = 2;
}

enum ThemeMode {
  THEME_MODE_UNSPECIFIED = 0;
  THEME_MODE_SYSTEM = 1;
  THEME_MODE_LIGHT = 2;
  THEME_MODE_DARK = 3;
}
